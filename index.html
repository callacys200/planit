  .callist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .callist li:last-child{border-bottom:0}
  .callist input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);
    border-radius:8px;background:none;flex:none}
  .calname{flex:1;min-width:0;margin:0;padding:7px 9px;font-size:13.5px}
  .calcount{flex:none;min-width:26px;text-align:right;font-family:"DM Mono",monospace;
    font-size:12px;color:var(--ink35)}
  .calpick{padding:4px 7px;font-size:12px;max-width:124px}

  /* A grey completion behind the caret. The ghost and the real field share a
     font, a size and a padding exactly, or the grey drifts off the text. */
  /* The wrapper is a span sitting inside a label, so the label's own rule for
     direct spans would otherwise style what you type as a heading. */
  .sugwrap{position:relative;display:block}
  .field > span.sugwrap{font-size:inherit;font-weight:400;color:var(--ink);margin-bottom:0}
  .sugwrap input,.sugwrap textarea{position:relative;background:transparent;z-index:1}
  .sugghost{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    padding:9px 11px;border:1px solid transparent;border-radius:8px;
    font:inherit;font-size:13.5px;line-height:inherit;white-space:pre-wrap;word-break:break-word;
    color:transparent}
  .sugwrap:not(.ta) .sugghost{white-space:pre;line-height:normal;display:flex;align-items:center}
  .sugreal{visibility:hidden}
  .sugadd{color:var(--ink35);opacity:.8}
  .sugtip{position:absolute;right:9px;bottom:8px;z-index:2;pointer-events:none;
    font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.04em;
    color:var(--ink35);border:1px solid var(--line);border-radius:8px;
    padding:1px 4px;background:var(--card);opacity:.9}
  .sugwrap:not(.ta) .sugtip{top:50%;bottom:auto;transform:translateY(-50%)}
  /* the field must keep its own background, or the ghost shows through it */
  .field .sugwrap input,.field .sugwrap textarea{background:var(--soft)}
  .field .sugwrap input:focus,.field .sugwrap textarea:focus{background:transparent}
  .field .sugwrap{background:var(--soft);border-radius:8px}
  @media (prefers-reduced-motion: reduce){ .sugadd{opacity:.8} }

  /* the microphone and the speaker, in the corner of a field */
  .sugvoice{position:absolute;right:7px;bottom:7px;z-index:3;display:flex;gap:4px}
  .sugwrap:not(.ta) .sugvoice{top:50%;bottom:auto;transform:translateY(-50%)}
  .sugwrap:not(.ta) .sugtip{right:62px}
  .sugwrap.ta .sugtip{right:62px}
  .voicebtn{display:grid;place-items:center;width:26px;height:26px;flex:none;padding:0;
    border:1px solid var(--line);border-radius:7px;background:var(--card);
    color:var(--ink35);cursor:pointer;transition:color .14s ease, border-color .14s ease}
  .voicebtn:hover{color:var(--accent);border-color:var(--accent)}
  .voicebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .voicebtn.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .voicebtn.mic.on{animation:micpulse 1.1s ease-in-out infinite}
  @keyframes micpulse{50%{opacity:.62}}
  @media (prefers-reduced-motion: reduce){ .voicebtn.mic.on{animation:none} }
  @media (hover:none){ .voicebtn{width:30px;height:30px} }
  .addvoice{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:2}
  /* why dictation stopped, said where the button is rather than nowhere */
  .micbad{position:absolute;right:0;top:calc(100% + 6px);z-index:6;max-width:240px;
    padding:7px 10px;border-radius:7px;background:var(--rule);color:#fff;
    font-size:11.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .voicerow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .voicenote{font-size:11.5px;color:var(--ink35);line-height:1.5}

  /* ---- the bragsheet ----
     One line per entry, read top to bottom. Weight carries the ordering: the
     number on the left is the only chrome, and everything else is text. */
  .sheetwrap{max-width:860px}
  .sheethead{margin:4px 0 10px}
  .sheet{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .sheetrow{display:flex;align-items:flex-start;gap:12px;padding:13px 2px;
    border-bottom:1px solid var(--line)}
  .sheetrow.done{opacity:.66}
  /* down the side of a bragsheet row, so the whole column reads at a glance */
  /* A column of five, so a row's importance reads without a number. Smaller
     here than anywhere else, including on a touch screen: a full-size stack
     would be taller than the row it is marking. */
  .sheetprio{flex:none;display:flex;flex-direction:column;align-items:center;
    width:16px;padding-top:4px}
  .sheetprio .balls{flex-direction:column;gap:4px}
  .sheetprio .balls .ball,.sheetprio .balls i{width:10px;height:10px;border-width:1.25px}
  .sheetmain{flex:1;min-width:0;display:block;text-align:left;border:0;background:transparent;padding:0}
  .sheetmain:hover .sheettop b{text-decoration:underline;text-underline-offset:3px}
  .sheettop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sheettop b{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 92;
    font-weight:700;font-size:15.5px;letter-spacing:-.012em;color:var(--ink)}
  .sheetrole{font-size:12.5px;color:var(--ink35)}
  .sheetmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .sheetdesc{display:block;margin-top:7px;font-size:13px;color:var(--ink60);line-height:1.55;max-width:70ch}
  .sheetdesc.quiet{color:var(--ink35);font-style:italic}
  .sheetnext{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12.5px;color:var(--ink60)}
  .sheetnext i{width:4px;height:4px;border-radius:99px;background:var(--accent);flex:none}
  .sheetgo{flex:none}
  .sheetfoot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  @media (max-width:560px){
    .sheetgo{display:none}
    .sheetrow{gap:9px}
  }

  /* what to do next, pulled from what is already written down */
  .recnext{border:1.5px solid var(--line);border-radius:8px;background:var(--card);
    padding:15px 16px;margin-bottom:22px}
  .recnext ul{list-style:none;margin:0;padding:0}
  .recnext li + li{border-top:1px solid var(--line)}
  .recrow{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
    border:0;background:transparent;padding:9px 0}
  .recrow:hover .recwhat{color:var(--ink)}
  .recact{flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:12.5px;font-weight:600;color:var(--ink)}
  .recwhat{flex:1;min-width:0;font-size:13.5px;color:var(--ink60)}
  .recwhen{flex:none;font-size:11px;color:var(--ink35);font-family:"DM Mono",monospace}
  .recnote{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);
    font-size:12px;color:var(--ink35);line-height:1.5}
  @media (max-width:520px){
    .recrow{flex-direction:column;gap:2px}
    .recact{max-width:100%}
  }

  /* choosing what each line shows */
  .fieldpick{margin-bottom:16px}
  .fieldpick p{margin:0 0 11px;font-size:12.5px;color:var(--ink35)}
  .pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px}
  .pickone{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink60)}
  .pickone input{width:15px;height:15px;flex:none}

  /* the detail panel */
  .detailtape{margin:-2px 0 16px}
  .upnext{border-left:3px solid var(--accent);background:var(--soft);
    padding:10px 13px;border-radius:0 5px 5px 0;margin-bottom:16px}
  .upnext b{display:block;font-size:14px;margin-top:3px;color:var(--ink)}
  .upnext small{display:block;font-size:11.5px;color:var(--ink35);margin-top:3px}
  .steplist{list-style:none;margin:0 0 10px;padding:0}
  .steplist li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;
    border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink60)}
  .steplist li:last-child{border-bottom:0}
  .steplist li > span{flex:1;min-width:0;line-height:1.5}
  .steplist li > span.done{text-decoration:line-through;color:var(--ink35)}
  .goalmonth{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink35);
    font-weight:400;margin-right:7px;white-space:nowrap}

  /* the shared add-a-row list */
  .loglist ul{list-style:none;margin:0 0 10px;padding:0;border-top:1px solid var(--line)}
  .loglist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .logcells{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .logcell{font-size:13.5px;color:var(--ink60)}
  .logcell.mono{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink35);flex:none}
  .logcell.num{color:var(--ink);font-weight:500}
  .logempty{margin:0 0 12px;font-size:12.5px;color:var(--ink35);line-height:1.6;max-width:60ch}
  .logtotal{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:9px 11px;margin-bottom:12px;background:var(--soft);border-radius:8px;
    font-size:12.5px;color:var(--ink60)}
  .logtotal b{font-size:16px;color:var(--ink)}
  .logadd{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .logadd .finput{flex:1;min-width:92px;margin:0;padding:7px 9px;font-size:13px}
  .logadd .finput[type=date]{flex:0 0 136px}
  .logadd .finput[type=number]{flex:0 0 92px}
  .logadd select.finput{flex:0 0 140px}
  .logadd .btn{flex:none}
  @media (max-width:520px){
    .logadd{flex-direction:column;align-items:stretch}
    .logadd .finput,.logadd .finput[type=date],.logadd .finput[type=number],.logadd select.finput{flex:1 1 auto}
  }

  /* preset or custom, and the preset's own table */
  .shapepick{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 0 13px;margin-bottom:15px;border-bottom:1px solid var(--line)}
  .presetgate{padding:2px 0}
  .gateline{margin:0 0 14px;font-size:13px;color:var(--ink60);line-height:1.6;max-width:60ch}
  .presettable .field{margin-bottom:17px}
  .slotnote{margin:11px 0 0;padding:11px 13px;background:var(--soft);border-radius:6px;
    font-size:12px;color:var(--ink60);line-height:1.65}
  .chip.thisyear{box-shadow:inset 0 0 0 1px var(--accent)}

  /* the hours on one activity */
  .hoursbox{display:block}
  .hourstotal{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:11px 13px;background:var(--soft);border-radius:6px;font-size:12.5px;color:var(--ink60)}
  .hourstotal b{font-size:21px;color:var(--ink)}
  .quickhours{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:12px 0}
  .quickhours .eyebrow{margin:0}
  .autohours{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px;
    padding:11px 13px;border:1px solid var(--line);border-radius:6px;
    font-size:12.5px;color:var(--ink60);line-height:1.6}
  .autohours > span{flex:1 1 180px;min-width:0}
  .autohours b{color:var(--ink)}
  .autohours .finput{margin:0;padding:7px 9px;font-size:13px}

  /* awards, which are more than one line each */
  .awardlist{display:block}
  .awardrows{list-style:none;margin:0 0 13px;padding:0;border-top:1px solid var(--line)}
  .awardrows li{display:flex;align-items:flex-start;gap:10px;padding:11px 0;
    border-bottom:1px solid var(--line)}
  .awardmain{flex:1;min-width:0}
  .awardmain b{display:block;font-size:14px;color:var(--ink);line-height:1.4}
  .awardmeta{display:block;font-size:11.5px;color:var(--ink35);margin-top:3px}
  .awarddetail{display:block;font-size:12.5px;color:var(--ink60);margin-top:5px;line-height:1.6}
  .awardform{padding:15px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}
  .awardform .field:last-of-type{margin-bottom:14px}
  .checkrow{display:flex;gap:7px 18px;flex-wrap:wrap}
  .checkbit{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink60);
    font-weight:500}
  .checkbit input{width:15px;height:15px;flex:none}
  .placerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .placerow .finput{margin:0;padding:8px 10px;font-size:13px;flex:0 1 128px;min-width:0}
  .placerow > span{font-size:12.5px;color:var(--ink35);flex:none}

  /* teachers: one card per class, this year's on top */
  .tlead{margin:6px 0 0;font-size:13px;color:var(--ink60);line-height:1.6;max-width:56ch}
  .tcard{border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:10px;
    overflow:hidden}
  .tcard.open{border-color:var(--ink35)}
  .tcard-top{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;
    border:0;background:transparent;text-align:left;color:var(--ink35);cursor:pointer}
  .tcard-top:hover{background:var(--soft)}
  .tcard-dot{width:11px;height:11px;flex:none;border-radius:3px}
  .tcard-what{flex:1;min-width:0}
  .tcard-what b{display:block;font-size:14.5px;color:var(--ink);letter-spacing:-.012em}
  .tcard-what span{display:block;font-size:12px;color:var(--ink35);margin-top:2px}
  .tcard-body{padding:4px 14px 14px;border-top:1px solid var(--line)}
  .tcard-why{margin:0 0 11px;padding:10px 12px;background:var(--soft);border-radius:6px;
    font-size:12px;color:var(--ink60);line-height:1.65}
  .pastyears{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
  .pastcard{margin-top:10px;padding:12px 13px;border:1px solid var(--line);border-radius:8px;
    background:var(--soft)}
  .pastcard b{font-size:14px;color:var(--ink)}
  .pastwho{font-size:12.5px;color:var(--ink35);margin-top:2px}
  .pastline{margin:8px 0 0;font-size:13px;color:var(--ink60);line-height:1.6}
  .pastline.quiet{color:var(--ink35)}

  /* the academic record's own preview */
  .acadprev{margin-top:4px;padding-top:12px;border-top:1px dashed var(--line);
    font-size:13.5px;color:var(--ink60);line-height:1.7}

  /* ---- calendar feed panel, under the monthly calendar ---- */
  .cvpanel{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
  .cvhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
    background:transparent;padding:13px 14px}
  .cvhead:hover{background:var(--soft)}
  .cvrule{width:3px;height:30px;border-radius:7px;background:var(--org);flex:none}
  .cvtitle{flex:1;min-width:0}
  .cvtitle b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .cvtitle small{display:block;font-size:12.5px;color:var(--ink35);margin-top:1px}
  .cvchev{flex:none;color:var(--ink35);display:grid;place-items:center}
  .cvbody{border-top:1px solid var(--line);padding:15px 14px 16px}
  .cvlist{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:8px}
  .cvlist li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 12px;border-bottom:1px solid var(--line)}
  .cvlist li:last-child{border-bottom:0}
  .cvinfo{flex:1;min-width:0}
  .cvinfo b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .cvinfo small{display:block;font-size:11.5px;color:var(--ink35);margin-top:1px}
  .cvbtns{display:flex;gap:7px;flex:none}
  .cvadd{border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
  .cvlist + .cvadd{margin-top:0}
  /* The feeds keep themselves current, so this line reports; it does not ask. */
  .cvstatus{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 14px}
  .cvstate{flex:1;min-width:180px;font-size:12.5px;color:var(--ink35)}
  .cvdot{flex:none;width:7px;height:7px;border-radius:99px;background:var(--line)}
  .cvdot.on{background:var(--accent);animation:cvpulse 1.1s ease-in-out infinite}
  @keyframes cvpulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .cvdot.on{animation:none;opacity:1} }
  .cvsteps{margin:0 0 14px;font-size:13px;color:var(--ink60);line-height:1.6;max-width:62ch}
  .cvsteps b{color:var(--ink)}
  /* where to find a feed: the three places students actually have one */
  .cvwhere{margin:0 0 16px;padding:0;max-width:62ch;
    display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
  .cvwhere dt{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
  .cvwhere dd{margin:0;font-size:12.5px;color:var(--ink35);line-height:1.5}
  .cvwhere dd b{color:var(--ink60);font-weight:600}
  @media(max-width:520px){
    .cvwhere{grid-template-columns:1fr;gap:1px}
    .cvwhere dd{margin-bottom:9px}
  }
  .cvfine{margin:12px 0 0;font-size:12px;color:var(--ink35);line-height:1.55;max-width:62ch}

  .legaldoc{font-size:13.5px;line-height:1.65;color:var(--ink60)}
  .legaldoc h4{font-family:"Bricolage Grotesque",sans-serif;font-size:14.5px;color:var(--ink);margin:20px 0 5px}
  .legaldoc h4:first-of-type{margin-top:12px}
  .legaldoc p{margin:0 0 8px;max-width:68ch}
  .legaldoc p:last-child{margin-bottom:0}
  .legaldate{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink35);
    padding-bottom:12px;border-bottom:1px solid var(--line)}
  .legaldoc ul{margin:0 0 10px;padding-left:18px}
  .legaldoc li{margin-bottom:3px}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .plan{border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;background:var(--card);position:relative}
  .plan.best{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .planflag{position:absolute;top:-10px;left:18px;background:var(--accent);color:var(--accent-ink);
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.04em}
  .planname{font-size:13px;color:var(--ink35);font-weight:500}
  .planprice{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0 12px}
  .planprice small{font-size:13px;font-weight:500;color:var(--ink35)}
  .plan ul{list-style:none;padding:0;margin:0 0 16px;font-size:13px;color:var(--ink60)}
  .plan li{padding:5px 0 5px 18px;position:relative;line-height:1.45}
  .plan li::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:4px;
    border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
  .planalt{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink60)}
  .procard{border:1px solid var(--line);border-radius:var(--r);padding:22px;background:var(--card)}
  .prohead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
  .prohead h3{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;margin-top:2px}
  .proprice{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800}
  .proprice small{font-size:13px;font-weight:500;color:var(--ink35)}
  .prolist{list-style:none;padding:0;margin:0 0 20px;font-size:14px;color:var(--ink60)}
  .prolist li{padding:7px 0 7px 24px;position:relative;line-height:1.5}
  .prolist li::before{content:"";position:absolute;left:2px;top:15px;width:9px;height:5px;
    border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
  a.btn.wide{text-decoration:none}


  /* ---------- avatar ---------- */
  .initial{border-radius:99px;display:grid;place-items:center;flex:none;color:#fff;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;line-height:1;text-transform:uppercase}
  .railav{border:1px solid var(--line)}

  /* ---------- dark theme ---------- */
  /* The palette tokens carry both modes, so there is almost nothing left to
     override here. These are the rules where dark is a different decision,
     not a different colour: a translucent white hover needs a dark surface
     under it, and the month grid inverts which side the hairline sits on. */
  [data-theme="dark"] .pill{background:var(--soft) !important;color:var(--ink60)}
  [data-theme="dark"] .asleep{background:repeating-linear-gradient(135deg,
    var(--paper),var(--paper) 6px,var(--soft) 6px,var(--soft) 12px)}
  [data-theme="dark"] .respaper,[data-theme="dark"] .respaper *{color-scheme:light}

  @media (max-width:960px){
    .sched-wrap,.lockgrid{grid-template-columns:1fr}
    .ec{grid-template-columns:1fr}
    .ec .side{border-left:0;border-top:1px solid var(--line)}
    .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  /* Netlify's badge, by every name it has used. Guessing at class names was
     not enough, so there is a script below that goes by what the thing says
     rather than what it calls itself. */
  [id*="netlify" i], [class*="netlify" i], .netlify-badge, #netlify-badge,
  a[href*="netlify.com"], a[href*="netlify.app/?utm"], div[data-netlify-badge],
  [aria-label*="netlify" i], [title*="netlify" i]{display:none !important}
  /* sits above the home indicator, out of the way of the schedule */
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;
    width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
    font-size:32px;font-weight:300;line-height:1;padding:0 0 4px;
    transition:.14s}
  .fab:active{transform:scale(.94)}
  .menubtn{display:none}
  @media (max-width:720px){
    /* the rail slides away entirely, so the planner gets the whole screen */
    .rail{position:fixed;left:0;top:0;bottom:0;width:216px;padding:16px 0 16px 12px;z-index:70;
      background:var(--surface);transform:translateX(-102%);transition:transform .25s cubic-bezier(.3,.8,.3,1);
      box-shadow:none}
    .railopen .rail{transform:none;border-right:1px solid var(--line)}
    .railscrim{position:fixed;inset:0;z-index:65;background:rgba(22,25,27,.45);animation:fade .2s ease}
    .pane{border:0}
    .menubtn{display:grid;place-items:center;position:fixed;left:10px;top:10px;z-index:80;
      width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);
      color:var(--ink)}
    /* the menu button sits over the top-left corner, so the section name
       steps aside for it while everything below keeps the left margin */
    .title-wrap{padding-left:46px;min-height:38px;align-items:center}
    /* the wordmark goes; the mark alone is enough at this size.
       The close button is fixed over the top-left corner and floats above the
       open rail, so the mark steps right to clear it instead of sitting under
       it. 42px here plus the rail's own 12px puts it past the 48px button. */
    .brand b{display:none}
    .brand{justify-content:flex-start;padding:2px 0 14px 42px}
    .brand .logomark{width:52px !important;height:52px !important}
    /* page subtitles and section hints are noise on a small screen */
    .tagline,.sethint{display:none}
    .pane-head{padding:16px 14px 0}
    .pane-body{padding:14px 14px 40px}
    h1{font-size:23px}
    .month .cell{min-height:74px}
    .week{grid-template-columns:1fr}
    .navdate .cur{min-width:110px;font-size:12.5px}

    /* The landing page's laptop mockup is built from these same classes, so on
       a phone it was being given the phone layout and losing its sidebar: a
       picture of the desktop with no desktop in it. Inside that mockup the
       desktop values are restored. The phone mockup beside it is left alone,
       because there the phone layout is exactly the point. */
    .shot-desktop .rail{position:static;transform:none;width:210px;flex:none;
      padding:18px 0 18px 14px;z-index:auto;border-right:1px solid var(--line)}
    .shot-desktop .brand{justify-content:flex-start;padding:2px 8px 16px 4px}
    .shot-desktop .brand b{display:block}
    .shot-desktop .brand .logomark{width:40px !important;height:40px !important}
    .shot-desktop .title-wrap{padding-left:0;min-height:0}
    .shot-desktop .tagline{display:block}
    .shot-desktop .pane-head{padding:22px 26px 0}
    .shot-desktop .pane-body{padding:18px 26px 40px}
    .shot-desktop h1{font-size:30px}
    .shot-desktop .week{grid-template-columns:repeat(7,minmax(0,1fr))}
  }
  @media (max-width:560px){
    .modal-foot,.timerbtns{grid-auto-flow:row;grid-auto-columns:auto;justify-content:stretch}
    .modal-foot > *,.timerbtns > *{width:100%;justify-content:center}
    :root{--gut:46px}
    .pane-head{padding:14px 12px 0}
    .title-wrap{padding-left:48px}
    .dayhead{padding-bottom:10px}
    .pane-body{--panepad:12px;padding:var(--panepad) 12px 40px}
    .pane{border-radius:8px 0 0 3px}
    .grid2{grid-template-columns:minmax(0,1fr)}
    /* but times and dates stay paired in a dialog, so the editor stays short */
    .modal .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
    .modal-body{padding:14px 16px}
    .modal-head{padding:16px 16px 0}
    .modal-foot{padding:0 16px 16px}
    .hourrow .h{font-size:10px;padding:4px 6px 0}
    .cell{min-height:66px;padding:5px 5px}
    .cell .ev{font-size:10px;gap:3px;margin-top:3px}
    .cell .dnum{font-size:11px}
    .dow{padding:6px 5px;font-size:10px}
    .dial-num{font-size:44px}
    .spread{gap:10px}
    .navdate .cur{min-width:96px}
    h1{font-size:21px}
    .ec .side{padding:12px 14px}
  }
  /* ================= LANDING PAGE ================= */
  .lpage{min-height:100%;background:var(--paper);position:relative;overflow-x:clip}
  @supports not (overflow-x:clip){ .lpage{overflow-x:hidden} }
  .lpage main{display:block;position:relative;z-index:1}
  .anchorpoint{position:relative;top:-70px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .lhero,.lopen,.lall,.ldemo,.lfeat,.lmerge,.lecd,.lteam,.lsup,.lend{
    max-width:1140px;margin:0 auto;padding:0 32px}
  .lpage h2{font-size:clamp(25px,3.2vw,40px);line-height:1.08;letter-spacing:-.028em;max-width:010ch;max-width:21ch}
  .lpage h3{font-size:17px;letter-spacing:-.014em}
  /* the swipe behind a planner heading reads as clutter at marketing sizes */
  .lpage h1::after,.startpage h1::after{content:none}

  /* reveal on scroll, collapsed when motion is unwelcome */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .62s cubic-bezier(.2,.7,.3,1),transform .62s cubic-bezier(.2,.7,.3,1)}
  .reveal.in{opacity:1;transform:none}

  /* ---- stationery drifting behind everything ---- */
  .stationery{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;color:var(--ink)}
  .stationery svg{position:absolute;opacity:.085;will-change:transform}
  .st-pad{width:300px;top:96vh;left:-70px;transform:rotate(-11deg);animation:drift1 26s ease-in-out infinite alternate}
  .st-pencil{width:88px;top:188vh;right:-18px;transform:rotate(16deg);animation:drift2 31s ease-in-out infinite alternate}
  .st-clip{width:150px;top:292vh;left:58%;transform:rotate(-24deg);animation:drift3 24s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:rotate(-7deg) translate(26px,-30px)}}
  @keyframes drift2{to{transform:rotate(10deg) translate(-22px,34px)}}
  @keyframes drift3{to{transform:rotate(-19deg) translate(18px,-26px)}}

  /* ---- nav, pinned ---- */
  .lnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;
    padding:12px 32px;background:transparent;border-bottom:1px solid transparent;
    transition:background .25s ease,border-color .25s ease}
  .lnav.solid{background:var(--paper);border-bottom-color:var(--line)}
  .lnav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
    flex:none;border:0;background:transparent;padding:0}
  .lnav-brand b{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 88;
    font-weight:800;font-size:23px;letter-spacing:-.03em}
  .lnav-links{display:flex;gap:2px;margin-left:10px;flex:1}
  .lnav-links a{color:var(--ink60);text-decoration:none;font-size:14.5px;font-weight:500;
    padding:8px 13px;border-radius:7px}
  .lnav-links a:hover{color:var(--ink);background:var(--soft)}
  .lnav-cta{display:flex;align-items:center;gap:10px;flex:none}
  .lnav-login{border:0;background:transparent;color:var(--ink60);font-size:14px;font-weight:500;padding:7px 6px}
  .lnav-login:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .lnav-burger{display:none;flex-direction:column;gap:4px;border:1px solid var(--line);
    background:var(--card);border-radius:7px;padding:9px 8px}
  .lnav-burger i{display:block;width:16px;height:1.5px;background:var(--ink)}

  /* ---- hero over the photograph ---- */
  .lhero{position:relative;max-width:none;padding:0;min-height:min(86vh,760px);
    display:flex;align-items:flex-end;margin-top:-66px}
  .lhero-photo{position:absolute;inset:0;overflow:hidden}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
  .hero-dark{display:none}
  [data-theme="dark"] .hero-light{display:none}
  [data-theme="dark"] .hero-dark{display:block}
  /* the page colour fades up over the photo so the headline always has ground */
  .lhero-veil{position:absolute;inset:0;background:
    linear-gradient(180deg, rgba(var(--paper-rgb), .62) 0%,
                            rgba(var(--paper-rgb), .30) 38%,
                            rgba(var(--paper-rgb), .88) 78%,
                            rgba(var(--paper-rgb), 1) 100%)}
  .lhero-in{position:relative;z-index:1;max-width:1140px;margin:0 auto;width:100%;
    padding:0 32px 76px;opacity:0;transform:translateY(16px);
    transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}
  .lhero-in.in{opacity:1;transform:none}
  .lhero h1{font-size:clamp(34px,5vw,62px);line-height:1.02;letter-spacing:-.042em;max-width:24ch}
  .lhero-sub{margin:20px 0 0;font-size:clamp(15px,1.5vw,18px);line-height:1.55;
    color:var(--ink60);max-width:46ch}
  .lhero-cta{display:flex;align-items:center;gap:18px;margin-top:28px;flex-wrap:wrap}
  .lbig{padding:13px 24px;font-size:15.5px}
  .lhero-alt{border:0;background:transparent;color:var(--ink60);font-size:14.5px;font-weight:500;padding:6px 2px}
  .lhero-alt:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .lhero-ios{margin:18px 0 0;font-size:13px;color:var(--ink35)}

  /* ---- the handwritten line ---- */
  .hand{position:relative;display:inline-block;font-family:"Caveat",cursive;
    font-weight:600;line-height:1.1;color:var(--accent)}
  .hand-text{display:inline-block;clip-path:inset(0 100% 0 0)}
  .hand.writing .hand-text{animation:write 2.2s cubic-bezier(.32,.12,.3,1) var(--hand-delay,0ms) forwards}
  .hand-nib{position:absolute;left:0;bottom:.12em;width:2px;height:.82em;background:var(--accent);
    opacity:0;border-radius:7px}
  .hand.writing .hand-nib{animation:nib 2.2s cubic-bezier(.32,.12,.3,1) var(--hand-delay,0ms) forwards}
  .hand.done .hand-text{clip-path:none;animation:none}
  .hand.done .hand-nib{display:none}
  @keyframes write{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 -2% 0 0)}}
  /* the nib rides along the right edge of the reveal */
  @keyframes nib{
    0%{opacity:0;left:0}
    7%{opacity:.85}
    92%{opacity:.85}
    100%{opacity:0;left:100%}
  }

  /* ---- opener ---- */
  .lopen{padding-top:86px;padding-bottom:84px}
  .lopen-k{margin:0 0 14px;font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink35)}
  .lpage .lopen-h{font-size:clamp(42px,7.4vw,92px);line-height:1;letter-spacing:-.022em;max-width:none;margin:0}
  .lopen-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;margin-top:38px;
    padding-top:26px;border-top:1px solid var(--line)}
  .lopen-cols p{margin:0;font-size:16px;line-height:1.7;color:var(--ink60);max-width:46ch}
  .lopen-cols p:first-child{color:var(--ink)}

  /* ---- all in one ---- */
  .lall{padding-top:20px;padding-bottom:80px;text-align:center}
  .lall h2{max-width:none;margin:0 auto;font-size:clamp(26px,3.6vw,46px)}
  .lall > p{margin:20px auto 0;color:var(--ink60);font-size:15.5px;line-height:1.6;max-width:52ch}
  /* a blank on the page that keeps filling itself in */
  .carousel{position:relative;display:inline-grid;vertical-align:baseline;color:var(--accent);
    justify-items:center;padding:0 .18em;border-bottom:3px solid currentColor;overflow:hidden}
  .carousel-ghost{visibility:hidden;grid-area:1/1}
  .carousel-w{grid-area:1/1;opacity:0;transform:translateY(.3em) rotate(1.2deg);
    transition:opacity .3s ease,transform .36s cubic-bezier(.2,.8,.3,1);white-space:nowrap}
  .carousel-w.on{opacity:1;transform:none}
  .carousel-w.out{opacity:0;transform:translateY(-.3em) rotate(-1.2deg)}
  /* four ways in, one per part of PlanIt */
  .lall-row{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
    margin:34px 0 0;padding:26px 0 0;border-top:1px solid var(--line)}
  .lall-row li{opacity:0;transform:translateY(10px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.3,1)}
  .lall.in .lall-row li{opacity:1;transform:none}
  .lall-dot{display:flex;flex-direction:column;align-items:center;gap:3px;
    width:112px;padding:10px 4px 12px;border:0;border-radius:12px;background:transparent}
  .lall-ring{display:grid;place-items:center;width:62px;height:62px;border-radius:999px;
    border:1.5px solid var(--line);color:var(--fc);background:var(--card);
    margin-bottom:7px;transition:transform .2s cubic-bezier(.2,.8,.3,1),
      border-color .2s,background .2s,box-shadow .2s}
  .lall-dot b{font-size:14px;font-weight:600;letter-spacing:-.012em;color:var(--ink)}
  .lall-dot small{font-size:11.5px;color:var(--ink35)}
  .lall-dot:hover .lall-ring,.lall-dot:focus-visible .lall-ring{
    transform:translateY(-3px);border-color:var(--fc);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--fc) 13%, transparent)}
  .lall-dot:active .lall-ring{transform:translateY(-1px) scale(.96)}
  @supports not (color: color-mix(in srgb, red 50%, transparent)){
    .lall-dot:hover .lall-ring{box-shadow:none;background:var(--soft)}
  }
  @media (max-width:560px){
    .lall-row{gap:2px}
    .lall-dot{width:86px;padding:8px 2px 10px}
    .lall-ring{width:52px;height:52px}
    .lall-dot b{font-size:12.5px}
    .lall-dot small{font-size:10.5px}
  }

  /* ---- the live demo ---- */
  .ldemo{padding-top:16px;padding-bottom:86px}
  .ldemo-head{max-width:620px;margin-bottom:26px}
  .ldemo-head p{margin:16px 0 0;color:var(--ink60);font-size:15px;line-height:1.65}
  .demo-wrap{position:relative;touch-action:pan-y}
  .demo-wrap.held{touch-action:none}
  .demo-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .demo-try{font-family:"Caveat",cursive;font-size:24px;font-weight:600;color:var(--accent);
    display:inline-flex;align-items:center;gap:8px}
  .demo-try::after{content:"";width:34px;height:1.5px;background:var(--accent);opacity:.6}
  .demo-tips{flex:1;min-width:240px;font-size:12.5px;color:var(--ink35);line-height:1.5}
  /* A finger cannot drag the way a mouse can, so the instruction differs. */
  .demo-hold{display:none;flex:1;min-width:200px;font-size:12.5px;color:var(--ink35);line-height:1.5}
  @media (hover:none) and (pointer:coarse){
    .demo-tips{display:none}
    .demo-hold{display:block}
  }
  .demo-app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
  .demo-tray{min-width:0}
  .demo-grid{max-height:430px;overflow-y:auto;overscroll-behavior:contain;transition:outline-color .14s}
  .demo-grid.demo-over{outline:2px dashed var(--accent);outline-offset:3px}
  .demo-rename{width:100%;font:inherit;font-weight:600;font-size:13px;border:0;padding:0;
    background:transparent;color:var(--ink);outline:none}
  .demo-ghost{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);
    padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;opacity:.95}
  .stillwrap{pointer-events:none}

  /* ---- feature sections ---- */
  .lfeat{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:56px;
    align-items:center;padding-top:76px;padding-bottom:76px;border-top:1px solid var(--line)}
  .lfeat.flip .lfeat-text{order:2}
  .lfeat.flip .lfeat-art{order:1}
  .lfeat-text{min-width:0}
  .lfeat-art{min-width:0}
  .lfeat h2{margin:12px 0 0}
  .lfeat-text p{margin:16px 0 0;color:var(--ink60);font-size:15px;line-height:1.65;max-width:52ch}
  .lfeat-tight{padding-top:0;border-top:0}
  .lf-name{display:inline-flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque",sans-serif;
    font-variation-settings:"wdth" 90;font-weight:700;font-size:15px;letter-spacing:-.012em;color:var(--fc)}
  .lf-name::before{content:"";width:3px;height:17px;border-radius:7px;background:var(--fc)}
  .panelshot{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
  .bragyear{display:grid;grid-template-columns:48px minmax(0,1fr);gap:0;align-items:start}
  .bragy{font-size:11px;color:var(--ink35);padding-top:16px}

  /* ---- video slots ---- */
  .vslot{margin:0;position:relative}
  .vslot-frame{position:relative;border:1px solid var(--line);border-radius:8px;overflow:visible;
    background:var(--soft);aspect-ratio:16/10}
  .vslot-frame video{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
  .vslot-empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;
    gap:7px;text-align:center;padding:24px;border-radius:7px;
    background:repeating-linear-gradient(135deg,var(--soft),var(--soft) 10px,var(--card) 10px,var(--card) 20px)}
  .vslot-badge{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--ink35);
    border:1px solid var(--line);border-radius:7px;padding:2px 10px;background:var(--card)}
  .vslot-empty b{font-size:16px;letter-spacing:-.01em;color:var(--ink)}
  .vslot-empty span:last-child{font-size:12.5px;color:var(--ink35);max-width:30ch;line-height:1.5}

  /* ---- scatter into one calendar ---- */
  /* The task chips fly in from beyond the right edge. overflow-x on <html>
     clips them but still lets the page be dragged 42px sideways, so the
     section does its own clipping and the page stays put. */
  .lmerge{padding-top:86px;padding-bottom:86px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:center;
    overflow:hidden}
  .lmerge-text p{margin:16px 0 0;color:var(--ink60);font-size:15px;line-height:1.65;max-width:48ch}
  .lmerge-stage{position:relative;height:430px;min-width:0}
  .lmerge-slots{position:absolute;inset:0;border:1px solid var(--line);border-radius:8px;
    background:var(--card);display:grid;grid-template-rows:repeat(6,1fr)}
  .lmerge-slot{border-top:1px solid var(--line)}
  .lmerge-slot:first-child{border-top:0}
  .lmerge-chip{position:absolute;left:8%;right:8%;z-index:2;
    background:var(--soft);border:1px solid var(--line);border-left:3px solid;border-radius:7px 8px 8px 4px;
    padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink);
    transform:translate(calc(var(--sx) * (1 - var(--k))), calc(var(--sy) * (1 - var(--k))))
              rotate(calc(var(--sr) * (1 - var(--k))));
    box-shadow:none}

  /* ---- devices ---- */
  .ldevices{padding-top:86px;padding-bottom:40px;border-top:1px solid var(--line)}
  .ldevices-head{max-width:640px}
  .ldevices-head p{margin:16px 0 0;color:var(--ink60);font-size:15px;line-height:1.65}
  .ldevices-stage{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:30px;
    align-items:end;margin-top:42px}
  .shot-inner{transform-origin:top left}
  /* The planner clamps itself to the viewport so it can never overflow a real
     screen. Inside a mockup the frame is the screen, and that clamp squashed
     the 1180px laptop shot down to the width of the phone looking at it,
     leaving the rest of the frame blank. */
  .shot-inner .app{max-width:none;padding-top:0}
  .shot-view{overflow:hidden}
  .shot-desktop{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
  .shot-chrome{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);
    border-bottom:1px solid var(--line)}
  .shot-chrome i{width:9px;height:9px;border-radius:99px;background:var(--line);display:block}
  .shot-chrome span{margin-left:10px;font-size:10.5px;color:var(--ink35)}
  .phone-frame{border:9px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--ink)}
  .phone-screen{overflow:hidden;border-radius:21px;background:var(--paper);position:relative}
  .phone-status{display:flex;justify-content:space-between;padding:7px 16px 3px;font-size:11px;
    color:var(--ink35)}
  .phone-menu{position:absolute;left:22px;top:46px;display:flex;flex-direction:column;gap:4px;
    border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 8px}
  .phone-menu i{display:block;width:16px;height:1.5px;background:var(--ink)}

  /* ---- the running bragsheet on the landing page ----
     It has to read as the product, so it borrows the planner's restraint:
     hairlines, one accent, weight doing the work. */
  .lecd{padding-top:86px;padding-bottom:84px;border-top:1px solid var(--line)}
  .lecd-head{max-width:640px}
  .lecd-sub{margin:14px 0 0;color:var(--ink60);font-size:15px;line-height:1.65}
  .lecd-steps{display:flex;gap:0;flex-wrap:wrap;margin:34px 0 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .lecd-step{display:flex;align-items:center;gap:9px;flex:1 1 180px;
    padding:14px 14px 14px 0;border:0;background:transparent;text-align:left;
    font-size:13.5px;color:var(--ink35);transition:.14s}
  .lecd-step + .lecd-step{padding-left:18px;border-left:1px solid var(--line)}
  .lecd-step i{width:7px;height:7px;border-radius:99px;background:var(--line);flex:none;transition:.14s}
  .lecd-step:hover{color:var(--ink60)}
  .lecd-step.on{color:var(--ink);font-weight:600}
  .lecd-step.on i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .lecd-note{margin:14px 0 0;font-size:13.5px;color:var(--ink60);line-height:1.6;max-width:62ch;min-height:44px}
  .lecd-stage{margin-top:12px}

  .lecd-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .lecd-row{border-bottom:1px solid var(--line)}
  .lecd-row.open{background:var(--card);border-radius:7px}
  .lecd-top{display:flex;align-items:flex-start;gap:12px;padding:14px 10px 14px 2px}
  .lecd-prio{flex:none;display:flex;flex-direction:column;align-items:center;
    width:18px;padding-top:3px}
  .lecd-prio .balls{flex-direction:column;gap:5px}
  .lecd-main{flex:1;min-width:0;display:block;text-align:left;border:0;background:transparent;padding:0}
  .lecd-main:hover .lecd-name{text-decoration:underline;text-underline-offset:3px}
  .lecd-name{display:block;font-family:"Bricolage Grotesque",sans-serif;
    font-variation-settings:"wdth" 92;font-weight:700;font-size:15.5px;
    letter-spacing:-.012em;color:var(--ink)}
  .lecd-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--ink35)}
  .lecd-meta .win{color:var(--accent)}
  .lecd-chev{flex:none;color:var(--ink35);padding-top:3px}

  .lecd-panel{padding:0 10px 18px 40px}
  .lecd-tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
  .lecd-tabs button{border:0;background:transparent;padding:8px 14px 9px 0;margin-right:14px;
    font-size:12.5px;color:var(--ink35);border-bottom:2px solid transparent;margin-bottom:-1px}
  .lecd-tabs button:hover{color:var(--ink60)}
  .lecd-tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .lecd-body{font-size:13.5px;color:var(--ink60);line-height:1.6}
  .lecd-step-row{display:flex;align-items:center;gap:9px;padding:5px 0}
  .lecd-step-row i{width:4px;height:4px;border-radius:99px;background:var(--accent);flex:none}
  .lecd-goal{display:flex;align-items:baseline;gap:10px;margin-top:9px;padding:9px 11px;
    background:var(--soft);border-radius:8px}
  .lecd-goal b{font-size:11px;color:var(--ink35);font-family:"DM Mono",monospace;flex:none}
  .lecd-desc{margin:13px 0 0;padding-top:12px;border-top:1px dashed var(--line);color:var(--ink35)}
  .lecd-desc span{display:block}
  .lecd-quiet{margin:0;color:var(--ink35);max-width:58ch}
  .lecd-log{width:100%;border-collapse:collapse}
  .lecd-log td{padding:5px 10px 5px 0;border-bottom:1px solid var(--line)}
  .lecd-log .mono{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink35);white-space:nowrap}
  .lecd-log .num{color:var(--ink);font-weight:500}
  .lecd-total{display:flex;align-items:baseline;justify-content:space-between;
    padding:10px 11px;margin:11px 0;background:var(--soft);border-radius:8px;font-size:12.5px}
  .lecd-total b{font-size:16px;color:var(--ink)}
  .lecd-win{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  .lecd-win .mono{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink35);flex:none}
  .lecd-win b{flex:1;min-width:0;color:var(--ink);font-size:13.5px}
  .lecd-win .lvl{font-size:11.5px;color:var(--accent);flex:none}
  .lecd-story{margin:0;font-style:italic;color:var(--ink60);max-width:58ch;line-height:1.7}

  /* the résumé it builds, on paper */
  .lecd-res{display:grid;gap:14px;justify-items:center}
  .lecd-paper{width:100%;max-width:560px;background:#fff;color:#111;
    border:1px solid var(--line);border-radius:7px;padding:26px 30px;
    box-shadow:0 1px 0 var(--line)}
  .lecd-rhead h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;
    text-transform:uppercase;color:#111}
  .lecd-rhead div{font-size:11px;color:#444;margin-top:3px}
  .lecd-rsec{margin-top:14px;border-top:2px solid #111;padding-top:10px}
  .lecd-rsec h4{margin:0 0 9px;font-size:12px;font-weight:800;text-transform:uppercase;color:#111}
  .lecd-rsec article{margin-bottom:11px}
  .lecd-rline{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .lecd-rline .w{font-size:12.5px;font-weight:700;color:#111}
  .lecd-rline .d{font-size:10px;color:#444;white-space:nowrap;flex:none}
  .lecd-rorg{font-size:11px;color:#222;margin-top:1px}
  .lecd-rsec ul{margin:3px 0 0;padding-left:15px}
  .lecd-rsec li{font-size:10.5px;color:#222;margin-bottom:1px}
  .lecd-resnote{margin:0;font-size:12.5px;color:var(--ink35);text-align:center;max-width:46ch}

  .lecd-foot{margin-top:22px;display:flex;justify-content:center}
  .lecd-go,.lecd-back{display:inline-flex;align-items:center;gap:9px;padding:11px 22px;
    border-radius:10px;font-size:14px;font-weight:600;transition:.14s}
  .lecd-go{border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
  .lecd-go:hover{transform:translateY(-1px)}
  .lecd-back{border:1px solid var(--line);background:var(--card);color:var(--ink60)}
  .lecd-back:hover{border-color:var(--ink35);color:var(--ink)}
  @media (prefers-reduced-motion: reduce){ .lecd-go:hover{transform:none} }

  @media (max-width:640px){
    .lecd-steps{flex-direction:column}
    .lecd-step{flex:1 1 auto;padding:12px 0}
    .lecd-step + .lecd-step{padding-left:0;border-left:0;border-top:1px solid var(--line)}
    .lecd-note{min-height:0}
    .lecd-panel{padding-left:10px}
    .lecd-paper{padding:20px 18px}
    .lecd-rline{flex-direction:column;gap:1px}
  }

  /* ---- team ---- */
  .lteam{padding-top:86px;padding-bottom:84px;border-top:1px solid var(--line)}
  .lteam-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:end}
  .lteam-head p{margin:0;color:var(--ink60);font-size:15px;line-height:1.65;max-width:50ch}
  .lteam-list{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:0;margin:42px 0 0;padding:0}
  .lteam-list li{padding:22px 26px 0 0;border-top:2px solid var(--ink);
    opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .lteam.in .lteam-list li{opacity:1;transform:none}
  .lteam-list li + li{padding-left:26px;border-left:1px solid var(--line)}
  .lteam-n{display:block;font-size:11.5px;color:var(--ink35);margin-bottom:10px}
  .lteam-list h3{margin:0}
  .lteam-r{display:block;font-size:12.5px;color:var(--accent);margin-top:3px;font-weight:500}
  .lteam-list p{margin:10px 0 0;font-size:13.5px;color:var(--ink60);line-height:1.6}
  .lteam-close{margin:40px 0 0;padding-top:22px;border-top:1px solid var(--line);
    font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 90;font-weight:700;
    font-size:clamp(17px,2vw,22px);letter-spacing:-.02em;color:var(--ink);max-width:44ch}

  /* ---- support ---- */
  .lsup{padding-top:86px;padding-bottom:84px;border-top:1px solid var(--line)}
  .lsup-head p{margin:14px 0 0;color:var(--ink60);font-size:15px}
  .lsup-list{list-style:none;margin:34px 0 0;padding:0;border-top:1px solid var(--line)}
  .lsup-list li{border-bottom:1px solid var(--line)}
  .lsup-list button{display:flex;align-items:center;justify-content:space-between;gap:18px;
    width:100%;text-align:left;border:0;background:transparent;padding:17px 2px;
    font-size:16px;font-weight:600;letter-spacing:-.012em;color:var(--ink)}
  .lsup-list button:hover{color:var(--accent)}
  .lsup-list i{flex:none;color:var(--ink35)}
  .lsup-list p{margin:0 0 18px;font-size:14.5px;line-height:1.65;color:var(--ink60);max-width:64ch}
  .lsup-mail{margin-top:26px;font-size:14px;color:var(--ink60)}
  .lsup-mail a{color:var(--ink)}

  /* ---- closing and footer ---- */
  .lend{text-align:center;padding-top:88px;padding-bottom:88px;border-top:1px solid var(--line)}
  .lend h2{margin:0 auto;max-width:none}
  .lend p{margin:16px auto 28px;color:var(--ink60);font-size:15.5px;line-height:1.6;max-width:46ch}
  .lfoot{background:var(--surface);border-top:1px solid var(--line);position:relative;z-index:1}
  .lfoot-top{max-width:1140px;margin:0 auto;padding:50px 32px 34px;display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:52px}
  .lfoot-get h3{margin:0;font-size:clamp(21px,2.4vw,27px);letter-spacing:-.02em}
  .lfoot-get p{margin:10px 0 18px;font-size:14px;color:var(--ink60);max-width:34ch;line-height:1.6}
  .lfoot-social{display:grid;gap:8px;max-width:330px}
  .lfoot-social a{display:flex;align-items:center;justify-content:space-between;gap:14px;
    border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:10px 18px;text-decoration:none;color:var(--ink);transition:.14s}
  .lfoot-social a:hover{border-color:var(--ink);transform:translateY(-1px)}
  .lfoot-social b{font-size:14px;font-weight:600}
  .lfoot-social span{font-size:12.5px;color:var(--ink35)}
  .lfoot-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}
  .lfoot h4{font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;font-weight:700;
    color:var(--ink);margin:0 0 10px}
  .lfoot button{display:block;border:0;background:transparent;padding:4px 0;font-size:13.5px;
    color:var(--ink60);text-align:left}
  .lfoot button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .lfoot-base{max-width:1140px;margin:0 auto;padding:14px 32px 24px;display:flex;
    justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink35);
    border-top:1px solid var(--line)}
  .lfoot-base a{color:var(--ink35)}

  /* ---- start planning ---- */
  .startpage{min-height:100%;background:var(--paper);display:flex;flex-direction:column}
  .startwrap{flex:1;max-width:1040px;margin:0 auto;width:100%;padding:60px 32px 70px;
    display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:52px;align-items:start}
  .startmain h1{font-size:clamp(32px,4.4vw,52px);letter-spacing:-.035em;line-height:1.02}
  .startsub{margin:18px 0 0;font-size:16px;color:var(--ink60);line-height:1.6;max-width:40ch}
  .startcta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
  .startsteps{list-style:none;margin:34px 0 0;padding:22px 0 0;border-top:1px solid var(--line);
    display:grid;gap:11px}
  .startsteps li{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink60)}
  .startsteps span{width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:11px;
    border:1px solid var(--line);border-radius:99px;color:var(--ink35)}
  .startios{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 5px 5px 0;padding:26px 26px 24px}
  .startios-k{font-family:"DM Mono",monospace;font-size:11px;color:var(--accent)}
  .startios h2{margin:10px 0 0;font-size:clamp(20px,2.4vw,26px);max-width:none}
  .startios p{margin:14px 0 0;font-size:14px;color:var(--ink60);line-height:1.65}
  .startios ul{margin:16px 0 0;padding-left:18px}
  .startios li{font-size:13.5px;color:var(--ink60);line-height:1.6;margin-bottom:5px}
  .startios-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink35)}
  .startios-note b{color:var(--ink)}

  /* ---- the shine on every primary call to action ---- */
  .shine{position:relative;overflow:hidden;isolation:isolate;
    box-shadow:0 0 0 0 var(--accent-soft);transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .22s ease}
  .shine::after{content:"";position:absolute;top:-60%;bottom:-60%;width:38%;left:-50%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
    transform:skewX(-18deg);animation:sweep 3.6s cubic-bezier(.4,0,.2,1) infinite;pointer-events:none}
  .shine:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 0 7px var(--accent-soft)}
  .shine:active{transform:translateY(0) scale(.99)}
  @keyframes sweep{0%{left:-50%}38%{left:125%}100%{left:125%}}

  /* ---- after the demo: the hand-off ---- */
  .ldemo-after{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;
    max-width:1076px;margin:46px auto;padding:28px 26px;
    border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center}
  .ldemo-after h3{margin:0;font-size:clamp(19px,2.4vw,27px);letter-spacing:-.02em}
  .ldemo-after em{font-style:normal;color:var(--accent);
    font-family:"Caveat",cursive;font-size:1.34em;font-weight:700;letter-spacing:0}

  /* ---- where a dragged item will land ---- */
  .demo-drop{position:absolute;left:calc(var(--gut) + 6px);right:12px;z-index:1;
    border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:8px;
    pointer-events:none}

  /* ---- List It plus Organize It, together ---- */
  .lmerge-names{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .lmerge-plus{color:var(--ink35);font-size:15px}
  .lmerge-text p + p{margin-top:12px}

  /* ---- Brag It ---- */
  .lbrag{align-items:start}
  .lbrag-art{display:grid;gap:18px}
  .lbrag-out{display:flex;align-items:center;gap:14px;margin-top:24px;padding:16px 18px;
    border:1px solid var(--brag);border-left-width:3px;border-radius:0 5px 5px 0;
    background:var(--brag-soft)}
  .lbrag-out b{display:block;font-size:16px;letter-spacing:-.014em;color:var(--ink)}
  .lbrag-out span{display:block;font-size:13px;color:var(--ink60);margin-top:2px;line-height:1.5}
  .lbrag-arrow{flex:none;width:30px;height:30px;border-radius:99px;background:var(--brag);
    position:relative}
  .lbrag-arrow::before,.lbrag-arrow::after{content:"";position:absolute;background:var(--card)}
  .lbrag-arrow::before{left:14px;top:8px;width:2px;height:13px;border-radius:7px}
  .lbrag-arrow::after{left:10px;top:15px;width:10px;height:2px;border-radius:7px;
    transform:rotate(45deg);transform-origin:right center}
  .lbrag .ec{margin-bottom:10px}
  .lbrag .ec:last-child{margin-bottom:0}

  /* ---- View It ---- */
  .lwatch-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .lwatch-pts{list-style:none;margin:20px 0 0;padding:0}
  .lwatch-pts li{padding:11px 0;border-top:1px solid var(--line);font-size:14px;
    color:var(--ink60);line-height:1.55}
  .lwatch-pts b{color:var(--ink);font-weight:600}

  /* ---- photograph behind the closing section ---- */
  .lend{position:relative;overflow:hidden}
  .lend-photo{position:absolute;inset:0;z-index:0}
  .lend-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%}
  .lend-veil{position:absolute;inset:0;background:
    linear-gradient(180deg, rgba(var(--paper-rgb), .97) 0%,
                            rgba(var(--paper-rgb), .80) 46%,
                            rgba(var(--paper-rgb), .95) 100%)}
  .lend-in{position:relative;z-index:1}

  /* ---- social: a logo you can hit, with the handle under it ---- */
  .lfoot-social{display:flex;gap:26px;max-width:none}
  .lfoot-social a{display:grid;justify-items:center;gap:8px;text-decoration:none;color:var(--ink);
    border:0;background:transparent;padding:0;border-radius:0;transition:transform .16s cubic-bezier(.2,.8,.3,1)}
  .soc-badge{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    transition:background .18s ease,color .18s ease,border-color .18s ease}
  .lfoot-social a:hover{transform:translateY(-3px)}
  .lfoot-social a:hover .soc-badge{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .soc-h{font-size:11.5px;color:var(--ink35)}

  /* ---- landing: tablet ---- */
  @media (max-width:1000px){
    .lnav{position:sticky}
    .lnav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;
      background:var(--card);border-bottom:1px solid var(--line);padding:6px 0;margin:0}
    .lnav-links.open{display:flex}
    .lnav-links a{padding:13px 32px;border-radius:0}
    .lnav-burger{display:flex}
    .lhero{min-height:min(78vh,660px)}
    .lopen-cols,.lteam-head{grid-template-columns:minmax(0,1fr);gap:22px}
    .demo-app{grid-template-columns:minmax(0,1fr);gap:14px}
    .demo-grid{max-height:380px}
    .lfeat,.lmerge{grid-template-columns:minmax(0,1fr);gap:32px}
    .lfeat.flip .lfeat-text,.lfeat.flip .lfeat-art{order:0}
    .lfeat-tight{display:none}
    /* The mockups measure their own box and scale to fit it. justify-items
       centre made each one as wide as its 1180px content instead, so the
       desktop shot never scaled down: it ran off the side of a phone and left
       an empty stretch where the rest of it should have been. The items stay
       stretched, and centre with a margin instead. */
    .ldevices-stage{grid-template-columns:minmax(0,1fr);gap:34px;justify-items:stretch}
    .ldevices-stage > *{margin-left:auto;margin-right:auto;width:100%}
    .shot-phone{max-width:250px}
    .lbrag{align-items:stretch}
    .lwatch-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
    .lteam-list{grid-template-columns:minmax(0,1fr)}
    .lteam-list li,.lteam-list li + li{padding:20px 0 22px;border-left:0;border-top:1px solid var(--line)}
    .lteam-list li:first-child{border-top:2px solid var(--ink)}
    .lfoot-top{grid-template-columns:minmax(0,1fr);gap:34px}
    .startwrap{grid-template-columns:minmax(0,1fr);gap:32px}
  }
  /* ---- landing: phone ---- */
  @media (max-width:640px){
    .lhero-in,.lopen,.lall,.ldemo,.lfeat,.lmerge,.lecd,.lteam,.lsup,.lend{
      padding-left:18px;padding-right:18px}
    .lnav{padding:10px 18px}
    .lnav-links a{padding:13px 18px}
    .lopen,.lall,.ldemo,.lfeat,.lmerge,.lecd,.lteam,.lsup,.lend{
      padding-top:58px;padding-bottom:58px}
    .lhero-in{padding-bottom:54px}
    .lopen-cols{gap:16px}
    .demo-tips{display:none}
    .demo-grid{max-height:330px}
    .lfoot-cols{grid-template-columns:minmax(0,1fr);gap:24px}
    .lfoot-top{padding:34px 18px 26px}
    .lfoot-base{padding:14px 18px 22px}
    .lmerge-stage{height:360px}
    .ldemo-after{padding:22px 16px;gap:16px;margin:34px auto}
    .lwatch-stats{grid-template-columns:minmax(0,1fr);gap:8px}
    .lbrag-out{padding:14px}
    .lfoot-social{gap:12px}
    .startwrap{padding:38px 18px 50px}
    .stationery svg{opacity:.06}
  }
  @media (prefers-reduced-motion:reduce){
    .stationery svg{animation:none}
    .shine::after{animation:none;display:none}
    .shine:hover{transform:none}
    .lhero-in,.reveal,.lteam-list li{transition:none}
  }

  /* the sign-in page's wordmark goes back to the homepage */
  .tn-home{border:0;background:transparent;padding:0;gap:11px}
  .tn-home:hover b{text-decoration:underline;text-underline-offset:4px}

  body,.rail,.pane,.dow,.daycol h4,.tape,.card,.modal{
    transition:background-color .2s ease, border-color .2s ease, color .2s ease}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="root">
  <div class="boot" aria-live="polite">

const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth()+n, 1); return x; };

/* ---- time you can feel ----

   A clock time is a fact you have to do arithmetic on. "In 25 minutes" is the
   thing you actually needed to know. Time blindness is one of the hardest parts
   of ADHD to design around, and the cheapest thing a planner can do about it is
   never make somebody work out a gap in their head. So anywhere a scheduled
   time is shown, the distance to it is shown as well. */
const minsNow = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };

  const n = Math.abs(Math.round(m));
  if(n < 1) return 'less than a minute';
  if(n < 60) return n + ' min';
  const h = Math.floor(n/60), r = n % 60;
  return h + (h === 1 ? ' hour' : ' hours') + (r ? ' ' + r + ' min' : '');

   barely there while it is hours off, stronger as it comes, and at full
   strength exactly when the thing is happening. Nothing introduces a colour of
   its own, because a red warning on a block somebody painted green is the
   interface arguing with its owner. */
function whenWords(startM, endM, now = minsNow()){
  if(startM === null || startM === undefined) return null;
  const end = (endM === null || endM === undefined) ? startM : endM;
  if(now >= startM && now < end) return {state:'now', text:spanWords(end - now) + ' left'};
  if(now < startM){
    const gap = startM - now;
    if(gap <= 1) return {state:'now', text:'starting now'};
    return {
      state: gap <= 15 ? 'soon' : gap <= 60 ? 'near' : 'far',
      text: 'in ' + spanWords(gap),
    };
  }
  return {state:'past', text:spanWords(now - end) + ' ago'};
}

// Changing one occurrence of a repeating task. 'one' splits that day off as its
// own task, 'future' ends the series the day before and starts a new one, and
// 'all' edits the series itself.
function applyRepeatEdit({orig, next, scope, occ, add, update}){
  if(scope === 'all' || occ === orig.date) {
    if(scope !== 'one') return update(orig.id, next);
  }
  if(scope === 'one'){
    update(orig.id, {skipDates:[...(orig.skipDates || []), occ]});
    const {id, ...rest} = next;
    return add({...rest, date:occ, repeat:'none', repeatDays:[], skipDates:[], doneDates:[], repeatUntil:null});
  }
  update(orig.id, {repeatUntil: iso(addDays(parseISO(occ), -1))});
  const {id, ...rest} = next;
  add({...rest, date:occ, skipDates:[], doneDates:[]});
}
function applyRepeatDelete({orig, scope, occ, update, remove}){
  if(scope === 'all' || (scope === 'future' && occ === orig.date)) return remove(orig.id);
  if(scope === 'one') return update(orig.id, {skipDates:[...(orig.skipDates || []), occ]});
  update(orig.id, {repeatUntil: iso(addDays(parseISO(occ), -1))});
}

// One stored record, expanded on the fly. Nothing is duplicated in storage, so
// changing a repeating item changes every future copy of it at once.
const occursOn = (item, dk) => {
  const base = item.date;
  if(!base) return false;
  if((item.skipDates || []).includes(dk)) return false;          // removed for just that day
  const days = item.repeatDays || [];
  const r = item.repeat || 'none';
  if(!days.length && r === 'none') return dk === base;
  if(dk < base) return false;
  if(item.repeatUntil && dk > item.repeatUntil) return false;
  const d = parseISO(dk);
  if(days.length) return days.includes(d.getDay());
  // older entries saved before weekday picking existed
  const b = parseISO(base);
  if(r === 'daily')    return true;
  if(r === 'weekdays') return d.getDay() >= 1 && d.getDay() <= 5;
  if(r === 'weekly')   return d.getDay() === b.getDay();
  if(r === 'monthly')  return d.getDate() === b.getDate();
  return dk === base;
};

/* Every element under the pointer, not only the topmost one. The thing being
   dragged follows the pointer, so asking for the top element often answers
   "what is in your hand" rather than "what is under it". */
function underPointer(x, y, sel){
  const stack = document.elementsFromPoint
    ? document.elementsFromPoint(x, y)
    : [document.elementFromPoint(x, y)];
  for(const el of stack){
    const hit = el && el.closest ? el.closest(sel) : null;
    if(hit) return hit;
  }
  return null;
}

const subsOf = t => (t && Array.isArray(t.subs)) ? t.subs : [];
const subsDone = t => subsOf(t).filter(x => x && x.done).length;
const isDone = (t, dk) => isRepeat(t) ? (t.doneDates || []).includes(dk) : !!t.done;

  if(!isRepeat(t)) return {done: !t.done};
  const list = t.doneDates || [];
  return {doneDates: list.includes(dk) ? list.filter(x => x !== dk) : [...list, dk]};
};

  {id:'birthday', label:'Birthday',     color:'var(--t-birthday)'},

/* ---- calendars ----

   A calendar is a class, a club, a job: a place for dates to belong. They are
   kept in settings because they are a setting, not planner content, and every
   date simply carries the id of the one it is on. A date with no calendar is
   not an error; it is grey and waiting to be filed.

   Colour works one of two ways, and which one is in play depends on how much
   is on screen. Looking at three calendars or fewer, the colour tells you what
   kind of thing a date is: a test reads differently from a birthday. Past
   three, that distinction stops being the useful one, and the colour tells you
   which calendar it came from instead. */
const CAL_SWATCHES = ['#C14D33','#517E64','#53769A','#A16828','#337D92','#8E5572',
                      '#6B7A8F','#B5651D','#4C6B52','#7A5C99','#9E6727','#3E7C8A'];
const calendarsOf = st => ((st && st.calendars) || []).filter(c => c && c.id);
const calById = (st, id) => calendarsOf(st).find(c => c.id === id) || null;
const calColor = (st, id) => { const c = calById(st, id); return c ? c.color : null; };
const calName = (st, id) => { const c = calById(st, id); return c ? c.name : ''; };

// Names are matched loosely on purpose: "AP Calculus BC" out of Canvas should
// find a calendar called "AP Calc BC" without the student renaming either one.
const normName = v => String(v || '').toLowerCase()
  .replace(/\b(period|per|block|section|sect|hr|hour)\s*\d+\b/g, ' ')
  .replace(/[^a-z0-9]+/g, ' ')
  .replace(/\b(ap|ib|honors|honours|hon|adv|advanced)\b/g, ' ')
  .trim().replace(/\s+/g, ' ');

/* Works out which calendar an imported date belongs to from the course name
   Canvas puts on it. A clear match assigns it; anything doubtful is left
   unassigned rather than filed wrongly, because a date on the wrong class is
   worse than a date on none. */
function matchCalendar(courseName, cals){
  const want = normName(courseName);
  if(!want || want.length < 2) return null;
  const rows = cals.map(c => ({c, n: normName(c.name)})).filter(r => r.n);
  const exact = rows.filter(r => r.n === want);
  if(exact.length === 1) return exact[0].c.id;
  if(exact.length > 1) return null;
  const inside = rows.filter(r => r.n.includes(want) || want.includes(r.n));
  if(inside.length === 1) return inside[0].c.id;
  if(inside.length > 1) return null;
  // every word of the shorter name appearing in the longer one
  const words = want.split(' ').filter(w => w.length > 2);
  if(!words.length) return null;
  const hit = rows.filter(r => {
    const rw = r.n.split(' ').filter(w => w.length > 2);
    if(!rw.length) return false;
    const [a, b] = words.length <= rw.length ? [words, r.n] : [rw, want];
    return a.every(w => b.includes(w));
  });
  return hit.length === 1 ? hit[0].c.id : null;
}

/* ---- which calendars you are looking at ----

   A chip has three states, cycled by tapping it. Off is the resting state and
   means the calendar simply takes its turn with the others. Tapping once picks
   it out: once anything is picked, only picked calendars show. Tapping again
   turns it into a minus, which hides that one calendar and leaves everything
   else alone. Tapping a third time puts it back.

   Including and excluding at once would be a contradiction, so a calendar is
   never in both lists: picking one clears its exclusion and the other way
   round.

   The choice is remembered on the device rather than in the planner, because
   it is about what you want to look at now, not about your dates. A parent
   keeps their own, under their own key, so hiding a class from your own view
   never hides it from theirs. */
const CALVIEW_KEY = 'planit:calview:v1';
const calViewKey = (uid, childId) => CALVIEW_KEY + ':' + (uid || 'me') + (childId ? ':' + childId : '');

function readCalView(key){
  try{
    const v = JSON.parse(localStorage.getItem(key) || '{}') || {};
    return {only: Array.isArray(v.only) ? v.only : [], not: Array.isArray(v.not) ? v.not : []};
  }catch(e){ return {only: [], not: []}; }
}
function writeCalView(key, v){
  try{ localStorage.setItem(key, JSON.stringify({only: v.only, not: v.not})); }catch(e){}
}

// off -> only -> not -> off
const calState = (view, id) =>
  view.only.includes(id) ? 'only' : view.not.includes(id) ? 'not' : 'off';
function cycleCal(view, id){
  const st = calState(view, id);
  if(st === 'off')  return {only:[...view.only, id], not: view.not.filter(x => x !== id)};
  if(st === 'only') return {only: view.only.filter(x => x !== id), not:[...view.not, id]};
  return {only: view.only.filter(x => x !== id), not: view.not.filter(x => x !== id)};
}

// Which calendars end up on screen, given the chips and the calendars that exist.
function shownCalendars(view, cals){
  const ids = cals.map(c => c.id);
  const only = view.only.filter(id => ids.includes(id));
  const not = view.not.filter(id => ids.includes(id));
  const base = only.length ? only : ids;
  return base.filter(id => !not.includes(id));
}
/* A date is kept if its calendar is on screen. Two cases that must not make
   dates disappear: a date filed to a calendar that has since been deleted
   counts as unfiled rather than as hidden, and with no calendars at all
   everything shows whatever the chips used to say. */
const keepEvent = (view, cals, e) => {
  if(!cals.length) return true;
  const filed = e.cal && cals.some(c => c.id === e.cal);
  const picked = view.only.filter(id => cals.some(c => c.id === id));
  if(!filed) return picked.length === 0;
  return shownCalendars(view, cals).includes(e.cal);
};

  }

}

const DB = {
  async get(key, shared){
    try { const r = await window.storage.get(key, !!shared); if(r) return r.value; } catch(e){}
    try { return localStorage.getItem(key); } catch(e){ return null; }
  },
  async set(key, val, shared){
    let ok = false;
    try { await window.storage.set(key, val, !!shared); ok = true; } catch(e){}
    try { localStorage.setItem(key, val); ok = true; } catch(e){}
    return ok;
  },
  async del(key, shared){
    try { await window.storage.delete(key, !!shared); } catch(e){}
    try { localStorage.removeItem(key); } catch(e){}
  }
};
