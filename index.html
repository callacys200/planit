  );
}

const BUG_AREAS = [
  ['brag','Brag It'], ['list','List It'], ['organize','Organize It: calendars'],
  ['lock','Focus sessions'], ['watch','View It: parent view'],
  ['account','Signing in or my account'], ['other','Somewhere else'],
];

/* ---- the switches for getting started ----

   Written for the way an ADHD week actually goes wrong: not from not knowing
   what is due, but from a list too long to start, a sense of time that is not
   there, and work that is too vague to begin. Each switch here is aimed at one
   of those, and each one is off by default, because deciding for somebody how
   their attention works is the mistake underneath most of this.

   Nothing here is a diagnosis and nothing here is medical. They are preferences
   about an interface. */
/* ---- accessibility ----

   Everything here changes how PlanIt is read rather than what it says. It is
   the second tab in Settings on purpose: a setting that decides whether the
   rest of the app can be read at all should not be eight tabs along. Each
   control shows its effect on a line of sample text as it moves, so nobody
   has to leave the page to find out what a number did. */
const SPACING_STEPS = {
  lineSpacing:  {lo:1.2, hi:2.2, step:0.05, def:1.45, label:'Line spacing',
    hint:'The gap between one line and the next.'},
  letterSpacing:{lo:0,   hi:0.16, step:0.01, def:0,   label:'Letter spacing',
    hint:'The gap between one letter and the next.'},
  wordSpacing:  {lo:0,   hi:0.5,  step:0.05, def:0,   label:'Word spacing',
    hint:'The gap between one word and the next.'},
};

function Accessibility({settings, setSettings}){
  const put = (k, v) => setSettings({...settings, [k]: v});
  const mode = modeOf(settings);
  const dark = isDarkMode(mode);
  // the font comes off a CDN, so the setting has to be able to say it failed
  const [, redraw] = useState(0);
  useEffect(() => {
    const fn = () => redraw(n => n + 1);
    dyslexicWatchers.add(fn);
    return () => { dyslexicWatchers.delete(fn); };
  }, []);

  const num = (k) => {
    const d = SPACING_STEPS[k];
    const v = Number(settings[k]);
    return isFinite(v) ? Math.min(d.hi, Math.max(d.lo, v)) : d.def;
  };
  const unset = Object.keys(SPACING_STEPS).every(k => num(k) === SPACING_STEPS[k].def)
    && !settings.dyslexic && !settings.bigText && !settings.lessMotion && !settings.underline;

  return (
    <>
      <Section title="Light or dark"
        hint="The quickest change there is. Your colour theme stays the same either way.">
        <div className="row" style={{gap:8, flexWrap:'wrap'}}>
          {MODES.map(([k,l]) => (
            <button key={k} className={'chip' + (mode === k ? ' on' : '')}
              aria-pressed={mode === k}
              onClick={() => setSettings({...settings, mode:k, theme:k})}>{l}</button>
          ))}
        </div>
        {mode === 'system' && (
          <p className="fieldnote">Following your device, which is {dark ? 'dark' : 'light'} right now.</p>
        )}
      </Section>

      <Section title="Language"
        hint="PlanIt's own words are in English for now. This sets the voice that reads your schedule out loud, the language dictation listens for, and how dates are written.">
        <div className="card">
          <label className="field">
            <span>Language</span>
            <select value={settings.lang || deviceLang()}
              onChange={e => put('lang', e.target.value)}>
              {LANGS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
            </select>
          </label>
        </div>
      </Section>

      <Section title="Typeface"
        hint="OpenDyslexic weights the bottom of each letter, which makes letters that are mirror images of each other harder to confuse.">
        <div className="card">
          <label className="switchrow">
            <span>
              <b>Use OpenDyslexic everywhere</b>
              <small>
                Replaces every typeface in PlanIt, the headings and the calendar included.
                It is wider than the usual one, so a few headings wrap onto two lines.
              </small>
            </span>
            <input type="checkbox" checked={!!settings.dyslexic}
              onChange={e => put('dyslexic', e.target.checked)} />
          </label>
          {settings.dyslexic && DYSLEXIC_FAILED && (
            <div className="formerr" style={{marginTop:10}}>
              OpenDyslexic could not be downloaded, so PlanIt is still using its usual
              typeface. Check the connection and reload.
            </div>
          )}
        </div>
      </Section>

      <Section title="Spacing"
        hint="Move any of these and the line underneath changes with it.">
        <div className="card">
          {Object.entries(SPACING_STEPS).map(([k, d]) => (
            <div key={k} className="spacerow">
              <div className="spread">
                <b>{d.label}</b>
                <span className="mono spacenum">
                  {k === 'lineSpacing' ? num(k).toFixed(2) : num(k).toFixed(2) + 'em'}
                </span>
              </div>
              <small>{d.hint}</small>
              <input type="range" min={d.lo} max={d.hi} step={d.step} value={num(k)}
                aria-label={d.label}
                onChange={e => put(k, Number(e.target.value))} />
            </div>
          ))}
          <p className="spacesample" style={{
            lineHeight: num('lineSpacing'),
            letterSpacing: num('letterSpacing') + 'em',
            wordSpacing: num('wordSpacing') + 'em',
          }}>
            Chemistry test Thursday, and the lab writeup is due the morning
            before it. Start the writeup tonight.
          </p>
        </div>
      </Section>

      <Section title="Reading">
        <div className="card">
          <label className="switchrow" style={{marginBottom:14}}>
            <span>
              <b>Bigger text everywhere</b>
              <small>Raises every size in PlanIt by about a tenth, rather than zooming the page.</small>
            </span>
            <input type="checkbox" checked={!!settings.bigText}
              onChange={e => put('bigText', e.target.checked)} />
          </label>
          <label className="switchrow" style={{marginBottom:14}}>
            <span>
              <b>Underline every link</b>
              <small>So a link is not told apart by its colour alone.</small>
            </span>
            <input type="checkbox" checked={!!settings.underline}
              onChange={e => put('underline', e.target.checked)} />
          </label>
          <label className="switchrow">
            <span>
              <b>Stop things moving</b>
              <small>
                Turns off every slide, fade and pulse. PlanIt already follows this when your
                device asks for it; this turns it off here as well.
              </small>
            </span>
            <input type="checkbox" checked={!!settings.lessMotion}
              onChange={e => put('lessMotion', e.target.checked)} />
          </label>
        </div>
      </Section>

      {!unset && (
        <Section title="Back to the defaults">
          <button className="btn" onClick={() => setSettings({...settings,
            dyslexic:false, bigText:false, lessMotion:false, underline:false,
            lineSpacing:null, letterSpacing:null, wordSpacing:null})}>
            Reset how text is shown
          </button>
        </Section>
      )}
    </>
  );
}

/* Classes, clubs, jobs: the things a date can belong to. Kept in settings
   because that is where you set them up once, and because the colour you give
   one is the colour it shows in on the monthly calendar. */
function CalendarSettings({settings, setSettings, events, setEvents, toast}){
  const cals = calendarsOf(settings);
  const [name, setName] = useState('');
  const [clearing, setClearing] = useState(false);
  const save = next => setSettings({...settings, calendars: next});

  const add = () => {
    const v = name.trim();
    if(!v) return;
    if(cals.some(c => c.name.toLowerCase() === v.toLowerCase())) return toast('You already have one called that');
    save([...cals, {id:'c' + uid(), name: v, color: CAL_SWATCHES[cals.length % CAL_SWATCHES.length]}]);
    setName('');
  };
  const put = (id, patch) => save(cals.map(c => c.id === id ? {...c, ...patch} : c));
  const drop = c => {
    const n = (events || []).filter(e => e.cal === c.id).length;
    if(!window.confirm(n
      ? `Remove ${c.name}? The ${n} ${n === 1 ? 'date' : 'dates'} on it stay on your calendar, with no class until you give them one.`
      : `Remove ${c.name}?`)) return;
    if(n && setEvents) setEvents((events || []).map(e => e.cal === c.id ? {...e, cal: null} : e));
    save(cals.filter(x => x.id !== c.id));
    toast('Removed');
  };

  // how many imported dates are still waiting to be filed
  const unfiled = (events || []).filter(e => isCanvas(e) && !e.cal).length;

  return (
    <>
      <Section title="Classes and calendars"
        hint="A calendar for each class, club or job. Dates go on one, and you can show or hide them a calendar at a time.">
        <div className="card">
          {cals.length === 0
            ? <p className="logempty">
                Nothing yet. Add your classes and every due date can sit under the right one.
              </p>
            : <ul className="callist">
                {cals.map(c => (
                  <li key={c.id}>
                    <input type="color" value={c.color} aria-label={c.name + ' colour'}
                      onChange={e => put(c.id, {color: e.target.value})} />
                    <input className="finput calname" value={c.name} maxLength={40}
                      aria-label="Name" onChange={e => put(c.id, {name: e.target.value})} />
                    <span className="calcount">
                      {(events || []).filter(e => e.cal === c.id).length}
                    </span>
                    <XBtn onClick={() => drop(c)} label="Remove" confirm={c.name}
                      note="The calendar goes, and every date filed under it loses its colour. This cannot be undone." />
                  </li>
                ))}
              </ul>}
          <div className="logadd" style={{marginTop:12}}>
            <input className="finput" value={name} maxLength={40}
              placeholder="AP Calculus BC, Key Club, work…"
              onChange={e => setName(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && add()} />
            <button className="btn sm" onClick={add}>Add</button>
          </div>
          <p className="cvfine" style={{marginTop:12}}>
            These colours are the ones the monthly calendar uses once you are looking at more than
            three calendars at a time. At three or fewer it colours by what kind of date it is
            instead, which you can change under Appearance.
          </p>
        </div>
      </Section>

      {cals.length > 0 && (
        <Section title="A new school year"
          hint="Clear last year's classes when the new timetable comes out, then add this year's. Nothing else goes: your dates keep their colour, and what you wrote about each teacher in Brag It is filed by year and stays there.">
          <div className="card">
            <div className="row" style={{gap:10, flexWrap:'wrap', alignItems:'center'}}>
              <button className="btn danger" onClick={() => setClearing(true)}>
                Clear my {cals.length} {cals.length === 1 ? 'class' : 'classes'}
              </button>
              <span style={{fontSize:12.5, color:'var(--ink35)'}}>
                You are in {schoolYearLabel()} now.
              </span>
            </div>
          </div>
        </Section>
      )}

      {clearing && (
        <ConfirmDelete what={cals.map(c => c.name).join(', ')}
          note={'Your dates stay where they are and lose only their class. Teacher notes are kept under ' +
            schoolYearLabel() + ' in Brag It. You can add this year\u2019s classes straight after.'}
          onNo={() => setClearing(false)}
          onYes={() => {
            setClearing(false);
            if(setEvents) setEvents((events || []).map(e => e.cal ? {...e, cal:null} : e));
            save([]);
            toast('Classes cleared. Add this year\u2019s below');
          }} />
      )}

      {unfiled > 0 && (
        <Section title="Imported dates with no class">
          <div className="card" style={{fontSize:13.5, color:'var(--ink60)', lineHeight:1.6}}>
            {unfiled} imported {unfiled === 1 ? 'date is' : 'dates are'} not on a calendar yet. PlanIt
            files them by the course name your school puts on them, so adding a calendar named the
            way the course is named usually picks them up on the next check. Anything it cannot place
            stays grey, and you can set it by hand on the monthly calendar.
          </div>
        </Section>
      )}
    </>
  );
}

function BugReport({user, toast}){
  const [area, setArea] = useState('');
  const [areaOther, setAreaOther] = useState('');   // only when "Somewhere else"
  const [what, setWhat] = useState('');
  const [steps, setSteps] = useState('');
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState('');

  const send = async () => {
    if(area === 'other' && areaOther.trim().length < 3)
      return setErr('Say roughly where it happened.');
    if(what.trim().length < 10) return setErr('Tell us a bit more. What went wrong?');
    setBusy(true); setErr('');
    try{
      await withTimeout(db().collection('bugs').add({
        uid: user.id,
        username: user.username || '',
        email: user.email || '',
        area, areaOther: area === 'other' ? areaOther.trim() : '',
        what: what.trim(), steps: steps.trim(),
        // context that saves a round of back-and-forth
        agent: navigator.userAgent,
        screen: `${window.innerWidth}x${window.innerHeight}`,
        at: Date.now()
      }), 10000);
      setSent(true); toast('Thanks, that helps');
    }catch(e){
      setErr(e.code === 'permission-denied'
        ? 'Firestore rules need republishing before reports can be sent.'
        : 'Could not send that. Check your connection and try again.');
    }
    setBusy(false);
  };

  if(sent) return (
    <Section title="Report a bug">
      <div className="card" style={{textAlign:'center', padding:'28px 20px'}}>
        <b style={{fontSize:16, display:'block', marginBottom:4}}>Sent</b>
        <p style={{margin:0, color:'var(--ink60)', fontSize:13.5}}>
          Thanks for taking the time. There's no reply from here, but it's been logged.
        </p>
        <button className="btn" style={{marginTop:16}}
          onClick={() => { setSent(false); setWhat(''); setSteps(''); setArea(''); setAreaOther(''); }}>Report another</button>
      </div>
    </Section>
  );

  return (
    <>
      <Section title="Report a bug" hint="Something broken, confusing, or just wrong? Say so here.">
        <div className="card">
          <Field label="Where did it happen?">
            <select value={area} onChange={e => { setArea(e.target.value); setErr(''); }}>
              <option value="">Choose one</option>
              {BUG_AREAS.map(([k,l]) => <option key={k} value={k}>{l}</option>)}
            </select>
          </Field>
          {/* "Somewhere else" is useless on its own, so it asks where */}
          {area === 'other' && (
            <Field label="Where, then?">
              <input autoFocus value={areaOther} maxLength={80}
                onChange={e => { setAreaOther(e.target.value); setErr(''); }}
                placeholder="The sign-up email, the monthly calendar, the widget…" />
            </Field>
          )}
          <Field label="What went wrong?">
            <textarea value={what} onChange={e => setWhat(e.target.value)}
              placeholder="The reset button on the timer does nothing when I tap it" />
          </Field>
          <Field label="What were you doing just before? (optional)">
            <textarea value={steps} onChange={e => setSteps(e.target.value)}
              placeholder="Started a 25 minute session, paused it, then tried to reset" />
          </Field>
          {err && <div className="formerr">{err}</div>}
          <button className="btn primary" disabled={busy} onClick={send}>{busy ? 'Sending…' : 'Send report'}</button>
        </div>
      </Section>
    </>
  );
}

// A student's view of who has asked to follow along, and who already does.
function ParentAccess({user, toast, onChange}){
  const [links, setLinks] = useState(null);
  const load = useCallback(async () => {
    try{
      const snap = await withTimeout(linksForChild(user.id));
      setLinks(snap.docs.map(d => ({id:d.id, ...d.data()})));
    }catch(e){ setLinks([]); }
  }, [user.id]);
  useEffect(() => { load(); }, [load]);

  const decide = async (l, status) => {
    try{
      await db().collection('links').doc(l.id).update({status, decidedAt:Date.now()});
      toast(status === 'approved' ? 'Access granted' : 'Request declined');
      load(); onChange && onChange();
    }catch(e){ toast('Could not save that'); }
  };
  const revoke = async l => {
    if(!window.confirm(`Stop ${l.parentName || 'this parent'} from following your planner?`)) return;
    try{ await db().collection('links').doc(l.id).delete(); toast('Access removed'); load(); onChange && onChange(); }
    catch(e){ toast('Could not remove that'); }
  };

  if(!links || links.length === 0) return null;
  const pending = links.filter(l => l.status === 'pending');
  const active  = links.filter(l => l.status === 'approved');

  return (
    <>
      {pending.length > 0 && (
        <Section title="Requests to follow your planner"
          hint="They can only ever look. Nothing they do changes your planner.">
          {pending.map(l => (
            <div key={l.id} className="card" style={{marginBottom:10}}>
              <b>{l.parentName || 'A parent'}</b>
              <div style={{fontSize:12.5, color:'var(--ink35)', margin:'2px 0 12px'}}>{l.parentEmail}</div>
              <div className="row" style={{gap:8}}>
                <button className="btn primary" onClick={() => decide(l,'approved')}>Allow</button>
                <button className="btn" onClick={() => decide(l,'declined')}>Decline</button>
              </div>
            </div>
          ))}
        </Section>
      )}
      {active.length > 0 && (
        <Section title="Following your planner">
          {active.map(l => (
            <div key={l.id} className="todo" style={{alignItems:'center'}}>
              <Initial name={l.parentName || l.parentEmail} size={32} />
              <div className="txt"><b>{l.parentName || 'Parent'}</b><div className="meta">{l.parentEmail}</div></div>
              <div className="todo-actions"><button className="btn sm" onClick={() => revoke(l)}>Remove</button></div>
            </div>
          ))}
        </Section>
      )}
    </>
  );
}


const WEEK_MS = 7*24*60*60*1000;
const daysUntil = ts => Math.max(1, Math.ceil((WEEK_MS - (Date.now() - ts))/86400000));
const freeToChange = ts => !ts || (Date.now() - ts) >= WEEK_MS;

async function changeUsername(newName, user, oldName){
  const clean = newName.trim();
  const batch = db().batch();
  batch.set(db().collection('usernames').doc(unameKey(clean)), {uid:user.id, username:clean});
  if(oldName && unameKey(oldName) !== unameKey(clean)){
    batch.delete(db().collection('usernames').doc(unameKey(oldName)));
  }
  batch.set(db().collection('users').doc(user.id), {username:clean, usernameChangedAt:Date.now()}, {merge:true});
  await withTimeout(batch.commit(), 10000);
}

function Settings({sub, user, onSignOut, settings, setSettings, toast, onLinksChange, sync, onSyncNow, streakInfo, canRestore, onUseFreeze, energyBase, applyBase, isAdmin, events, setEvents}){
  const auth = initFirebase();
  const [profile, setProfile] = useState(null);
  const [err, setErr] = useState('');
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const [legal, setLegal] = useState(null);

  // The baseline is edited as a draft. Nothing is saved until the student says
  // which days the new number applies to, because changing it everywhere
  // quietly rewrites how every past day was judged.
  const effBase = energyBase || settings.energyBase || DEFAULT_BASE;
  const [baseDraft, setBaseDraft] = useState(effBase);
  useEffect(() => { setBaseDraft(effBase); }, [effBase]);

  useEffect(() => { (async () => {
    try{
      const snap = await withTimeout(db().collection('users').doc(user.id).get());
      setProfile(snap.exists ? snap.data() : {});
    }catch(e){ setProfile({}); setErr("Couldn't load your account details."); }
  })(); }, [user.id]);

  useEffect(() => { setErr(''); setNote(''); }, [sub]);

  /* ---------- my account ---------- */
  const [form, setForm] = useState(null);
  useEffect(() => {
    if(profile && !form) setForm({
      name: profile.name || user.name || '', dob: profile.dob || user.dob || '',
      grade: profile.grade || user.grade || '', stage: profile.stage || user.stage || 'hs',
      gender: profile.gender || '', school: profile.school || ''
    });
  }, [profile, form]);

  // the form is null until the profile arrives, so read the stage defensively
  const gradeNow = currentGrade(settings, (form && form.stage) || user.stage || 'hs');

  const saveAccount = async () => {
    setBusy(true); setErr(''); setNote('');
    try{
      await saveProfile(user.id, {
        name:form.name.trim(), dob:form.dob,
        // the written-down grade follows the derived one, so nothing reading
        // the profile is left with a grade from two years ago
        grade: gradeNow ? (GRADE_LABEL[gradeNow] || form.grade) : form.grade,
        stage:form.stage,
        gender:form.gender, school:form.school.trim(), email:user.email
      });
      setNote('Saved.');
    }catch(e){ setErr('Could not save. Check your connection and try again.'); }
    setBusy(false);
  };

  /* ---------- username ---------- */
  const [newName, setNewName] = useState('');
  const [avail, setAvail] = useState(null);
  useEffect(() => {
    const n = newName.trim();
    if(!n){ setAvail(null); return; }
    if(!validUsername(n)){ setAvail('invalid'); return; }
    if(unameKey(n) === unameKey(user.username || '')){ setAvail('same'); return; }
    setAvail('checking');
    let alive = true;
    const t = setTimeout(async () => {
      try{ const taken = await usernameTaken(n); if(alive) setAvail(taken ? 'taken' : 'free'); }
      catch(e){ if(alive) setAvail('offline'); }
    }, 450);
    return () => { alive = false; clearTimeout(t); };
  }, [newName, user.username]);

  const submitUsername = async () => {
    const n = newName.trim();
    if(!validUsername(n)) return setErr('Usernames are 3–20 characters: letters, numbers, underscores, and periods.');
    if(!freeToChange(profile && profile.usernameChangedAt))
      return setErr(`You can change your username again in ${daysUntil(profile.usernameChangedAt)} days.`);
    setBusy(true); setErr(''); setNote('');
    try{
      await changeUsername(n, user, user.username);
      if(auth.currentUser) await auth.currentUser.updateProfile({displayName:n});
      toast('Username updated');
      window.location.reload();
    }catch(e){ setErr(usernameWriteError(e)); setBusy(false); }
  };

  /* ---------- password ---------- */
  const [curPw, setCurPw] = useState('');
  const [newPw, setNewPw] = useState('');
  const [newPw2, setNewPw2] = useState('');

  const submitPassword = async () => {
    if(newPw.length < 8) return setErr('New passwords need at least 8 characters.');
    if(newPw !== newPw2) return setErr("The two new passwords don't match.");
    if(!freeToChange(profile && profile.passwordChangedAt))
      return setErr(`You can change your password again in ${daysUntil(profile.passwordChangedAt)} days.`);
    setBusy(true); setErr(''); setNote('');
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, curPw);
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(newPw);
      await saveProfile(user.id, {passwordChangedAt:Date.now()});
      setProfile(p => ({...p, passwordChangedAt:Date.now()}));
      setCurPw(''); setNewPw(''); setNewPw2('');
      setNote('Password changed.');
    }catch(e){ setErr(fbErr(e)); }
    setBusy(false);
  };

  /* ---------- notifications ---------- */
  const askNotify = async on => {
    if(!on){ setSettings({...settings, notify:{...settings.notify, on:false}}); return; }
    const perm = await askNotifyPermission();
    if(perm === 'unsupported') return setErr('This browser cannot show notifications.');
    if(perm !== 'granted') return setErr(isNativeApp()
      ? 'Notifications are off for PlanIt. Turn them on in Settings → Notifications → PlanIt, then try again.'
      : 'Your browser blocked notifications. Allow them in the address bar, then try again.');
    setSettings({...settings, notify:{...settings.notify, on:true}});
    fireNotification('PlanIt', "Reminders are on. You'll get a nudge before scheduled blocks.", 'planit-welcome');
  };

  const Err = () => err ? <div className="formerr" role="alert">{err}</div> : null;
  const Note = () => note ? <div className="formnote">{note}</div> : null;

  return (
    <div style={{maxWidth:660}}>
      {sub === 'account' && (
        <>
          <Section title="Signed in as">
            <div className="card row" style={{gap:12}}>
              <Initial name={user.username || user.email} size={44} />
              <div style={{flex:1, minWidth:0}}>
                <b>{user.username}</b>
                <div style={{fontSize:12.5, color:'var(--ink35)'}}>
                  {user.email} · {user.provider === 'google' ? 'Google account' : 'Email account'}
                </div>
              </div>
              <button className="btn" onClick={onSignOut}>Log out</button>
            </div>
          </Section>

          <Section title="About you" hint="Only you can see this. Leave anything blank you'd rather not fill in.">
            {!form ? <div className="card" style={{color:'var(--ink35)'}}>Loading…</div> : (
              <div className="card">
                <Field label="Name"><input value={form.name} onChange={e => setForm({...form, name:e.target.value})} placeholder="Enter your name here" /></Field>
                <div className="grid2">
                  {/* the age goes under the field, not into the label: a long
                      label is what pushed this row out of its card on a phone */}
                  <Field label="Date of birth">
                    <input type="date" value={form.dob} max={iso(new Date())}
                      onChange={e => setForm({...form, dob:e.target.value})} />
                    {ageFrom(form.dob) !== null &&
                      <small className="fieldnote">That makes you {ageFrom(form.dob)}.</small>}
                  </Field>
                  {/* A grade typed in once is wrong by the next August and
                      nobody comes back to change it. The year you leave does
                      not move, so the grade is worked out from that instead,
                      exactly as the age is worked out from the birthday. */}
                  <Field label="Graduating in">
                    <select value={settings.gradYear || ''}
                      onChange={e => setSettings({...settings, gradYear:e.target.value})}>
                      <option value="">Prefer not to say</option>
                      {GRAD_YEARS().map(y => <option key={y} value={y}>{y}</option>)}
                    </select>
                    {gradeNow
                      ? <small className="fieldnote">
                          That puts you in {GRADE_LABEL[gradeNow]} this year, and it moves up by itself every August.
                        </small>
                      : (form.grade
                          ? <small className="fieldnote">You had {form.grade} saved. Set the year and PlanIt keeps it current for you.</small>
                          : null)}
                  </Field>
                </div>
                <Field label="Where are you studying?">
                  <select value={form.stage || 'hs'} onChange={e => setForm({...form, stage:e.target.value})}>
                    {STAGES.map(([k,l]) => <option key={k} value={k}>{l}</option>)}
                  </select>
                </Field>
                <div className="grid2">
                  <Field label="Gender">
                    <select value={form.gender} onChange={e => setForm({...form, gender:e.target.value})}>
                      <option value="">Prefer not to say</option>
                      <option>Female</option><option>Male</option><option>Non-binary</option><option>Other</option>
                    </select>
                  </Field>
                  <Field label="School"><input value={form.school} onChange={e => setForm({...form, school:e.target.value})} placeholder="Enter your school here" /></Field>
                </div>
                <Note />
                <Err />
                <button className="btn primary" disabled={busy} onClick={saveAccount}>{busy ? 'Saving…' : 'Save details'}</button>
              </div>
            )}
          </Section>
        </>
      )}

      {sub === 'account' && (
        <Section title="Streak" hint="Days in a row you've opened PlanIt.">
          <div className="card">
            <div className="row" style={{gap:16}}>
              <div className="streakbig"><FireIcon level={3} /></div>
              <div style={{flex:1, minWidth:0}}>
                <b className="mono" style={{fontSize:26}}>{streakInfo.streak}</b>
                <div style={{fontSize:12.5, color:'var(--ink35)'}}>
                  current streak{streakInfo.best ? ` · best ${streakInfo.best}` : ''}
                </div>
              </div>
              <div className="freezes" title="Streak freezes banked">
                {streakInfo.freezes > 0
                  ? Array.from({length:streakInfo.freezes}).map((_, i) => <FreezeIcon key={i} />)
                  : <span style={{color:'var(--ink35)'}}>none</span>}
                <small>{streakInfo.freezes} {streakInfo.freezes === 1 ? 'freeze' : 'freezes'}</small>
              </div>
            </div>
            <div style={{marginTop:14, paddingTop:12, borderTop:'1px solid var(--line)'}}>
              <div className="spread" style={{marginBottom:10}}>
                <span style={{fontSize:13, color:'var(--ink60)'}}>Need more?</span>
                {!freezePacks().some(f => f.url) &&

              </div>
              {/* one at a time, or a pack: nobody should have to buy five to

              <div className="buyfreeze">

                  <span><b>Today and future days</b>

/* ============ STUDY REPORT ============ */
/* `back` is how many weeks or months ago to look, so the same builder serves
   this week and any week before it. Nothing is recomputed from scratch: the
   history is one row per day either way. */
function buildReport(lock, range = 'week', back = 0){
  const lk = lock || {};
  const byDate = {};
  (lk.history || []).forEach(h => { byDate[h.date] = h; });
  if(lk.day) byDate[lk.day] = {date:lk.day, minutes:lk.minutes || 0, sessions:lk.sessions || 0};
  const get = k => byDate[k] || {date:k, minutes:0, sessions:0};
  const today = iso(new Date());

  let bars = [], partners;
  if(range === 'month'){
    // every day of the month, so quiet days keep their place
    const anchor = new Date();
    anchor.setDate(1);
    anchor.setMonth(anchor.getMonth() - back);
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
    bars = Array.from({length:days}, (_,i) => {
      const k = iso(addDays(first, i));
      const d = get(k);
      return {key:k, label:String(i+1), minutes:d.minutes, sessions:d.sessions, now:k === today};
    });
    partners = back ? {} : (lk.partnersMonth || {});
  } else if(range === 'all'){
    // Every week from the first one with data to this one, including the
    // weeks nothing happened, so gaps show up as gaps.
    const dates = Object.keys(byDate).sort();
    const first = startOfWeek(dates.length ? parseISO(dates[0]) : new Date());
    const thisWeek = startOfWeek(new Date());
    const weeks = [];
    for(let w = new Date(first); w <= thisWeek; w = addDays(w, 7)) weeks.push(new Date(w));
    const shown = weeks.slice(-52);
    let prevMonth = null;
    bars = shown.map(w => {
      let m = 0, ss = 0;
      for(let d = 0; d < 7; d++){
        const k = iso(addDays(w, d));
        if(byDate[k]){ m += byDate[k].minutes || 0; ss += byDate[k].sessions || 0; }
      }
      const mo = w.getMonth();
      const label = mo !== prevMonth ? MON[mo].slice(0,3) : '';
      prevMonth = mo;
      return {key:iso(w), label, minutes:m, sessions:ss, now:iso(w) === iso(thisWeek),
              title:`Week of ${fmtDay(w)}`};
    });
    partners = lk.partnersAll || {};
  } else {
    const start = startOfWeek(addDays(new Date(), -7 * back));
    bars = Array.from({length:7}, (_,i) => {
      const k = iso(addDays(start, i));
      const d = get(k);
      return {key:k, label:DOW[parseISO(k).getDay()].slice(0,1),
              minutes:d.minutes, sessions:d.sessions, now:k === today};
    });
    partners = back ? {} : (lk.partners || {});
  }

  const minutes = bars.reduce((a2,d) => a2 + d.minutes, 0);
  const sessions = bars.reduce((a2,d) => a2 + d.sessions, 0);
  const best = bars.reduce((a2,d) => d.minutes > a2.minutes ? d : a2, bars[0] || {minutes:0});
  return {bars, days:bars, minutes, sessions, best, back,
          empty: minutes === 0 && sessions === 0,
          partners: Object.values(partners).sort((x,y) => y.mins - x.mins),
          today: lk.minutes || 0, todaySessions: lk.sessions || 0};
}

const RANGES = [['week','This week'],['month','This month'],['all','All time']];

/* ============ NOTIFICATIONS ============ */
// Everything here is flagged as planned rather than live. A promo that reads
// as active but can't be claimed is worse than one that says "coming".
/* What is actually new, newest first. An id is never reused: the unread count
   is worked out from the ids somebody has already seen, so reusing one would
   hide an announcement from everybody who had read the old one. */
const NEWS_FIXED = [
  {id:'teacher-anecdotes', tag:'New', title:'Teacher anecdotes are now available in Brag It',
   body:'Teacher anecdotes are now available in Brag It! List important memories that show, not tell, how great of a student you were in their class so they have something to write about in recommendation letters.'},
];

/* ---- the one that comes round every year ----

   Timetables come out in late July and the class list has to be rebuilt before
   September, which is exactly the sort of thing nobody remembers to do. So from
   the 20th of July until the end of September there is a notice about it, with
   the year in its id: each summer it is a new announcement, unread again, and
   reading it once does not silence it the following year.

   Outside that window it is not in the list at all, so nothing is nagging about
   classes in February. */
const CLASS_NOTICE_FROM = {m:6, d:20};        // 20 July, months counted from 0
const CLASS_NOTICE_TO = {m:8, d:30};          // 30 September
function classNotice(d = new Date()){
  const m = d.getMonth(), day = d.getDate();
  const after = m > CLASS_NOTICE_FROM.m || (m === CLASS_NOTICE_FROM.m && day >= CLASS_NOTICE_FROM.d);
  const before = m < CLASS_NOTICE_TO.m || (m === CLASS_NOTICE_TO.m && day <= CLASS_NOTICE_TO.d);
  if(!(after && before)) return null;
  const year = schoolYearLabel(d);
  return {
    id: 'classes-' + schoolYearEnd(d),
    tag: 'Every year',
    title: 'Time to update your classes for ' + year,
    body: 'New timetables are out about now. Open Settings, then Classes and calendars, clear last '
      + "year's classes and put this year's in. Everything you wrote about last year's teachers "
      + 'stays where it is in Brag It, filed under the year it happened.',
    goto: ['settings', 'calendars'],
  };
}

/* ---- the weekly nudge for seniors ----

   A twelfth grader has one year left to write down four years of work, so
   once a week PlanIt says so. Nobody else gets it. The id carries the week,
   so a new one appears each Sunday and the one before it counts as read.
   Every copy carries a plain "don't send this again" that turns the whole
   thing off for good: a nudge you cannot switch off is not a nudge. */
function weekStamp(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - t.getDay());          // back to Sunday
  return iso(t);
}
function bragNudge(d, ctx){
  if(!ctx || ctx.grade !== 12 || ctx.nudgeOff) return null;
  const n = ctx.ecCount || 0;
  return {
    id: 'brag-week-' + weekStamp(d),
    tag: 'Every Sunday, final year',
    title: n === 0
      ? 'Your bragsheet is still empty, and this is the year'
      : 'Add anything from this week to your bragsheet',
    body: n === 0
      ? 'Applications ask for up to ten activities and five honors. Starting from memory in '
        + 'November is how people forget the thing they were proudest of. Put one in now, even '
        + 'roughly, and fix it later.'
      : 'You have ' + n + ' ' + (n === 1 ? 'entry' : 'entries') + ' so far. A new role, an award, '
        + 'a number worth keeping, something a teacher said. Five minutes now beats an evening in '
        + 'December trying to remember September.',
    goto: ['brag', 'sheet'],
    off: 'bragNudgeOff',
    offLabel: "Don't send this again",
  };
}

const newsList = (d = new Date(), ctx = null) => {
  const yearly = classNotice(d);
  const nudge = bragNudge(d, ctx);
  return [nudge, yearly, ...NEWS_FIXED].filter(Boolean);
};

function Tutorial({user, energyBase, setEnergyBase, onDone, goTo}){
  const [i, setI] = useState(0);
  const [base, setBase] = useState(energyBase || DEFAULT_BASE);
  const [rect, setRect] = useState(null);
  const [busy, setBusy] = useState(false);
  const step = TOUR[i];
  const last = i === TOUR.length - 1;

  // open the right screen, then find the thing to light up once it has drawn
  useEffect(() => {
    if(step.tab) goTo(step.tab, step.sub);
    setRect(null);
    if(!step.target) return;
    let tries = 0, alive = true;
    const find = () => {
      if(!alive) return;
      const el = document.querySelector(`[data-tour="${step.target}"]`);
      if(el){
        el.scrollIntoView({block:'center', behavior:'smooth'});
        setTimeout(() => {
          if(!alive) return;
          const r = el.getBoundingClientRect();
          setRect({top:r.top, left:r.left, width:r.width, height:r.height});
        }, 280);
      } else if(tries++ < 20) setTimeout(find, 60);
    };
    find();
    const onResize = () => {
      const el = document.querySelector(`[data-tour="${step.target}"]`);
      if(el){ const r = el.getBoundingClientRect(); setRect({top:r.top, left:r.left, width:r.width, height:r.height}); }
    };
    window.addEventListener('resize', onResize);
    return () => { alive = false; window.removeEventListener('resize', onResize); };
  }, [i]);

  const finish = async () => {
    setBusy(true);
    setEnergyBase(base);
    try{ await saveProfile(user.id, {tutorialDone:true}); }catch(e){}
    goTo('organize', 'daily');
    onDone();
  };

  // keep the card out of the way of whatever is lit up
  const pad = 8;
  const cardBelow = rect && (rect.top + rect.height/2) < window.innerHeight/2;

  return (
    <div className="tutlayer">
      {rect
        ? <div className="tutspot" style={{top:rect.top - pad, left:rect.left - pad,
            width:rect.width + pad*2, height:rect.height + pad*2}} />
        : <div className="tutdim" />}

      <div className={'tutcard' + (rect ? (cardBelow ? ' bottom' : ' top') : '')}>
        <div className="tutdots">
          {TOUR.map((_,n) => <i key={n} className={n === i ? 'on' : n < i ? 'done' : ''} />)}
        </div>
        <h2>{step.title}</h2>
        <p>{step.body}</p>

        {step.energy && (
          <div className="card" style={{textAlign:'left', marginTop:4}}>
            <div className="spread" style={{marginBottom:8}}>
              <span style={{fontSize:13.5, fontWeight:600}}>A normal day holds about</span>
              <b className="mono" style={{fontSize:22}}>{base}</b>
            </div>
            <EnergyStepper value={base} onChange={setBase} />
          </div>
        )}

        <div className="tutbtns">
          {i > 0 && <button className="btn" onClick={() => setI(i-1)}>Back</button>}
          {last
            ? <button className="btn primary" disabled={busy} onClick={finish}>{busy ? 'Setting up…' : 'Start planning'}</button>
            : <button className="btn primary" onClick={() => setI(i+1)}>Next</button>}
        </div>
        {!last && <button className="tutskip" onClick={finish}>Skip the tour</button>}
      </div>
    </div>
  );
}

   pack of five; it is still honoured so nothing breaks if only that is filled
   in. Anything without a link shows as not yet available rather than
   disappearing, so the sizes on offer stay visible either way. */
function freezePacks(){
  const packs = (CONFIG.FREEZE_PACKS || []).map(p => ({...p}));
  const five = packs.find(p => p.n === 5);
  if(five && !five.url && CONFIG.FREEZE_CHECKOUT_URL) five.url = CONFIG.FREEZE_CHECKOUT_URL;

function StreakPopup({streak, prev, freezes, state, onUseFreeze, onBuy, onClose}){
  useEffect(() => { buzz(state === 'out' ? 'warning' : 'success'); }, [state]);

  const frozen = state === 'frozen';
  const out = state === 'out';
  const number = out ? prev : streak;

  return (
    <div className="streakwrap" onClick={onClose}>
      <div className={'streakcard ' + state} onClick={e => e.stopPropagation()}>
        <div className={'streakflame ' + state}>{frozen ? <FreezeIcon size={58} /> : <FireIcon level={3} />}</div>

        <div className="streaknum">{number}</div>
        <div className="streakword">{number === 1 ? 'day' : 'days'}</div>

        {!frozen && !out && (
          <p className="streakline">
            {streak < 3 ? "You're back. Keep it going."
              : streak < 7 ? 'Nicely done. That adds up fast.'

              : `${streak} days. Genuinely impressive.`}

          <p className="streakline">

// The literal hex behind a section, for the places that need to compute with
// it (the lock screen's backdrop, a <input type="color"> value) rather than
// just reference the variable.
const sectionHex = (st, key) => {
  const acc = (st && st.accents) || {};
  if(acc[key]) return acc[key];
  const t = palette(paletteOf(st || {}))[isDarkMode(modeOf(st || {})) ? 'dark' : 'light'];

/* Who counts as a team member.

   The founding account is named in CONFIG so the app works before the admins
   collection exists. Everyone else gets a document in /admins keyed by their
   Firebase UID, added by hand in the Firebase console. Nothing in the app can
   write to that collection, so this check grants nothing on its own: the same
   collection is what the Firestore rules consult before serving the numbers.
   Adding a team member is one console entry and no new build. */
const isAdminSync = user =>
  !!user && ((CONFIG.ADMIN_UIDS || []).includes(user.id) ||
    (CONFIG.ADMIN_USERNAMES || []).includes((user.username || '').toLowerCase()));

function useIsAdmin(user){
  const [listed, setListed] = useState(false);
  const uid = user && user.id;
  useEffect(() => {
    if(!uid || isAdminSync(user)) return;
    let alive = true;
    // the rules let an account read its own row and no one else's
    db().collection('admins').doc(uid).get()
      .then(snap => { if(alive) setListed(snap.exists); })
      .catch(() => {});                       // not listed, or offline
    return () => { alive = false; };
  }, [uid]);
  return isAdminSync(user) || listed;
}

function App({user, onSignOut}){
  const [ready, setReady] = useState(false);
  const isParent = user.role === 'parent';
  const isAdmin = useIsAdmin(user);

  // Days in a row with at least one visit. Missing a day resets it to 1, but
  // the old streak is remembered for that day so a freeze can restore it.
  // A freeze is earned every 7 days of streak, up to 3 banked.
  const [sk, setSk] = useState({
    streak: user.streak || 0, best: user.bestStreak || 0,
    freezes: user.freezes != null ? user.freezes : 5,
    prev: user.prevStreak || 0, brokenAt: user.brokenAt || null,
  });
  const streak = sk.streak;
  useEffect(() => {
    const today = iso(new Date());
    if(user.lastSeen === today) return;
    const yesterday = iso(addDays(new Date(), -1));
    let freezes = user.freezes != null ? user.freezes : 5;
    let next, prev = 0, brokenAt = null;
    if(user.lastSeen === yesterday) next = (user.streak || 0) + 1;
    else {
      next = 1;
      if((user.streak || 0) > 1){ prev = user.streak; brokenAt = today; }
    }
    if(next > 1 && next % 7 === 0) freezes = Math.min(10, freezes + 1);
    const best = Math.max(next, user.bestStreak || 0);
    setSk({streak:next, best, freezes, prev, brokenAt});
    saveProfile(user.id, {streak:next, bestStreak:best, lastSeen:today,

        let moved = 0;
        const tasks = s0.tasks.map(t => {
          if(t.scope !== 'daily' || isRepeat(t)) return t;
          if(!t.date || t.date >= today || t.done) return t;
          moved++;
          return {...t, date: today};
        });
        if(!moved) return s0;
        dirty.current = true;
        return {...s0, tasks};
      });
    };
    carry();
    const i = setInterval(carry, 60000);
    return () => clearInterval(i);
  }, [ready, isParent, store.settings]);

  // Focus stats are a daily figure and the report is a weekly one, so two
  // things roll over here: the day counters at midnight, and the study-partner
  // tally when a new week starts. Last week is kept as a one-line summary.
  useEffect(() => {
    if(!ready) return;
    const rollover = () => setStore(s0 => {
      const today = iso(new Date());
      const wk = weekKey(new Date());
      const lk = s0.lock || {};
      const mo0 = monthKey(new Date());
      const dayChanged = lk.day !== today;
      const weekChanged = (lk.weekOf || wk) !== wk;
      const monthChanged = (lk.monthOf || mo0) !== mo0;
      if(!dayChanged && !weekChanged && !monthChanged) return s0;

      let next = {...lk};

      if(dayChanged){
        const history = (lk.day && (lk.minutes || lk.sessions))
          // one small row per day you actually studied. 2000 of them covers
          // every day of high school and then some, at well under a tenth of
          // what the planner is allowed to hold, so nothing needs resetting.
          ? [...(lk.history || []), {date:lk.day, minutes:lk.minutes || 0, sessions:lk.sessions || 0}].slice(-2000)
          : (lk.history || []);
        next = {...next, sessions:0, minutes:0, seconds:0, day:today, history};
      }

      if(weekChanged){
        // summarise the week that just ended before clearing it
        const prevStart = lk.weekOf;
        const inPrev = (next.history || []).filter(h => prevStart && weekKey(parseISO(h.date)) === prevStart);
        const top = Object.values(lk.partners || {}).sort((a,b) => b.mins - a.mins)[0];
        next = {...next,
          weeks: prevStart ? [...(lk.weeks || []), {
            weekOf: prevStart,
            minutes: inPrev.reduce((a,h) => a + (h.minutes || 0), 0),
            sessions: inPrev.reduce((a,h) => a + (h.sessions || 0), 0),
            top: top ? top.name : null,
          }].slice(-104) : (lk.weeks || []),
          lastWeek: prevStart ? {
            weekOf: prevStart,
            minutes: inPrev.reduce((a,h) => a + (h.minutes || 0), 0),
            sessions: inPrev.reduce((a,h) => a + (h.sessions || 0), 0),
            top: top ? top.name : null,
            topMins: top ? top.mins : 0,
          } : (lk.lastWeek || null),
          partners: {},
          weekOf: wk,
        };
      }
      const mo = monthKey(new Date());
      if((lk.monthOf || mo) !== mo){
        const prevMonth = lk.monthOf;
        const inPrevM = (next.history || []).filter(h => prevMonth && h.date.slice(0,7) === prevMonth);
        const topM = Object.values(lk.partnersMonth || {}).sort((a,b) => b.mins - a.mins)[0];
        next = {...next,
          months: prevMonth ? [...(lk.months || []), {
            monthOf: prevMonth,
            minutes: inPrevM.reduce((a,h) => a + (h.minutes || 0), 0),
            sessions: inPrevM.reduce((a,h) => a + (h.sessions || 0), 0),
            top: topM ? topM.name : null,
          }].slice(-60) : (lk.months || []),
          partnersMonth:{}, monthOf:mo};
      }
      if(!lk.monthOf) next.monthOf = mo;
      if(!lk.weekOf) next.weekOf = wk;
      return {...s0, lock:next};
    });
    rollover();
    const i = setInterval(rollover, 60000);
    return () => clearInterval(i);
  }, [ready]);

  // Another device saved something newer: adopt it, unless we are mid-edit.
  useEffect(() => {
    if(!ready || isParent) return;
    return watchPlanner(user.id, res => {
      if(!res || !res.data || res.error || res.empty) return;
      if((res.at || 0) <= lastPush.current + 1500) return;   // our own write echoing back
      if(dirty.current) return;                              // we have edits not sent yet
      lastPush.current = res.at;
      setStore(res.data);
      toast('Updated from another device');
    });
  }, [ready, isParent, user.id, toast]);

  // One pass paints the whole appearance: palette tokens, then the section,
  // block and event colours, then any manual override on top. 'Match device'
  // keeps listening, so a phone that switches at sunset switches PlanIt too.
  useEffect(() => {
    applyAppearance(settings);
    if(modeOf(settings) !== 'system') return;
    let mq;
    try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch(e){ return; }
    if(!mq || !mq.addEventListener) return;
    const repaint = () => applyAppearance(settings);
    mq.addEventListener('change', repaint);
    return () => mq.removeEventListener('change', repaint);
  }, [settings.palette, settings.mode, settings.theme, settings.accents,
      settings.blockColors, settings.eventColors, settings.bg,
      settings.dyslexic, settings.lineSpacing, settings.letterSpacing,
      settings.wordSpacing, settings.bigText, settings.lessMotion, settings.underline,
      settings.lang]);

  useEffect(() => {
    if(!ready || isParent) return;
    const recheck = async () => {
      if(document.hidden || dirty.current) return;
      const remote = await fetchPlanner(user.id);
      if(remote && (remote.at || 0) > lastPush.current + 1500){
        lastPush.current = remote.at;
        setStore(remote.data);
      }
    };
    document.addEventListener('visibilitychange', recheck);
    window.addEventListener('focus', recheck);
    return () => {
      document.removeEventListener('visibilitychange', recheck);
      window.removeEventListener('focus', recheck);
    };
  }, [ready, isParent, user.id]);

  // A small live status beside the planner: focusing, or not.
  useEffect(() => {
    if(isParent || !ready) return;
    const write = () => db().collection('planner').doc(user.id).set({
      status:{ room: null, focusing: running, at: Date.now() }
    }, {merge:true}).catch(() => {});
    write();
    const hb = setInterval(write, 60000);
    return () => clearInterval(hb);
  }, [isParent, ready, running, user.id]);

  // Reminders. In the app these are handed to iOS in advance, so they arrive
  // with PlanIt closed. iOS holds at most 64 pending, so PlanIt books a rolling
  // window of the next 50 and tops it up every time the app is opened, the
  // same trick calendar apps use. On the web there is no pre-scheduling, so it
  // falls back to firing while a tab is open.
  const NOTIF_CAP = 50, NOTIF_DAYS = 14;
  const fired = useRef({});

  const upcomingReminders = useCallback(() => {
    const out = [];
    const now = Date.now();
    const lead = (settings.notify && settings.notify.before) || 10;
    for(let i = 0; i < NOTIF_DAYS; i++){
      const day = addDays(new Date(), i);
      const dk = iso(day);
      store.tasks.forEach(t => {
        if(t.scope !== 'daily' || !t.start || !t.remind) return;
        if(!occursOn(t, dk) || isDone(t, dk)) return;
        const at = new Date(day);
        at.setHours(0, toMin(t.start) - lead, 0, 0);
        if(at.getTime() <= now + 60000) return;        // already gone
        out.push({id: notifId(t.id + dk), title: t.title,
          body: `Starts at ${pretty(t.start)}`, schedule:{at}});
      });
    }
    /* And the other kind: a quarter of an hour past the end of something that
       is still not ticked off. Booked for every timed block, not only the ones
       set to remind, because this one is not a reminder to start something, it
       is a question about something that is already late. Tapping it opens the
       schedule, where the same question is waiting. */
    for(let i = 0; i < NOTIF_DAYS; i++){
      const day = addDays(new Date(), i);
      const dk = iso(day);
      store.tasks.forEach(t => {
        if(t.scope !== 'daily' || !t.start || !t.end) return;
        if(!occursOn(t, dk) || isDone(t, dk)) return;
        const at = new Date(day);
        at.setHours(0, toMin(t.end) + OVERRUN_AFTER, 0, 0);
        if(at.getTime() <= now + 60000) return;
        out.push({id: notifId('over:' + t.id + dk), title: 'Still not finished?',
          body: t.title + ' was down to end at ' + pretty(t.end) + '.',
          extra: {kind:'overrun', taskId:t.id, date:dk},
          schedule:{at}});
      });
    }
    return out.sort((x,y) => x.schedule.at - y.schedule.at).slice(0, NOTIF_CAP);
  }, [store.tasks, settings.notify]);

  /* Tapping that notification should land on the question, not just on the
     app. Only the native build can do this; a browser notification has no
     payload to read. */
  useEffect(() => {
    const n = Notifs();
    if(!n || !n.addListener) return;
    let handle = null;
    try{
      const got = n.addListener('localNotificationActionPerformed', ev => {
        const extra = ev && ev.notification && ev.notification.extra;
        if(!extra || extra.kind !== 'overrun') return;
        setTab('organize');
        setSub(p2 => ({...p2, organize:'daily'}));
        if(extra.date) setDate(parseISO(extra.date));
      });
      Promise.resolve(got).then(h => { handle = h; }).catch(() => {});
    }catch(e){}
    return () => { try{ if(handle && handle.remove) handle.remove(); }catch(e){} };
  }, []);

  useEffect(() => {
    const n = Notifs();

    // ---- native: book them ahead, and refresh whenever the app is opened ----
    if(n){
      let alive = true;
      const sync = async () => {
        if(!alive) return;
        try{
          const pending = await n.getPending();
          if(pending && pending.notifications && pending.notifications.length){
            await n.cancel({notifications: pending.notifications.map(x => ({id:x.id}))});
          }
          if(!settings.notify.on) return;
          const list = upcomingReminders();
          if(list.length) await n.schedule({notifications:list});
        }catch(e){}
      };
      const onShow = () => { if(!document.hidden) sync(); };
      sync();
      document.addEventListener('visibilitychange', onShow);
      return () => {
        alive = false;
        document.removeEventListener('visibilitychange', onShow);
      };
    }

    // ---- web: no pre-scheduling, so fire them while the tab is open ----
    if(!settings.notify.on) return;
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    const check = () => {
      const now = new Date();
      const today = iso(now);
      const mins = now.getHours()*60 + now.getMinutes();
      store.tasks.forEach(t => {
        if(t.scope !== 'daily' || !t.start || !t.remind) return;
        if(!occursOn(t, today) || isDone(t, today)) return;
        const lead = toMin(t.start) - mins;
        if(lead <= settings.notify.before && lead >= 0 && !fired.current[t.id]){
          fired.current[t.id] = true;
          fireNotification(t.title, `Starts at ${pretty(t.start)}`, t.id);
        }
      });
    };
    check();
    const i = setInterval(check, 30000);
    return () => clearInterval(i);
  }, [settings.notify.on, settings.notify.before, store.tasks, upcomingReminders]);

  /* ---- the Sunday nudge, as an actual notification ----

     The note in the box only helps somebody who opens the box. On the phone
     this also schedules the real thing: next Sunday at six in the evening,
     one notification, replaced each week by the following one. The id is
     fixed, so re-scheduling overwrites rather than stacking up, and turning
     the nudge off cancels it. */
  useEffect(() => {
    if(!isNativeApp() || isParent || !ready) return;
    const n = Notifs();
    if(!n) return;
    const NUDGE_ID = notifId('planit-brag-sunday');
    const grade = Number(currentGrade(settings, user.stage || 'hs')) || 0;

    if(grade !== 12 || settings.bragNudgeOff){
      n.cancel({notifications:[{id:NUDGE_ID}]}).catch(() => {});
      return;
    }
    const when = new Date();
    when.setHours(18, 0, 0, 0);
    // the next Sunday that has not already gone past six
    while(when.getDay() !== 0 || when <= new Date()) when.setDate(when.getDate() + 1);
    n.schedule({notifications:[{
      id: NUDGE_ID,
      title: 'Anything for the bragsheet this week?',
      body: 'Five minutes now beats an evening in December trying to remember September.',
      schedule: {at: when, repeats: true, every: 'week'},
    }]}).catch(() => {});
  }, [ready, isParent, settings.bragNudgeOff, settings.gradYear, user.stage]);

  // mutators
  const _addTask    = t => setStore(s => ({...s, tasks:[...s.tasks, {...t, id:uid()}]}));
  const _updateTask = (id,p) => setStore(s => ({...s, tasks:s.tasks.map(t => t.id === id ? {...t, ...p} : t)}));
  const _removeTask = id => setStore(s => ({...s, tasks:s.tasks.filter(t => t.id !== id)}));
  const _addEvent    = e => setStore(s => ({...s, events:[...s.events, {...e, id:uid()}]}));
  const _updateEvent = (id,p) => setStore(s => ({...s, events:s.events.map(e => e.id === id ? {...e, ...p} : e)}));
  const _removeEvent = id => setStore(s => ({...s, events:s.events.filter(e => e.id !== id)}));
  // Canvas replaces its own slice of the list in one go, so it needs the whole array
  const _setEvents   = next => setStore(s => ({...s, events:typeof next === 'function' ? next(s.events) : next}));
  /* An entry that is saving itself as it is typed brings its own id, so the
     first autosave and every one after it land on the same row. */
  const _addEc    = e => setStore(s => ({...s, ecs:[...s.ecs, {...e, id:e.id || uid()}]}));
  const _updateEc = (id,p) => setStore(s => ({...s, ecs:s.ecs.map(e => e.id === id ? {...e, ...p} : e)}));
  const _removeEc = id => setStore(s => ({...s, ecs:s.ecs.filter(e => e.id !== id)}));

  const addTask = guard(_addTask), updateTask = guard(_updateTask), removeTask = guard(_removeTask);
  const addEvent = guard(_addEvent), updateEvent = guard(_updateEvent), removeEvent = guard(_removeEvent);
  const setEvents = guard(_setEvents);
  const addEc = guard(_addEc), updateEc = guard(_updateEc), removeEc = guard(_removeEc);

  // Connected feeds keep themselves current. This lives up here rather than in
  // the panel so it runs whether or not Organize It is the tab you are on, and
  // it is off for a parent, who is looking at someone else's planner.
  const feedSync = useFeedSync({
    settings, setSettings, events:store.events, setEvents,
    enabled: ready && !isParent
  });

  const meta = TABS.find(t => t.id === tab);
  const accentHex = sectionHex(settings, tab);

  // the focus screen takes its mood from the focus colour in Settings
  const lockHex = sectionHex(settings, 'lock');
  const shieldStyle = useMemo(() => {
    const [h, sat] = hexToHsl(lockHex);
    const S = Math.max(8, Math.min(58, sat));          // keep it deep, never neon
    return {
      background: hsl(h, S, 13),
      backgroundImage: `linear-gradient(180deg, ${hsl(h, S, 15)}, ${hsl(h, S, 9)})`,
      '--shield-dim': hsl(h, Math.max(12, Math.min(40, sat)), 78)
    };
  }, [lockHex]);
  const goDaily = d => { setDate(d); setTab('organize'); setSub(p => ({...p, organize:'daily'})); };

  if(!ready) return <div style={{display:'grid',placeItems:'center',height:'100%',color:'var(--ink35)'}}>Opening your planner…</div>;

  return (
    <div className={'app has-tabbar' + (railOpen ? ' railopen' : '')
        + (running && focusKind === 'writing' ? ' writing' : '')} style={{'--accent':accentHex, '--accent-soft':hexRgba(accentHex, .16), '--accent-ink':inkOn(accentHex)}}>
      {/* On a phone the sections live along the bottom, within a thumb's
          reach, with the plus in the middle adding to whichever one you are
          looking at. The rail stays for wider screens. */}
      <nav className="tabbar" aria-label="Sections">
        {bottomTabs.map(t => t === '+' ? (
          <button key="add" className="tabbar-add" aria-label={plusLabel}
            title={plusLabel} onClick={addHere}>
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4"
                strokeLinecap="round" fill="none" />
            </svg>
          </button>
        ) : (
          <button key={t.id} className={'tabbar-tab' + (tab === t.id ? ' on' : '')}
            style={{'--tabcolor':t.color}} aria-current={tab === t.id}
            disabled={running && t.id !== 'brag'}
            title={running && t.id !== 'brag' ? 'Locked until the session ends' : t.label}
            onClick={() => { setTab(t.id); setRailOpen(false); }}>
            <TabGlyph id={t.id} />
            <span>{t.label}</span>
            {t.id === 'settings' && unreadNews > 0 && <i className="tabcount">{unreadNews}</i>}
          </button>
        ))}
      </nav>

      <nav className="rail" aria-label="Sections">
        <div className="brand"><Mark size={64} /><b>PlanIt</b></div>
        {/* A team member has an ordinary planner as well as the numbers. Numbers
            is simply one more tab, rather than the only one they get. */}
        {TABS.filter(t => t.id !== 'settings'
          && (!t.parentOnly || isParent) && (!t.adminOnly || isAdmin)).map(t => (
          <button key={t.id} className={'tab' + (tab === t.id ? ' on' : '')} style={{'--tabcolor':t.color}}
            disabled={running && t.id !== 'brag'}
            title={running && t.id !== 'brag' ? 'Locked until the session ends' : t.label}
            onClick={() => { setTab(t.id); setRailOpen(false); }} aria-current={tab === t.id}>
            <span className="tabrule" />
            <span><span className="lbl">{t.label}</span><span className="sub">{t.sub}</span></span>
          </button>
        ))}

        <div className="rail-bottom">
          <button className="tab" onClick={() => { setNewsOpen(true); setRailOpen(false); }} title="Notifications">
            <span className="tabrule" style={{'--tabcolor':'var(--ink35)'}} />
            <span><span className="lbl">Notifications</span><span className="sub">News</span></span>
            {unreadNews > 0 && <i className="tabcount">{unreadNews}</i>}
          </button>
          {TABS.filter(t => t.id === 'settings').map(t => (
            <button key={t.id} data-tour="settings" className={'tab' + (tab === t.id ? ' on' : '')} style={{'--tabcolor':t.color}}
              disabled={running} title={running ? 'Locked until the session ends' : t.label}
              onClick={() => { setTab(t.id); setRailOpen(false); }} aria-current={tab === t.id}>
              <span className="tabrule" />
              <span><span className="lbl">{t.label}</span><span className="sub">{t.sub}</span></span>
            </button>
          ))}
          <div className="rail-account">
            <Initial name={user.username || user.email} size={34} className="railav" />
            <div className="who">
              <b>{user.username}</b>
              {showStreak && (
                <small className="streak" title={`${streak} days in a row`}>
                  <FireIcon level={2} />
                  <span>{streak} day{streak === 1 ? '' : 's'}</span>
                </small>
              )}
            </div>
            <button className="iconbtn" onClick={onSignOut} title="Sign out" aria-label="Sign out"><IconOut /></button>
          </div>
          <div className="rail-foot">
            {running ? 'Focus session running. Other tabs open when the timer ends.' : 'Everything saves as you type.'}
            {!running && <button className="resetlink" onClick={resetPlanner}>Clear all planner data</button>}
          </div>
        </div>
      </nav>

      {/* On a phone the rail is shut, so a badge inside it is a badge nobody
          sees. The count rides on the button that opens it instead. */}
      <button className="menubtn" onClick={() => setRailOpen(v => !v)} aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <path d={railOpen ? "M5 5l10 10M15 5L5 15" : "M3 6h14M3 10h14M3 14h14"}
            stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"/>
        </svg>
        {unreadNews > 0 && !railOpen && <i className="tabcount menucount">{unreadNews}</i>}
      </button>
      {railOpen && <div className="railscrim" onClick={() => setRailOpen(false)} />}

      <main className={'pane' + (isParent && tab !== 'watch' && tab !== 'settings' ? ' readonly' : '')}>
        {/* Something new, said once where it cannot be missed, rather than a
            small number in a corner of a menu that is usually closed. */}
        {newsStrip && (
          <button className="newsstrip" onClick={() => setNewsOpen(true)}>
            <span className="newsdot" aria-hidden="true" />
            <span className="newsstrip-txt">
              <b>{newsStrip.title}</b>
              <span>Tap to read it</span>
            </span>
            <IconArrow />
          </button>
        )}
        <div className="pane-head">
          <div className="title-wrap">
            <div>
              <h1>{meta.title}</h1>
              <div className="tagline">{meta.tagline}</div>
            </div>
            {tab === 'brag' && !isParent && (
              <FocusToggle running={running && focusKind === 'writing'} left={left}
                onStart={startWriting} onStop={pauseTimer} />
            )}
          </div>
          <div className="tape" role="tablist">
            {subsFor(meta).map(([k,l]) => (
              <button key={k} role="tab" aria-selected={sub[tab] === k}
                className={sub[tab] === k ? 'on' : ''} onClick={() => setSub(p => ({...p,[tab]:k}))}>{l}</button>
            ))}
          </div>
          {!isParent && pendingList.length > 0 && (
            <div className="linkbanner">
              <span>
                {pendingList.length === 1 ? 'A parent has asked' : `${pendingList.length} parents have asked`} to follow your planner.
              </span>
              <button className="btn sm" onClick={() => setNewsOpen(true)}>Review</button>
            </div>
          )}

          {isParent && tab !== 'watch' && tab !== 'settings' && (
            !viewChildId
              ? <div className="viewonly">
                  No child connected yet.
                  <button className="btn sm" style={{marginLeft:10}} onClick={() => setTab('watch')}>Go to View It</button>
                </div>
              : childStore === null
              ? <div className="viewonly">Loading {viewChildName}'s planner…</div>
              : childStore.error
              ? <div className="viewonly" style={{background:'var(--rule-soft)',borderColor:'var(--rule-line)',color:'var(--rule)'}}>
                  {childStore.error}
                </div>
              : childStore.empty
              ? <div className="viewonly" style={{background:'var(--brag-soft)',borderColor:'var(--brag-line)',color:'var(--brag)'}}>
                  {viewChildName} hasn't uploaded anything yet. Ask them to open PlanIt and change something.
                </div>
              : <div className="viewonly">
                  Viewing <b>{viewChildName}</b>'s planner, read only.
                  <button className="btn sm" style={{marginLeft:10}} onClick={() => setTab('watch')}>Switch child</button>
                </div>
          )}
          <div className="divider" />
        </div>

        <div className="pane-body">
          {tab === 'organize' && sub.organize === 'daily' &&
            <Daily date={date} setDate={setDate} tasks={view.tasks} add={addTask} update={updateTask} remove={removeTask} toast={toast}
              plusBlock={plusBlock}
              day={view.day || user.day || DEFAULT_DAY} energyBase={energyBase}
              onEditBase={isParent ? null : () => setBaseEdit(true)}
              setDay={d => { dirty.current = true; setStore(s => ({...s, day:d})); }} />}
          {tab === 'organize' && sub.organize === 'weekly' &&
            <Weekly date={date} setDate={setDate} tasks={view.tasks} events={view.events} addEvent={addEvent}
              updateEvent={updateEvent} removeEvent={removeEvent} setDaily={goDaily} update={updateTask}
              remove={removeTask} add={addTask} day={view.day || user.day || DEFAULT_DAY} toast={toast}
              energyBase={energyBase} baseFor={baseFor} />}
          {tab === 'organize' && sub.organize === 'monthly' &&
            <Monthly date={date} setDate={setDate} events={view.events} addEvent={addEvent} updateEvent={updateEvent}
              removeEvent={removeEvent} setEvents={isParent ? null : setEvents} setDaily={goDaily} toast={toast} tasks={view.tasks}
              update={updateTask} remove={removeTask} energyBase={energyBase} baseFor={baseFor}
              settings={settings} setSettings={setSettings} canvasOpen={canvasRef}

      {welcomeSeen && !store.day && !user.day && (

        <StreakPopup

      {/* The welcome cards come before the spotlight tour: the tour points at

      {!welcomeSeen && ready && (

// A crash anywhere below this used to leave a white page with nothing to go on.
class Boundary extends React.Component {
  constructor(p){ super(p); this.state = {err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err, info){ console.error('[planit] crash', err, info); }
  render(){
    if(!this.state.err) return this.props.children;
    const msg = this.state.err.message || String(this.state.err);
    return (
      <div className="crash">
        <h2>PlanIt hit a problem</h2>
        <p>Your planner is safe. This is a display error, not lost data.</p>
        <pre>{msg}</pre>
        <div className="row" style={{gap:9, justifyContent:'center'}}>
          <button className="btn primary" onClick={() => window.location.reload()}>Reload</button>
          <button className="btn" onClick={() => {
            navigator.clipboard.writeText(msg + '\n' + (this.state.err.stack || '')).catch(() => {});
          }}>Copy the error</button>
        </div>
      </div>
    );
  }
}

function Booting(){
  const [slow, setSlow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setSlow(true), 7000); return () => clearTimeout(t); }, []);
  return (
    <div className="booting">
      <div>Opening your planner…</div>
      {slow && (
        <div className="bootslow">
          This is taking longer than it should. Firestore may not be reachable,
          check that the database exists and its rules are published, then reload.
        </div>
      )}
    </div>
  );
}
