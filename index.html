/* ============ ORGANIZE IT: monthly ============ */
function Monthly({date, setDate, events, addEvent, updateEvent, removeEvent, setEvents,
  setDaily, toast, tasks, update, remove, energyBase, baseFor, settings, setSettings, canvasOpen,
  feedSync, viewerId, childId}){
  const first = new Date(date.getFullYear(), date.getMonth(), 1);
  const gridStart = startOfWeek(first);
  const cells = Array.from({length:42}, (_,i) => addDays(gridStart,i));
  const [editing, setEditing] = useState(null);
  const [open, setOpen] = useState(null);
  const monthGoals = (tasks || []).filter(t => t.scope === 'monthly' && t.anchor === monthKey(date));
  // A parent sees every calendar the student has, whatever the student has
  // hidden from their own view, and keeps a choice of their own.
  const cals = calendarsOf(settings);
  const [view, setView] = useState(() => readCalView(calViewKey(viewerId, childId)));
  useEffect(() => { setView(readCalView(calViewKey(viewerId, childId))); }, [viewerId, childId]);
  const saveView = next => { setView(next); writeCalView(calViewKey(viewerId, childId), next); };
  const visible = shownCalendars(view, cals);
  const byCal = colourByCalendar(visible);
  const toggleCal = id => saveView(cycleCal(view, id));
  const keep = e => keepEvent(view, cals, e);
  const touched = view.only.length > 0 || view.not.length > 0;
  const [drag, setDrag] = useState(null);
  const [ghost, setGhost] = useState(null);
  const [overDay, setOverDay] = useState(null);
  const moved = useRef(false);
  const hold = useRef(null);

  const grabEvent = (e, ev) => {
    e.stopPropagation();
    const start = pt => { moved.current = false; setDrag(ev); setGhost({x:pt.clientX, y:pt.clientY, label:ev.title}); };
    if(e.pointerType === 'touch'){
      const sx = e.clientX, sy = e.clientY;
      const stop = () => {
        clearTimeout(hold.current);
        window.removeEventListener('pointermove', watch);
        window.removeEventListener('pointerup', stop);
      };
      const watch = m => { if(Math.abs(m.clientY-sy) > 10 || Math.abs(m.clientX-sx) > 10) stop(); };
      window.addEventListener('pointermove', watch);
      window.addEventListener('pointerup', stop);
      hold.current = setTimeout(() => {
        stop();
        buzz('medium');
        start({clientX:sx, clientY:sy});
      }, 260);
      return;
    }
    e.preventDefault();
    start(e);
  };

  useEffect(() => {
    if(!drag) return;
    document.body.classList.add('dragging');     // see the note in Daily
    const dayUnder = (x,y) => {
      const c = underPointer(x, y, '[data-day]');
      return c ? c.getAttribute('data-day') : null;
    };
    const move = e => {
      moved.current = true;
      setGhost(g => g && {...g, x:e.clientX, y:e.clientY});
      setOverDay(dayUnder(e.clientX, e.clientY));
    };
    const up = e => {
      const dk2 = dayUnder(e.clientX, e.clientY);
      if(dk2 && dk2 !== drag.date){
        buzz('light');
        updateEvent(drag.id, {date:dk2});
        toast(`Moved to ${fmtDay(parseISO(dk2))}`);
      }
      setDrag(null); setGhost(null); setOverDay(null);
      document.body.classList.remove('dragging');
      // stop the cell's click from opening the day popup right after a drag
      setTimeout(() => { moved.current = false; }, 0);
    };
    const block = ev2 => ev2.preventDefault();
    document.body.classList.add('dragging');
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    document.addEventListener('touchmove', block, {passive:false});
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      document.removeEventListener('touchmove', block);
      document.body.classList.remove('dragging');
    };
  }, [drag, updateEvent, toast]);
  const byDay = useMemo(() => {
    const m = {};
    cells.forEach(d => {
      const k = iso(d);
      const list = events.filter(e => occursOn(e, k) && keep(e));
      if(list.length) m[k] = list;
    });
    return m;
  }, [events, date, view, settings]);

  return (
    <div>
      <div className="spread dayhead">
        <DateNav label={fmtMonth(date)} onPrev={() => setDate(addMonths(date,-1))} onNext={() => setDate(addMonths(date,1))} onToday={() => setDate(new Date())} />
        <button className="btn primary" onClick={() => setEditing({title:'', date:iso(date), type:'test', note:''})}>+ Add a date</button>
      </div>

      {cals.length > 0 && (
        <div className="calbar">
          <button className={'calchip all' + (touched ? '' : ' on')}
            onClick={() => saveView({only:[], not:[]})}>All</button>
          {cals.map(c => {
            const st = calState(view, c.id);
            return (
              <button key={c.id} className={'calchip ' + st}
                aria-pressed={st === 'only'}
                title={st === 'only' ? 'Showing only this. Tap to hide it instead.'
                  : st === 'not' ? 'Hidden. Tap to put it back.'

                onClick={() => toggleCal(c.id)}
                style={{'--cc': c.color}}>
                <i aria-hidden="true">{st === 'not' ? '−' : st === 'only' ? '✓' : null}</i>
                {c.name}
              </button>
            );
          })}
          <span className="calmode">
            {byCal ? 'coloured by calendar' : 'coloured by kind of date'}
          </span>
        </div>
      )}

      <div className="month">
        {DOW.map(d => <div className="dow" key={d}>{d}</div>)}
        {cells.map(d => {
          const dk = iso(d);
          const list = byDay[dk] || [];
          return (
            <button key={dk} data-day={dk}
              className={'cell' + (d.getMonth() !== date.getMonth() ? ' out' : '')
                + (sameDay(d,new Date()) ? ' today' : '') + (overDay === dk ? ' dropping' : '')}
              onClick={() => { if(!moved.current) setOpen(dk); }}>
              <div className="spread">
                <span className="dnum">{d.getDate()}</span>
                {(() => {
                  const e = dayEnergy(tasks || [], dk);
                  const b = baseFor ? baseFor(dk) : energyBase;
                  return e ? <span className={'cellbatt ' + energyState(e, b)} title={`${e} of ${b} energy`}>
                    <Battery fill={b ? e/b : 0} size={12} />
                  </span> : null;
                })()}
              </div>
              {list.slice(0,3).map(e => (
                <div className={'ev draggable' + (isDone(e, dk) ? ' done' : '')} key={e.id}
                  onPointerDown={ev2 => grabEvent(ev2, e)}
                  style={{'--evc': eventColor(settings, e, byCal),
                          '--evbg': eventTint(settings, e, byCal)}}
                  title={(byCal && e.cal ? calName(settings, e.cal) + ' · ' : '') + evLabel(e.type)}>
                  {isDone(e, dk) && <EvMark type={e.type} done />}
                  <span className="evt">{e.title}</span>
                </div>
              ))}
              {list.length > 3 && <div className="ev" style={{color:'var(--ink35)',paddingLeft:12}}>+{list.length-3} more</div>}
            </button>
          );
        })}
      </div>

      {ghost && <div className="draglabel" style={{left:ghost.x+12, top:ghost.y-14}}>{ghost.label}</div>}

      <div className="legend" style={{marginTop:14}}>
        {byCal
          ? <>
              {cals.filter(c => visible.includes(c.id))
                .map(c => <span key={c.id}><i style={{background:c.color}} />{c.name}</span>)}
              <span><i style={{background:'var(--ink35)'}} />No class yet</span>
            </>
          : EV_TYPES.map(t => <span key={t.id}><i style={{background:t.color}} />{t.label}</span>)}
      </div>

      <div className="divider" style={{margin:'22px 0 18px'}} />

      <div style={{maxWidth:640}}>
        <div className="eyebrow" style={{marginBottom:9}}>Month goals, from List It</div>
        {monthGoals.length === 0
          ? <Empty title="No goals set for this month" hint="Add them in List It → Monthly." />
          : monthGoals.map(t => (
            <div key={t.id} className={'todo' + (t.done ? ' done' : '')} style={{alignItems:'center'}}>
              <Check on={t.done} onClick={() => update(t.id, {done:!t.done})} />
              <div className="txt"><b>{t.title}</b></div>
              <div className="todo-actions">
                <span className="status">{t.done ? 'Done' : 'Open'}</span>
                <XBtn onClick={() => remove(t.id)} confirm={t.title} />
              </div>
            </div>
          ))}
      </div>

      {setEvents && (
        <>
          <div className="divider" style={{margin:'26px 0 0'}} />
          <div ref={canvasOpen} style={{maxWidth:640, marginTop:18}}>
            <CanvasPanel sync={feedSync} settings={settings} setSettings={setSettings}
              events={events} setEvents={setEvents} toast={toast} />
          </div>
        </>
      )}

      {open && (
        <Modal title={fmtDay(parseISO(open))} onClose={() => setOpen(null)}
          footer={
            <button className="btn primary" onClick={() => { setEditing({title:'', date:open, type:'test', note:''}); setOpen(null); }}>+ Add a date</button>
          }>
          <button className="btn" style={{width:'100%', justifyContent:'center', marginBottom:14}}
            onClick={() => { const d0 = parseISO(open); setOpen(null); setDaily(d0); }}>
            Open this day in Daily <IconArrow />
          </button>
          {(byDay[open] || []).length === 0
            ? <Empty title="Nothing marked on this day" hint="Add a test, deadline, birthday, or meeting." />
            : (byDay[open] || []).map(e => {
              // A repeating date is ticked off for this day only, the same way a
              // repeating task is, so last Friday's quiz stays done.
              const done = isDone(e, open);
              return (
                <div key={e.id} className={'todo' + (done ? ' done' : '')} style={{alignItems:'center'}}>
                  {updateEvent
                    ? <Check on={done} onClick={() => updateEvent(e.id, toggleDone(e, open))} />
                    : <span style={{width:9,height:9,borderRadius:99,background:evColor(e.type),flex:'none'}} />}
                  <div className="txt">
                    <b>{e.title}</b>
                    <div className="meta">
                      <span style={{color:evColor(e.type)}}>{evLabel(e.type)}</span>
                      {e.note ? ` · ${e.note}` : ''}{done ? ' · done' : ''}
                    </div>
                  </div>
                  <div className="todo-actions">
                    {cals.length > 0 && updateEvent && (
                      <select className="btn sm calpick" value={e.cal || ''}

                    <XBtn onClick={() => removeEvent(e.id)} label="Remove" confirm={e.title} />
                  </div>

              );
            })}
        </Modal>
      )}

      {editing && <EventEditor ev={editing} cals={cals} onClose={() => setEditing(null)}
        onSave={e => { e.id ? updateEvent(e.id, e) : addEvent(e); setEditing(null); }}
        onDelete={editing.id ? () => { removeEvent(editing.id); setEditing(null); } : null} />}
    </div>
  );
}

    </Modal>

/* ============ LIST IT ============ */
/* ---- one thing at a time ----

   A list of fourteen things is a reason not to start any of them. This picks
   one and puts it above the list: whatever is running now, else the next thing
   with a time on it, else the most important thing without one. Three ways out
   of it, and the first is deliberately tiny, because the hard part is almost
   never the work, it is the starting. Five minutes is small enough to agree to
   and long enough to be past the worst of it.

   "Not this" is as important as the other two. Being told to do the thing you
   have already decided you cannot face is how a planner gets closed. */
function pickNow(items, anchor, sub, skipped){
  const live = items.filter(t =>
    !(sub === 'daily' ? isDone(t, anchor) : t.done) && !skipped.includes(t.id));
  if(!live.length) return null;
  const now = minsNow();
  const timed = live.filter(t => t.start).map(t => ({t, s:toMin(t.start), e:toMin(t.end || t.start)}));
  const running = timed.find(x => now >= x.s && now < x.e);
  if(running) return running.t;
  const next = timed.filter(x => x.s > now).sort((a, b) => a.s - b.s)[0];
  if(next) return next.t;
  const loose = live.filter(t => !t.start);
  if(loose.length) return loose[0];
  return timed.sort((a, b) => a.s - b.s)[0].t;
}

function NowCard({task, anchor, sub, onDone, onSkip, onStart, onBreak, hasSteps}){
  const when = task.start ? whenWords(toMin(task.start), toMin(task.end || task.start)) : null;
  return (
    <section className="nowbox" aria-label="What to do next">
      <div className="nowhead">
        <span className="eyebrow">Right now</span>
        {when && <span className={'whenpill nowwhen ' + when.state}
          style={{'--pc': blockHex(task.color) || 'var(--accent)'}}>{when.text}</span>}
      </div>
      <h2 className="nowwhat">{task.title}</h2>
      {hasSteps
        ? <p className="nowstep">First step: {subsOf(task).find(x => !x.done)
            ? subsOf(task).find(x => !x.done).text : 'all steps done'}</p>
        : <button className="nowbreak" onClick={onBreak}>
            Too big? Write down the first step
          </button>}
      <div className="nowacts">
        <button className="btn primary" onClick={onStart}>Start, just 5 minutes</button>
        <button className="btn" onClick={onDone}>Done</button>
        <button className="btn ghost" onClick={onSkip}>Not this</button>
      </div>
    </section>
  );
}

function ListIt({sub, date, setDate, tasks, add, update, remove, setTab, day, carryOver, setCarryOver, toast, settings, setSettings, onFocus, plusTask}){
  const [text, setText] = useState('');
  const anchor = sub === 'daily' ? iso(date) : sub === 'weekly' ? weekKey(date) : monthKey(date);
  // Scheduled things read in the order the day happens; anything without a
  // time yet sits at the end, still in the order it was written.
  const items = tasks.filter(t => t.scope === sub
    && (sub === 'daily' ? occursOn(t, anchor) : t.anchor === anchor))
    .sort((a,b) => {
      if(sub !== 'daily') return 0;
      if(a.start && b.start) return toMin(a.start) - toMin(b.start);
      if(a.start) return -1;
      if(b.start) return 1;
      return 0;
    });
  const doneCount = items.filter(t => sub === 'daily' ? isDone(t, anchor) : t.done).length;
  const [editing, setEditing] = useState(null);
  const pct = items.length ? Math.round(doneCount/items.length*100) : 0;

  const inputRef = useRef(null);
  const [shake, setShake] = useState(false);

  const submit = () => {
    const v = text.trim();
    if(!v){
      setShake(true);
      if(inputRef.current) inputRef.current.focus();
      setTimeout(() => setShake(false), 500);
      return;
    }
    add(sub === 'daily'
      ? {title:v, scope:'daily', date:anchor, start:null, end:null, done:false}
      : {title:v, scope:sub, anchor, done:false});
    setText('');
  };

  /* The plus in the bottom bar puts the cursor in the box rather than opening
     a dialog: the list is written in one line, so the box is the dialog. */
  const taskRef = useRef(plusTask);
  useEffect(() => {
    if(plusTask === taskRef.current) return;
    taskRef.current = plusTask;
    if(inputRef.current){ inputRef.current.focus(); inputRef.current.select(); }
  }, [plusTask]);

  const [openSubs, setOpenSubs] = useState(null);

  /* The one thing, and the ones waved away. Skipping resets when the day
     changes, so nothing is hidden tomorrow because of a mood today. */
  const [skipped, setSkipped] = useState([]);
  useEffect(() => { setSkipped([]); }, [anchor, sub]);
  const calm = !!(settings && settings.calm);
  const oneThing = !(settings && settings.oneThing === false);
  const untilOn = !(settings && settings.untilTime === false);
  const picked = useMemo(() => pickNow(items, anchor, sub, skipped),
    [items, anchor, sub, skipped]);
  // only on today: "right now" means nothing on a day you are only looking at
  const showNow = (oneThing && sub === 'daily' && anchor === iso(new Date())) ? picked : null;

  /* Calm mode: the next few, and the rest behind a button. The number is three
     because a list you can hold in your head is a list you might act on. */
  const [showAll, setShowAll] = useState(false);
  const undone = items.filter(t => !(sub === 'daily' ? isDone(t, anchor) : t.done));
  const visible = (calm && !showAll)
    ? undone.slice(0, 3)
    : items;
  const hidden = items.length - visible.length;

  /* Anything left unticked on a day that has passed. Repeating tasks are left
     alone: they come round again on their own and moving one would break the
     pattern. Only offered on today, and only once you have said nothing to the
     contrary. */
  const today = iso(new Date());
  const leftovers = useMemo(() => {
    if(sub !== 'daily' || anchor !== today) return [];
    return (tasks || []).filter(t =>
      t.scope === 'daily' && !isRepeat(t) && t.date && t.date < today && !t.done);
  }, [tasks, sub, anchor, today]);
  const [rollGone, setRollGone] = useState(false);
  const askRoll = leftovers.length > 0 && !rollGone && !(settings && settings.noRollPrompt);
  const [rollNever, setRollNever] = useState(false);
  const closeRoll = () => {
    if(rollNever && setSettings) setSettings({...(settings || {}), noRollPrompt:true});
    setRollGone(true);
  };
  const rollOver = () => {
    leftovers.forEach(t => update(t.id, {date: today, start:null, end:null}));
    toast(leftovers.length === 1 ? 'Moved to today' : `Moved ${leftovers.length} to today`);
    closeRoll();
  };
  const label = sub === 'daily' ? fmtDay(date) : sub === 'weekly' ? fmtWeek(date) : fmtMonth(date);
  const step = n => sub === 'daily' ? addDays(date,n) : sub === 'weekly' ? addDays(date,7*n) : addMonths(date,n);
  const placeholder = sub === 'daily' ? 'Add something for today…'
    : sub === 'weekly' ? 'Add a goal for this week…' : 'Add a goal for this month…';

  return (
    <div style={{maxWidth:760}}>
      <div className="spread" style={{marginBottom:16}}>
        <DateNav label={label} onPrev={() => setDate(step(-1))} onNext={() => setDate(step(1))} onToday={() => setDate(new Date())} />
        <div className="row" style={{gap:10, alignItems:'flex-end'}}>
          <SpeakBtn label="Read the list out loud"
            text={spokenList(label, items, t => sub === 'daily' ? isDone(t, anchor) : t.done)} />
          <div style={{minWidth:150,flex:'0 1 220px'}}>
            <div className="row" style={{justifyContent:'space-between',fontSize:12,color:'var(--ink60)',marginBottom:5}}>
              <span>{doneCount} of {items.length} done</span><span className="mono">{pct}%</span>
            </div>
            <div className="bar"><i style={{width:pct+'%'}} /></div>
          </div>
        </div>
      </div>

      {askRoll && (
        <div className="rollbar">
          <div className="rollmain">
            <b>{leftovers.length === 1
              ? 'One thing from an earlier day was never ticked off.'
              : `${leftovers.length} things from earlier days were never ticked off.`}</b>
            <span>{leftovers.slice(0, 3).map(t => t.title).join(', ')}
              {leftovers.length > 3 ? ` and ${leftovers.length - 3} more` : ''}</span>
          </div>
          <div className="rollacts">
            <button className="btn sm primary" onClick={rollOver}>Move to today</button>
            <button className="btn sm" onClick={closeRoll}>Leave them</button>
          </div>
          <label className="rollnever">
            <input type="checkbox" checked={rollNever} onChange={e => setRollNever(e.target.checked)} />
            Don't ask me again
          </label>
        </div>
      )}

      {showNow && (
        <NowCard task={showNow} anchor={anchor} sub={sub}
          hasSteps={subsOf(showNow).length > 0}
          onDone={() => {
            update(showNow.id, sub === 'daily' ? toggleDone(showNow, anchor) : {done:true});
            buzz('medium');
          }}
          onSkip={() => setSkipped(k => [...k, showNow.id])}
          onStart={() => onFocus && onFocus(5, showNow.title)}
          onBreak={() => setEditing(showNow)} />
      )}

      <div className={'addbar' + (shake ? ' shake' : '')} data-tour="listadd">
        <div className="addwrap">
          <span className="addplus" aria-hidden="true">+</span>
          <input ref={inputRef} value={text} onChange={e => setText(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && submit()} placeholder={placeholder} />
          <span className="addvoice">
            <MicBtn onText={said => setText(t => (t.trim() ? t + ' ' : '') + said)}
              label="Dictate it" />
          </span>
        </div>
        <button className="btn primary" onClick={submit}>Add</button>
      </div>

      {items.length === 0
        ? <Empty title={sub === 'daily' ? 'Today is wide open' : sub === 'weekly' ? 'No goals for this week yet' : 'No goals for this month yet'}
            hint="Type above and press Enter to start the list." />
        : visible.map(t => (
          <div key={t.id} className={'todo' + ((sub === 'daily' ? isDone(t, anchor) : t.done) ? ' done' : '')}
            onDoubleClick={ev => { if(sub === 'daily' && !ev.target.closest('button')) setEditing(t); }}>
            <Check on={sub === 'daily' ? isDone(t, anchor) : t.done}
              onClick={() => update(t.id, sub === 'daily' ? toggleDone(t, anchor) : {done:!t.done})} />
            <div className="txt">
              <b>{t.title}</b>
              {sub === 'daily' && (
              <div className="meta">
                {blockHex(t.color) && <i className="cdot" style={{background:blockHex(t.color)}} />}
                {t.start ? `${pretty(t.start)} – ${pretty(t.end)}` : 'No time yet'}
                {t.start && untilOn && anchor === today && (() => {
                  const w = whenWords(toMin(t.start), toMin(t.end || t.start));
                  if(!w) return null;
                  return <span className={'whenpill ' + w.state}
                    style={{'--pc': blockHex(t.color) || 'var(--accent)'}}>{w.text}</span>;
                })()}
                {isRepeat(t) ? ` · ${repeatText(t)}` : ''}
                {subsOf(t).length > 0 && (
                  <button className="substoggle"
                    onClick={ev => { ev.stopPropagation(); setOpenSubs(o => o === t.id ? null : t.id); }}
                    aria-expanded={openSubs === t.id}>
                    {' · '}{subsOf(t).filter(x => x.done).length} of {subsOf(t).length} steps
                    <IconArrow dir={openSubs === t.id ? 'up' : 'down'} />
                  </button>
                )}
              </div>
            )}
              {openSubs === t.id && subsOf(t).length > 0 && (
                <ul className="steplist sublist">
                  {subsOf(t).map(st => (
                    <li key={st.id}>
                      <Check on={!!st.done} onClick={() => update(t.id, {subs:
                        subsOf(t).map(x => x.id === st.id ? {...x, done: !x.done} : x)})} />
                      <span className={st.done ? 'done' : ''}>{st.text}</span>
                    </li>
                  ))}
                </ul>
              )}
            </div>
            <div className="todo-actions">
              {sub === 'daily' && <button className="btn sm" onClick={() => setEditing(t)}>Edit</button>}
              <XBtn onClick={() => remove(t.id)} confirm={t.title} />
            </div>
          </div>
        ))}

      {hidden > 0 && (
        <button className="showrest" onClick={() => setShowAll(true)}>
          {hidden} more {hidden === 1 ? 'thing' : 'things'}, and what you have finished
        </button>
      )}
      {calm && showAll && items.length > 3 && (
        <button className="showrest" onClick={() => setShowAll(false)}>Show me less again</button>
      )}

      {editing && <BlockEditor block={editing} day={day || DEFAULT_DAY} occ={anchor}
        add={add} update={update} remove={remove} onClose={() => setEditing(null)}
        onSave={b => { update(b.id, b); setEditing(null); }}
        onDelete={id => { remove(id); setEditing(null); }} />}


    </div>
  );
}

/* ============ RESUME EXPORT ============ */


/* Entries used to be kept to the month. They are days now, and both shapes
   have to read properly: anything saved before this still says "Sep 2024",
   anything saved since says the day as well. */
const dayLabel = v => {
  const f = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
  if(f) return MON[+f[2] - 1].slice(0, 3) + ' ' + (+f[3]) + ', ' + f[1];
  return monthName(v);
};
const monthName = ym => {
  if(!ym) return '';
  const [y,m] = ym.split('-');
  return m ? `${MON[+m-1].slice(0,3)} ${y}` : y;
};
const rangeText = e => e.ongoing
  ? `${dayLabel(e.start)} – present`
  : [dayLabel(e.start), dayLabel(e.end)].filter(Boolean).join(' – ');

function buildResume(list, format, sort){
  const rank = (a, b) =>
    sort === 'recent' ? (b.start || '').localeCompare(a.start || '')
    : sort === 'az'   ? a.title.localeCompare(b.title)
    : (b.priority || 0) - (a.priority || 0) || a.title.localeCompare(b.title);
  const order = c => list.filter(e => e.category === c).sort(rank);
  const exp = order('experience'), hon = order('honor'), cert = order('certification');

  // Plain list: every entry in one run, most important first, nothing else.
  if(format === 'plain'){
    return [...exp, ...hon, ...cert].sort(rank)
      .map(e => `• ${e.title}${dateRange(e) ? `  (${dateRange(e)})` : ''}`)
      .join('\n');
  }

  // Common App order: the fields the application asks for, in its sequence.
  if(format === 'activities'){
    const appLines = e => e.category === 'honor' ? [
      e.title,
      [gradeText(e.grades), (e.levels || []).join(', '), placeText(e)]
        .filter(Boolean).join(' · ').replace(/^./, m => '   ' + m),
      e.detail && `   ${e.detail}`,
    ] : e.category === 'certification' ? [
      e.title, e.org && `   ${e.org}`, dateRange(e) && `   ${dateRange(e)}`,
    ] : [
      e.title + (e.actType ? `  [${e.actType}]` : ''),
      e.org && `   ${e.org}`,
      [gradeText(e.grades), timeText(e)].filter(Boolean).join(' · ').replace(/^./, m => '   ' + m),
      e.desc && `   ${e.desc}`,
      e.college === 'yes' && '   Continuing in college',
    ];
    return [...exp, ...hon, ...cert]
      .map(e => appLines(e).filter(x => x && x.trim()).join('\n')).join('\n\n');
  }

  // Résumé: name and dates on one line, organization under it, then what you
  // did. No category, no grade levels, no hours a week: those are the Common
  // App's questions, not a résumé's.
  const entry = e => {
    const lines = [dateRange(e) ? `${e.title}   ${dateRange(e)}` : e.title];
    if(e.org) lines.push(`   ${e.org}`);
    (e.desc || '').split('\n').map(x => x.trim()).filter(Boolean)
      .forEach(b => lines.push(`   ${b}`));
    if(e.category === 'honor'){
      const meta = [(e.levels || []).join(', '), placeText(e)].filter(Boolean).join(' · ');
      if(meta) lines.push(`   ${meta}`);
      if(e.detail) lines.push(`   ${e.detail}`);
    }
    return lines.join('\n');
  };
  const section = (label, rows) => rows.length ? [
    label.toUpperCase(), '─'.repeat(label.length + 4), ...rows.map(entry)
  ].join('\n') : '';

  return [section('Experience', exp), section('Honors', hon), section('Certifications', cert)]
    .filter(Boolean).join('\n\n');
}
