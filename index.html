function ResumeExport({ecs, onClose, toast, settings, setSettings, user, sort}){
  // Contact and education details live outside Brag It, so they are asked for
  // once and kept, prefilled from the account, editable every time.
  const saved = settings.resume || {};
  const [d, setD] = useState({
    name: saved.name || user.name || '',
    phone: saved.phone || '',
    email: saved.email || user.email || '',
    location: saved.location || '',
    education: (saved.education && saved.education.length) ? saved.education
      : [{school:'', years:'', notes:''}],
  });
  const [picked, setPicked] = useState(() => ecs.map(e => e.id));
  const [tab, setTab] = useState('details');     // details | entries | preview
  // Three shapes, because a résumé, the Common App and a list someone asked
  // you for are three different documents.
  const [format, setFormat] = useState('resume');
  const [withMoney, setWithMoney] = useState(false);
  const acad = academicOf(settings);
  // the chosen layout is remembered, because people pick one and keep it
  const [layout, setLayout] = useState(() => (settings.resume || {}).layout || 'classic');
  const [fit, setFit] = useState(() => (settings.resume || {}).fit !== false);
  const [scale, setScale] = useState(1);
  const [pages, setPages] = useState(1);
  const frame = useRef(null);
  const paper = useRef(null);

  const set = (k, v) => setD(p => ({...p, [k]: v}));
  const setEdu = (i, k, v) => setD(p => ({...p,
    education: p.education.map((e, n) => n === i ? {...e, [k]: v} : e)}));
  const addEdu = () => setD(p => ({...p, education:[...p.education, {school:'', years:'', notes:''}]}));
  const dropEdu = i => setD(p => ({...p, education: p.education.filter((_, n) => n !== i)}));

  // keep them for next time, without making the person press save
  useEffect(() => {
    const t = setTimeout(() => setSettings({...settings, resume: {...d, layout, fit}}), 700);
    return () => clearTimeout(t);
  }, [d, layout, fit]);

  const toggle = id => setPicked(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  const groups = [
    ['experience','Experience'], ['honor','Awards'], ['certification','Certifications'],
  ].map(([k,label]) => [k, label, ecs.filter(e => e.category === k)]).filter(g => g[2].length);
  const allIn = rows => rows.every(e => picked.includes(e.id));
  const toggleGroup = rows => setPicked(p => allIn(rows)
    ? p.filter(id => !rows.some(e => e.id === id))
    : Array.from(new Set([...p, ...rows.map(e => e.id)])));

  const chosen = ecs.filter(e => picked.includes(e.id));
  // Whatever order you had the list in is the order it prints in. Choosing
  // "most recent first" and then getting a résumé sorted some other way is a
  // small betrayal of a choice you just made.
  const inOrder = rows => {
    const c = [...rows];
    if(sort === 'recent') c.sort((a,b) => (b.start || '').localeCompare(a.start || ''));
    else if(sort === 'az') c.sort((a,b) => a.title.localeCompare(b.title));
    else c.sort((a,b) => (b.priority || 0) - (a.priority || 0) || a.title.localeCompare(b.title));
    return c;
  };
  const byCat = c => inOrder(chosen.filter(e => e.category === c));

  // one description per line becomes one bullet per line
  const bulletsOf = e => (e.desc || '').split('\n').map(x => x.trim()).filter(Boolean);

  // what makes an award worth reading: how selective it was
  const honMeta = e => e.category !== 'honor' ? ''
    : [(e.levels || []).join(', '), placeText(e)].filter(Boolean).join(' · ');

  const esc = t => String(t == null ? '' : t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  const sectionHTML = (title, rows) => {
    if(!rows.length) return '';
    return `<section><h2>${esc(title)}</h2>` + rows.map(e => `
      <article>
        <div class="line"><span class="what">${esc(e.title)}</span>${
          dateRange(e) ? `<span class="when">${esc(dateRange(e))}</span>` : ''}</div>
        ${e.org ? `<div class="where">${esc(e.org)}</div>` : ''}
        ${honMeta(e) ? `<div class="where">${esc(honMeta(e))}</div>` : ''}
        ${bulletsOf(e).length ? `<ul>${bulletsOf(e).map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
        ${e.detail ? `<div class="note">${esc(e.detail)}</div>` : ''}
        ${withMoney && sumMoney(e) ? `<div class="where">${esc(money(sumMoney(e)))} earned</div>` : ''}
      </article>`).join('') + `</section>`;
  };

  const eduHTML = () => {
    const rows = d.education.filter(e => e.school.trim());
    // Grades can be worth printing before a school has been typed in, so the
    // section appears if either half has anything in it.
    if(!rows.length) return acadHTML()
      ? `<section><h2>Education</h2>${acadHTML()}</section>` : '';
    return `<section><h2>Education</h2><div class="edugrid">` + rows.map(e => `
      <div>
        ${e.years ? `<div class="when">${esc(e.years)}</div>` : ''}
        <div class="what">${esc(e.school)}</div>
        ${e.notes ? e.notes.split('\n').filter(x => x.trim())
            .map(n => `<div class="note">${esc(n.trim())}</div>`).join('') : ''}
      </div>`).join('') + `</div>` + acadHTML() + `</section>`;
  };

  // Grades, rank and coursework: kept in Brag It, printed only here.
  const acadHTML = () => {
    const lines = academicLines(acad);
    const courses = (acad.coursework || '').split('\n').map(x => x.trim()).filter(Boolean);
    if(!lines.length && !courses.length) return '';
    return `<div class="acad" style="padding-left:10px">`
      + lines.map(l => `<div>${esc(l)}</div>`).join('')
      + (courses.length ? `<div>${esc('Coursework: ' + courses.join(', '))}</div>` : '')
      + `</div>`;
  };

  /* One document, whichever layout is chosen. The scale is a single number
     multiplied into the root size; everything else is in em, so the page
     shrinks in proportion instead of the type closing up on fixed spacing. */
  const docHTML = (layoutId = layout, scale = 1) => {
    const L = layoutById(layoutId);
    const contact = [d.phone, d.email, d.location].filter(Boolean)
      .map(x => `<div>${esc(x)}</div>`).join('');
    return `<!doctype html><meta charset="utf-8"><title>${esc(d.name || 'Résumé')}</title>
<style>${RESUME_BASE}${layoutId === 'column' ? '' : RESUME_FLAT}${L.css}
  :root{--s:${scale.toFixed(4)}}
</style>
<div class="sheet">
  <header>
    <h1>${esc(d.name || 'Your name')}</h1>
    <div class="contact">${contact}</div>
  </header>
  <div class="cols">
    <aside class="rail">
      ${layoutId === 'column' && contact ? `<div class="railcontact">${contact}</div>` : ''}
      ${eduHTML()}
    </aside>
    <main class="main">
      ${sectionHTML('Experience', byCat('experience'))}
      ${sectionHTML('Awards', byCat('honor'))}
      ${sectionHTML('Certifications', byCat('certification'))}
    </main>
  </div>
</div>`;
  };

  /* ---- fitting it onto one page ----

     Measured on the real document rather than guessed at: the frame renders
     at full size, its height is read, and the scale is whatever brings it
     inside one page. Shrinking reflows the text, so a second pass checks the
     answer. There is a floor, because a resume nobody can read is not a
     resume that fits. */
  const FIT_FLOOR = 0.72;
  const measure = () => {
    const el = frame.current;
    if(!el || !el.contentDocument) return null;
    const sheet = el.contentDocument.querySelector('.sheet');
    return sheet ? sheet.getBoundingClientRect().height : null;
  };

  const refit = () => {
    const el = frame.current;
    if(!el) return;
    const doc = el.contentDocument;
    if(!doc) return;
    const root = doc.documentElement;
    const set = v => root.style.setProperty('--s', String(v));

    set(1);
    let h = measure();
    if(!h) return;
    if(!fit){
      setScale(1);
      setPages(Math.max(1, Math.ceil(h / PAGE_BODY_H - 0.02)));
      return;
    }
    let v = 1;
    for(let i = 0; i < 3 && h > PAGE_BODY_H; i++){
      v = Math.max(FIT_FLOOR, v * (PAGE_BODY_H / h));
      set(v);
      h = measure();
      if(v <= FIT_FLOOR) break;
    }
    setScale(v);
    setPages(Math.max(1, Math.ceil(h / PAGE_BODY_H - 0.02)));
  };

  /* The frame is a real US Letter page, 816 by 1056, scaled to whatever room
     the modal has. Measured rather than assumed, so it stays right when the
     window changes size. */
  useEffect(() => {
    const el = paper.current;
    if(!el) return;
    const zoom = () => {
      // the width the page has to live in, before its own height follows
      const w = (el.parentElement || el).clientWidth - 28;
      const cap = Math.min(w, 460);
      if(cap > 0) el.style.setProperty('--pz', String(cap / PAGE_W));
    };
    zoom();
    if(typeof ResizeObserver === 'undefined'){
      window.addEventListener('resize', zoom);
      return () => window.removeEventListener('resize', zoom);
    }
    const ro = new ResizeObserver(zoom);
    ro.observe(el.parentElement || el);
    return () => ro.disconnect();
  }, [tab, format]);

  // re-measure whenever anything that changes the page changes
  const docSrc = useMemo(() => docHTML(layout, 1),
    [layout, d, picked, withMoney, sort, acad, ecs]);
  useEffect(() => {
    const t = setTimeout(refit, 90);
    return () => clearTimeout(t);
  }, [docSrc, fit, tab]);

  const print = () => {
    const w = window.open('', '_blank', 'width=860,height=1000');
    if(!w) return toast('Allow pop-ups to print');
    w.document.write(docHTML(layout, scale));
    w.document.close(); w.focus();
    setTimeout(() => w.print(), 400);
  };

  const download = () => {
    const blob = new Blob([docHTML(layout, scale)], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(d.name || 'resume').replace(/\s+/g,'-').toLowerCase()}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Downloaded. Open it and print to PDF');
  };

  return (
    <Modal title="Export as a résumé" onClose={onClose}
      footer={<>
        <button className="btn" onClick={download}>Download</button>
        <button className="btn primary" onClick={print}>Print / PDF</button>
      </>}>

      <div className="field" style={{marginBottom:14}}>
        <span>What shape do you need?</span>
        <div className="row" style={{gap:7, flexWrap:'wrap'}}>
          {[['resume','Résumé'],['activities','Common App'],['plain','Plain list']].map(([k, l]) => (
            <button key={k} className={'chip' + (format === k ? ' on' : '')}
              onClick={() => { setFormat(k); }}>{l}</button>
          ))}
        </div>
        {format === 'resume' && (
          <label className="row" style={{gap:8, marginTop:11, fontSize:12.5, color:'var(--ink60)'}}>
            <input type="checkbox" checked={withMoney} style={{width:15,height:15,flex:'none'}}
              onChange={e => setWithMoney(e.target.checked)} />
            Print money earned where there is any
          </label>
        )}
      </div>

      <div className="tape" style={{marginBottom:16}}>
        {[['details','Your details'],['entries','What to include'],['preview','Preview']].map(([k,l]) => (
          <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      {tab === 'details' && (
        <>
          <p style={{marginTop:0, fontSize:12.5, color:'var(--ink35)', lineHeight:1.5}}>
            These aren't in Brag It, so PlanIt asks once and remembers them. Change them any time.
          </p>
          <Field label="Full name"><input value={d.name} onChange={e => set('name', e.target.value)}
            placeholder="Your name" /></Field>
          <div className="grid2">
            <Field label="Phone"><input value={d.phone} onChange={e => set('phone', e.target.value)}
              placeholder="470-555-0199" inputMode="tel" /></Field>
            <Field label="Email"><input value={d.email} onChange={e => set('email', e.target.value)}
              placeholder="you@example.com" inputMode="email" /></Field>
          </div>
          <Field label="Location"><input value={d.location} onChange={e => set('location', e.target.value)}
            placeholder="City, State" /></Field>

          <div className="spread" style={{margin:'18px 0 8px'}}>
            <span className="eyebrow">Education</span>
            <button className="btn sm" onClick={addEdu}>Add a school</button>
          </div>
          {d.education.map((e, i) => (
            <div key={i} className="card" style={{marginBottom:10}}>
              <div className="grid2">
                <Field label="School"><input value={e.school} onChange={ev => setEdu(i,'school',ev.target.value)}
                  placeholder="Lambert High School" /></Field>
                <Field label="Years"><input value={e.years} onChange={ev => setEdu(i,'years',ev.target.value)}
                  placeholder="2025–Present" /></Field>
              </div>
              <Field label="Notes, one per line">
                <textarea value={e.notes} onChange={ev => setEdu(i,'notes',ev.target.value)}
                  placeholder={"Maintaining a 4.32/4.0 GPA\n1350 NMSQT score"} />
              </Field>
              {d.education.length > 1 && (
                <button className="btn sm" onClick={() => dropEdu(i)}>Remove this school</button>
              )}
            </div>
          ))}
        </>
      )}

      {tab === 'entries' && (
        <>
          <p style={{marginTop:0, fontSize:12.5, color:'var(--ink35)', lineHeight:1.5}}>
            Each line of an entry's description becomes its own bullet on the résumé.
          </p>
          {groups.length === 0
            ? <Empty title="Nothing in Brag It yet" hint="Add activities, awards or certifications first." />
            : groups.map(([k, label, rows]) => (
              <div key={k} style={{marginBottom:14}}>
                <div className="pickhead">
                  <b>{label}</b>
                  <button className="btn sm" onClick={() => toggleGroup(rows)}>{allIn(rows) ? 'None' : 'All'}</button>
                </div>
                {rows.map(e => (
                  <label key={e.id} className="pickrow">
                    <input type="checkbox" checked={picked.includes(e.id)} onChange={() => toggle(e.id)} />
                    <span>
                      <b>{e.title}</b>
                      {e.org && <small>{e.org}</small>}
                    </span>
                  </label>
                ))}
              </div>
            ))}
        </>
      )}

      {tab === 'preview' && format !== 'resume' && (
        <>
          <p className="logempty">
            {format === 'activities'
              ? "The Common App's own shape: its fields, in its order. Copy it across one entry at a time."
              : 'Every entry in one run, most important first.'}
          </p>
          <pre className="plainout">{buildResume(chosen, format, sort) || 'Nothing picked yet.'}</pre>
          <button className="btn" onClick={() => {
            navigator.clipboard.writeText(buildResume(chosen, format, sort))
              .then(() => toast('Copied')).catch(() => toast('Could not copy'));
          }}>Copy it all</button>
        </>
      )}

      {tab === 'preview' && format === 'resume' && (
        <>
          <div className="field" style={{marginBottom:12}}>
            <span>Layout</span>
            <div className="laypick">
              {RESUME_LAYOUTS.map(l => (
                <button key={l.id} className={'laycard' + (layout === l.id ? ' on' : '')}
                  aria-pressed={layout === l.id} onClick={() => setLayout(l.id)}>
                  <LayoutThumb id={l.id} />
                  <b>{l.name}</b>
                </button>
              ))}
            </div>
            <p className="fieldnote">{layoutById(layout).hint}</p>
          </div>

          <label className="switchrow" style={{marginBottom:12}}>
            <span>
              <b>Fit it onto one page</b>
              <small>
                {fit
                  ? (scale < 0.999
                      ? `Everything is at ${Math.round(scale * 100)}% of its normal size so it lands on ${pages === 1 ? 'one page' : pages + ' pages'}.`
                      : 'It already fits at full size.')
                  : `At full size this runs to ${pages === 1 ? 'one page' : pages + ' pages'}.`}
              </small>
            </span>
            <input type="checkbox" checked={fit} onChange={e => setFit(e.target.checked)} />
          </label>
          {fit && scale <= 0.721 && (
            <div className="formnote" style={{marginBottom:12}}>
              This is as small as PlanIt will go before it stops being readable, and it still
              runs over. Take a few entries out on the Entries tab, or shorten the longest
              descriptions.
            </div>
          )}

          {/* The preview is the document itself, in a frame, scaled down to
              fit the modal. There is no second version of the layout to drift
              out of step with what prints. */}
          <div className="paperwrap">
            <div className="paper" ref={paper}>
              <iframe ref={frame} title="Résumé preview" srcDoc={docSrc}
                onLoad={() => setTimeout(refit, 40)} />
            </div>
          </div>
          <p className="fieldnote" style={{textAlign:'center'}}>
            US Letter, {pages === 1 ? 'one page' : pages + ' pages'}. Print or download gives you
            exactly this.
          </p>
        </>
      )}

    </Modal>
  );
}

/* ============ BRAG IT ============ */
// Field names, limits and option lists follow the Common App's Activities and
// Honors sections, so entries can be copied across without rewriting them.
const ACT_TYPES = [
  'Academic','Art','Athletics: Club','Athletics: JV/Varsity','Career Oriented',
  'Community Service (Volunteer)','Computer/Technology','Cultural','Dance','Debate/Speech',
  'Environmental','Family Responsibilities','Foreign Exchange','Internship','Journalism/Publication',
  'Junior R.O.T.C.','Music: Instrumental','Music: Vocal','Religious','Research','Robotics',
  'School Spirit','Science/Math','Social Justice','Student Govt./Politics','Theater/Drama',
  'Work (Paid)','Other Club/Activity','Other',
];
const GRADE_SETS = {
  ms:      [['ms','Middle school']],
  hs:      [['9','9th'],['10','10th'],['11','11th'],['12','12th']],
  college: [['c1','1st year'],['c2','2nd year'],['c3','3rd year'],['c4','4th year']],
};
const gradesFor = stage => GRADE_SETS[stage] || GRADE_SETS.hs;
const STAGES = [['ms','Middle school'],['hs','High school'],['college','College']];
const GRADE_LABEL = Object.fromEntries([...GRADE_SETS.ms, ...GRADE_SETS.hs, ...GRADE_SETS.college]);
const RECOGNITION = ['School','State/Regional','National','International'];
// The Common App's own caps, kept as guidance rather than a hard stop: you
// can write as much as you like here and trim it when you paste it across.
const LIMITS = {desc:150, org:100, position:50, title:100, detail:100};

/* ---- the bragsheet ----

   An activity used to be a single record you wrote once. It is now something
   you keep: hours as you put them in, money as you earn it, awards as they
   come, stories while you still remember them, and, for anything still going,
   what you mean to do next. Every one of these is a list on the activity, so
   nothing already saved has to change shape: an activity with no log simply
   has no log. */
const SHEET_LISTS = ['anecdotes', 'hoursLog', 'money', 'awards', 'steps', 'monthGoals'];
const listOf = (e, k) => (e && Array.isArray(e[k])) ? e[k] : [];

const sumHours = e => Math.round(listOf(e, 'hoursLog')
  .reduce((a, r) => a + (+r.hours || 0), 0) * 10) / 10;
const sumMoney = e => Math.round(listOf(e, 'money')
  .reduce((a, r) => a + (+r.amount || 0), 0) * 100) / 100;
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US',
  {minimumFractionDigits: Math.abs(n) % 1 ? 2 : 0, maximumFractionDigits: 2});

// An estimate from hours-per-week stands in until a real log exists, so the
// number on a long-standing activity is never blank just because it predates
// the log.
const estHours = e => {
  const h = +e.hoursPerWeek || 0, w = +e.weeksPerYear || 0;
  const years = Math.max(1, (e.grades || []).length || 1);
  return h && w ? Math.round(h * w * years) : 0;
};
const hoursText = e => {
  const real = sumHours(e);
  if(real) return real + (real === 1 ? ' hour logged' : ' hours logged');
  const est = estHours(e);
  return est ? 'about ' + est + ' hours' : '';
};

// The month a monthly goal belongs to, and the one on screen now.
const thisMonthKey = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
};
const monthLabel = k => {
  const m = /^(\d{4})-(\d{2})$/.exec(k || '');
  return m ? MON[+m[2] - 1] + ' ' + m[1] : '';
};

/* What to do next on one activity. The nearest unticked step comes first
   because it is the smallest thing you could actually go and do; a goal set
   for this month comes next. Nothing invented: if neither exists, it says so
   and offers the place to write one. */
function nextUp(e){
  const step = listOf(e, 'steps').find(x => !x.done);
  if(step) return {kind:'step', text:step.text};
  const goal = listOf(e, 'monthGoals').find(g => g.month === thisMonthKey() && !g.done);
  if(goal) return {kind:'goal', text:goal.text};
  const later = listOf(e, 'monthGoals')
    .filter(g => !g.done && g.month > thisMonthKey())
    .sort((a, b) => a.month.localeCompare(b.month))[0];
  if(later) return {kind:'later', text:later.text, month:later.month};
  return null;
}

/* The academic record. It is kept here because it belongs with everything else
   you would put on a résumé, and it is shown nowhere in the planner itself:
   the only place it comes out is the export. */
const ACADEMIC_SCALES = [['4.0','4.0'], ['5.0','5.0'], ['100','100 point'], ['other','Other']];
const academicOf = st => (st && st.academic) || {};
const hasAcademic = a => !!(a && (a.gpa || a.gpaWeighted || a.rank || a.coursework));
function academicLines(a){
  if(!hasAcademic(a)) return [];
  const out = [];
  const scale = a.scale === 'other' ? '' : (a.scale || '4.0');
  if(a.gpa) out.push('GPA ' + a.gpa + (scale ? ' / ' + scale : '') + ' unweighted');
  if(a.gpaWeighted) out.push('GPA ' + a.gpaWeighted + (scale ? ' / ' + scale : '') + ' weighted');
  if(a.rank) out.push('Class rank ' + a.rank + (a.classSize ? ' of ' + a.classSize : ''));
  return out;
}

const gradeText = g => (g || []).map(x => GRADE_LABEL[x] || x).join(', ');

/* ---- teachers ----

   A recommendation letter is written by somebody who taught you for a year and
   has thirty other students to remember. What they are short of is not opinion
   but material: the particular afternoon, the question you would not let go of,
   the thing you fixed for somebody else. That is what this holds, one record
   per class per school year, so when you ask in the autumn there is something
   to hand over.

   Keyed by class and school year rather than by the class itself, because
   classes are cleared every summer and nothing written down should go with
   them. */
const schoolYearLabel = (d = new Date()) => {
  const end = schoolYearEnd(d);
  return (end - 1) + '–' + String(end).slice(2);
};
const teacherNotesOf = st => (Array.isArray(st && st.teacherNotes) ? st.teacherNotes : [])
  .filter(n => n && n.id);
const teacherNote = (st, cal, year) =>
  teacherNotesOf(st).find(n => n.cal === cal && n.year === year) || null;

/* ---- the preset shape ----

   The open version of the bragsheet keeps anything you like about an activity.
   The preset is narrower on purpose: two spikes you name yourself, a third slot
   for the activity that is nothing like either of them, and the same five
   fields on every entry, so the list can be compared against itself. Turning it
   off puts every open field back exactly where it was: nothing is deleted
   either way, and the same activity can be read both ways.

   The wording below is shown while you are choosing which slot an activity
   belongs in, because that is the one moment the distinction matters. */
const SPIKE_NOTE = "After looking through thousands of Ivy League applicants, " +
  "we identified that they have one main spike related to their major, one unique " +
  "spike, and a few other substantial activities that show their characteristics. " +
  "List all your current and prospective activities and categorize them now and " +
  "select the final 10 during senior year. Here is an example format: main spike, " +
  "quantitative proof of main spike, dual spike, quantitative proof of dual spike, " +
  "substantial unique activity that somewhat correlates, proof of spike, proof of " +
  "dual spike, proof of spike, proof of spike, unique activity";

const spikesOf = st => (st && st.spikes) || {};
const bothSpikes = st => {
  const sp = spikesOf(st);
  return !!(String(sp.one || '').trim() && String(sp.two || '').trim());
};
const slotsFor = st => {
  const sp = spikesOf(st);
  return [
    ['one',    String(sp.one || '').trim() || 'Main spike'],
    ['two',    String(sp.two || '').trim() || 'Dual spike'],
    ['unique', 'Unique character activity'],
  ];
};
const slotLabel = (st, k) => (slotsFor(st).find(x => x[0] === k) || ['', ''])[1];
const presetOn = st => !!(st && st.bragPreset);

/* The grade you are in now, worked out from the year you graduate rather than
   stored, so it is right next September without anyone remembering to change
   it. A school year is taken to end in the summer, so autumn already counts as
   the next one. */
const schoolYearEnd = (d = new Date()) => d.getFullYear() + (d.getMonth() >= 6 ? 1 : 0);
function currentGrade(st, stage){
  const grad = +((st && st.gradYear) || 0);
  if(!grad) return '';
  const away = grad - schoolYearEnd();
  if(stage === 'college') return (away >= 0 && away <= 3) ? 'c' + (4 - away) : '';
  if(stage === 'ms') return away >= 0 ? 'ms' : '';
  const g = 12 - away;
  return (g >= 9 && g <= 12) ? String(g) : '';
}
const GRAD_YEARS = () => {
  const y = schoolYearEnd();
  return Array.from({length: 8}, (_, i) => String(y + i));
};

/* A word count against the limit, counting up as you type. Going over is
   allowed and says so: it is easier to cut a long version down than to pad a
   short one out. */
function WordCount({value, max}){
  const v = String(value || '');
  const n = v.trim() ? v.trim().split(/\s+/).length : 0;
  return <span className={'counter' + (n > max ? ' over' : '')}>{n}/{max} words</span>;
}

/* ---- awards ----

   An award is worth more than its name. What a reader wants to know is how
   selective it was, so a row keeps the level, where you placed, out of how
   many, and a phrase about what it was for. */
const AWARD_BLANK = {title:'', grades:[], levels:[], place:'', outOf:'', detail:'', date:''};
const placeText = a => {
  const p = String(a.place || '').trim(), n = String(a.outOf || '').trim();
  if(p && n) return p + ' of ' + n;
  if(p) return p;
  return n ? 'out of ' + n : '';
};
const awardMeta = a => [gradeText(a.grades), (a.levels || []).join(', '), placeText(a)]
  .filter(Boolean).join(' · ');
const dateRange = e => {
  const a = dayLabel(e.start), b = dayLabel(e.end);
  if(a && b) return `${a} – ${b}`;
  if(a) return e.finished ? a : `${a} – present`;
  return b ? `until ${b}` : '';
};
const timeText = e => {
  const h = e.hoursPerWeek, w = e.weeksPerYear;
  return [h && `${h} hrs/week`, w && `${w} weeks/year`].filter(Boolean).join(' · ');
};

function Counter({value, max}){
  const v = value || '';
  const words = v.trim() ? v.trim().split(/\s+/).length : 0;
  const over = max && v.length > max;
  return (
    <span className={'counter' + (over ? ' over' : '')}>
      {words} {words === 1 ? 'word' : 'words'} · {v.length} char{v.length === 1 ? '' : 's'}
      {over ? ` · over Common App's ${max}` : ''}
    </span>
  );
}

/* ---- suggestions while you type ----

   The grey completion a word processor offers, done honestly. Nothing is
   generated and nothing is sent anywhere: the suggestions are a fixed set of
   openings and endings that fit the box you are typing in, picked by what you
   have already written. Press Tab or the right arrow to take one, keep typing
   to ignore it.

   The rule throughout is that it only ever offers scaffolding, never content.
   It will finish "Organised a" with "team of", because that is a sentence
   shape; it will never decide how many people were on your team. */
const SUGGESTIONS = {
  // what you did, in a description or a set of notes
  desc: [
    [/^$/,                        'Led '],
    [/\b(led|ran|organis|organiz)\w*\s$/i, 'a team of '],
    [/\b(led|ran|organised|organized|built|founded)\s+\w+/i, ', which '],
    [/\bwhich\s$/i,               'meant '],
    [/\b(raised|earned|saved)\s$/i, 'around '],
    [/\b(taught|coached|mentored|tutored)\s$/i, 'a group of '],
    [/\bresponsible\s$/i,         'for '],
    [/\bgrew\s$/i,                'it from '],
    [/\bstarted\s$/i,             'the '],
    [/\bhelped\s$/i,              'to '],
  ],
  // an anecdote: the thing you want to remember, not a summary
  anecdote: [
    [/^$/,                        'The day '],
    [/^the day\s$/i,              'we '],
    [/\bwe\s$/i,                  'finally '],
    [/\bi\s$/i,                   'realised '],
    [/\brealised\s$/i,            'that '],
    [/\bfirst time\s$/i,          'I '],
    [/\bnobody\s$/i,              'expected '],
    [/\bended up\s$/i,            'having to '],
  ],
  // a next step: something small enough to actually go and do
  step: [
    [/^$/,                        'Email '],
    [/^email\s$/i,                'the '],
    [/^(ask|email|call|message)\s+\w+/i, ' about '],
    [/^book\s$/i,                 'the '],
    [/^(write|draft)\s$/i,        'the '],
    [/^(finish|submit)\s$/i,      'the '],
    [/^sign\s$/i,                 'up for '],
    [/^(find|look)\s$/i,          'out '],
  ],
  // a goal, by the month or overall
  goal: [
    [/^$/,                        'Get '],
    [/^get\s$/i,                  'to '],
    [/^(reach|hit)\s$/i,          'at least '],
    [/\bby\s$/i,                  'the end of '],
    [/\bend of\s$/i,              'the '],
    [/^run\s$/i,                  'at least '],
    [/^be\s$/i,                   'ready to '],
    [/^(apply|sign)\s$/i,         'for '],
  ],
  // what it would look like if it went really well
  ideal: [
    [/^$/,                        'It keeps going '],
    [/\bkeeps going\s$/i,         'without me, because '],
    [/\bbecause\s$/i,             'someone else '],
    [/^i\s$/i,                    'hand it over '],
    [/\bhand it over\s$/i,        'to '],
    [/\bgood enough\s$/i,         'that '],
  ],
};

/* The one suggestion that fits, or nothing. Only ever offered at the very end
   of what you have typed, and never when you are mid-word. */
/* The next line, rather than the next few words.

   Somebody writing "Spike 1: debate" almost always has a spike 2 coming, and
   the same is true of "1." and of a dash list. So a finished line that is
   plainly one of a series offers the start of the next one, the way a
   document would. Only the shape of the line is read; nothing is guessed
   about what goes in it. */
const LIST_LINE = [
  // a word, a number and a separator: "Spike 1:", "Year 2 -", "Round 3)"
  /^(\s*)([A-Za-z][A-Za-z ]{0,18}?\s)(\d{1,3})( ?[.):\u2013\u2014-])(\s+)(\S.*)$/,
  // a bare number: "1.", "2)"
  /^(\s*)()(\d{1,3})( ?[.):\u2013\u2014-])(\s+)(\S.*)$/,
];
const BULLET_LINE = /^(\s*)([-*\u2022\u2013])(\s+)(\S.*)$/;

function nextLineFor(value, caret){
  const v = String(value || '');
  if(caret !== undefined && caret !== v.length) return '';
  if(!v || v.length > 2000) return '';
  if(/\s$/.test(v)) return '';                 // still typing, or a blank line
  const line = v.slice(v.lastIndexOf('\n') + 1);
  if(line.length < 3 || line.length > 200) return '';
  for(const re of LIST_LINE){
    const m = line.match(re);
    if(!m) continue;
    const [, indent, label, n, sep, gap] = m;
    const next = Number(n) + 1;
    if(next > 99) return '';
    return '\n' + indent + label + next + sep + gap;
  }
  const bm = line.match(BULLET_LINE);
  if(bm) return '\n' + bm[1] + bm[2] + bm[3];
  return '';
}

function suggestFor(kind, value, caret, multiline){
  const v = String(value || '');
  if(caret !== undefined && caret !== v.length) return '';   // not at the end
  // a finished line that is one of a series beats a part-finished phrase
  if(multiline){
    const nl = nextLineFor(v, caret);
    if(nl) return nl;
  }
  const rules = SUGGESTIONS[kind];
  if(!rules) return '';
  if(v.length > 400) return '';
  const line = v.slice(v.lastIndexOf('\n') + 1);
  if(/\S$/.test(line) && line !== '') return '';             // mid-word
  for(const [test, add] of rules){
    if(!test.test(line)) continue;
    if(line.toLowerCase().includes(add.trim().toLowerCase())) continue;  // already said
    return add;
  }
  return '';
}

/* A text box that shows the rest of a likely phrase in grey behind the caret.
   The grey is a second element sitting exactly under the real one, which is
   why both share a font and a padding to the pixel. */
/* ---- reading out loud, and writing down what you say ----

   Both come with the browser. Nothing is sent anywhere by PlanIt, there is no
   key and no account, and where the browser cannot do it the button is not
   drawn rather than drawn and dead.

   Dictation is the uneven one. Safari and Chrome have it; the webview the iOS
   build runs inside does not expose it at all, which is why `hears` is checked
   rather than assumed. On the phone the keyboard's own microphone does the same
   job into any field, so where the button cannot appear PlanIt says that
   instead. Reading out loud works everywhere, the iOS build included. */
/* Present is not the same as working: some webviews carry the name and nothing
   behind it, so what is checked is the two things actually called. */
const speaks = () => typeof window !== 'undefined'
  && !!window.speechSynthesis
  && typeof window.speechSynthesis.speak === 'function'
  && typeof window.SpeechSynthesisUtterance === 'function';
const Recog = () => (typeof window === 'undefined') ? null
  : (window.SpeechRecognition || window.webkitSpeechRecognition || null);
/* Never in the app. The webview does not carry speech recognition, and the
   iOS keyboard already has a microphone that dictates into any field, so a
   second one in the interface would either do nothing or compete with the one
   that works. Checked explicitly rather than relying on the webview to keep
   not having it. */
const hears = () => !isNativeApp() && !!Recog();

/* One voice at a time: starting a second reading stops the first, and leaving
   the page stops it too, so nothing carries on talking into an empty room. */
let speakingNow = null;
function stopSpeaking(){
  try{ window.speechSynthesis.cancel(); }catch(e){}
  speakingNow = null;
}
if(typeof window !== 'undefined'){
  window.addEventListener('pagehide', stopSpeaking);
  window.addEventListener('beforeunload', stopSpeaking);
}

/* How a list sounds. The day, then each thing by name and whether it is done.
   No counting and no numbering: hearing "eleven things" before the first one
   is a reason to stop listening, and the position in a list is not what
   anybody needed to know. */
function spokenList(when, rows, done){
  if(!rows || !rows.length) return '';
  const parts = rows.map(t => (t.title || 'Untitled') + ', ' + (done(t) ? 'finished' : 'unfinished'));
  return (when ? when + '. ' : '') + parts.join('. ') + '.';
}

function SpeakBtn({text, label = 'Read out loud'}){
  const [on, setOn] = useState(false);
  const words = String(text || '').trim();
  useEffect(() => () => { if(speakingNow === setOn) stopSpeaking(); }, []);
  if(!speaks() || !words) return null;

  const go = () => {
    if(on){ stopSpeaking(); setOn(false); return; }
    stopSpeaking();
    try{
      const u = new SpeechSynthesisUtterance(words.slice(0, 4000));
      u.rate = 1;
      // the voice follows the language chosen at sign-up, where the device has one
      u.lang = SPOKEN_LANG;
      try{
        const v = (window.speechSynthesis.getVoices() || [])
          .find(x => x.lang && x.lang.replace('_','-') === SPOKEN_LANG)
          || (window.speechSynthesis.getVoices() || [])
          .find(x => x.lang && x.lang.slice(0,2) === SPOKEN_LANG.slice(0,2));
        if(v) u.voice = v;
      }catch(e){}
      u.onend = () => setOn(false);
      u.onerror = () => setOn(false);
      speakingNow = setOn;
      setOn(true);
      window.speechSynthesis.speak(u);
    }catch(e){ setOn(false); }
  };
  return (
    <button type="button" className={'voicebtn' + (on ? ' on' : '')} onClick={go}
      aria-label={on ? 'Stop reading' : label} title={on ? 'Stop reading' : label}>
      {on ? (
        <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
          <rect x="3" y="3" width="8" height="8" rx="1.5" fill="currentColor" />
        </svg>
      ) : (
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 6.2h2L7.8 3.4v9.2L4.5 9.8h-2z" fill="currentColor" />
          <path d="M10.3 5.8a3 3 0 0 1 0 4.4M12.2 4a5.4 5.4 0 0 1 0 8" stroke="currentColor"
            strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      )}
    </button>
  );
}

/* Dictation. Each finished phrase is appended to whatever is already in the
   field, so you can talk, stop, read it, and carry on. */
/* Speech out of a microphone and into a callback, for as long as it is wanted.
   Recognition gives up on its own after a silence, which would end a study
   session's captions the first time nobody spoke for a few seconds, so it is
   started again whenever it stops by itself. */
const SPEECH_TROUBLE = {
  'not-allowed': 'The microphone is blocked. Allow it for this site and try again.',
  'service-not-allowed': 'The microphone is blocked. Allow it for this site and try again.',
  'audio-capture': 'No microphone was found on this device.',
  'network': 'The speech service could not be reached. Check your connection.',
};

function useSpeechOut({on, onPhrase, onFail, onTrouble}){
  const hand = useRef(onPhrase);
  useEffect(() => { hand.current = onPhrase; }, [onPhrase]);
  const fail = useRef(onFail);
  useEffect(() => { fail.current = onFail; }, [onFail]);
  const bad = useRef(onTrouble);
  useEffect(() => { bad.current = onTrouble; }, [onTrouble]);

  useEffect(() => {
    if(!on) return;
    const R = Recog();
    if(!R){ if(fail.current) fail.current(); return; }
    let dead = false;
    let stopped = 0;              // how many times it has given up on its own
    let r;

    const build = () => {
      const x = new R();
      x.lang = SPOKEN_LANG;
      x.continuous = true;
      x.interimResults = false;
      x.onresult = e => {
        stopped = 0;
        let said = '';
        for(let i = e.resultIndex; i < e.results.length; i++){
          if(e.results[i].isFinal) said += e.results[i][0].transcript;
        }
        if(said.trim() && hand.current) hand.current(said.trim());
      };
      /* Recognition gives up after a few seconds of quiet, which is the whole
         reason dictation seemed not to work: press the button, think for a
         moment, and it had already switched itself off. While it is still
         wanted it is started again, with a ceiling so a microphone that cannot
         start at all is not retried forever. */
      x.onend = () => {
        if(dead) return;
        if(++stopped > 40){ if(fail.current) fail.current(); return; }
        try{ r = build(); r.start(); }catch(err){}
      };
      x.onerror = e => {
        const kind = e && e.error;
        if(kind === 'no-speech' || kind === 'aborted') return;   // onend restarts it
        dead = true;
        if(bad.current) bad.current(SPEECH_TROUBLE[kind] || 'Dictation stopped unexpectedly.');
        if(fail.current) fail.current();
      };
      return x;
    };

    try{ r = build(); r.start(); }
    catch(e){ if(fail.current) fail.current(); return; }
    return () => { dead = true; try{ r.onend = null; r.stop(); }catch(e){} };
  }, [on]);
}

/* ---- "AP precalc homework at 4pm" ----

   Said out loud, a scheduled thing comes with its time attached, so the time is
   taken off the end and turned into a start. Only a time at the end counts: "Ask
   about the 4pm bus" keeps its whole title, because the time there is part of
   what the task is rather than when it is.

   Nothing is guessed. If there is no time on the end, the title is the whole
   sentence and it goes on the list with no time, which is exactly what List It
   is for. */
const SPOKEN_TIME = /\s+(?:at|@|around|about)?\s*(\d{1,2})(?::|\.|\s)?(\d{2})?\s*(a\.?m\.?|p\.?m\.?|o'?clock)?\s*$/i;

function parseWhen(said){
  const text = String(said || '').trim().replace(/[.!?]+$/, '');
  const m = SPOKEN_TIME.exec(text);
  if(!m) return {title: text, start: null};

  let hour = +m[1];
  const mins = m[2] ? +m[2] : 0;
  const mark = (m[3] || '').toLowerCase().replace(/[.']/g, '');
  if(hour > 23 || mins > 59) return {title: text, start: null};

  // A bare number is only a time when it was introduced as one, or when it
  // cannot be anything else. "Read 20" is a page, not eight in the evening.
  const said_at = /\s(?:at|@|around|about)\s*\d/i.test(text);
  if(!mark && !said_at) return {title: text, start: null};

  if(mark === 'pm' && hour < 12) hour += 12;
  if(mark === 'am' && hour === 12) hour = 0;
  /* No am or pm, including "seven o'clock": read it the way a school day runs,
     so four is the afternoon and nobody is scheduled at four in the morning by
     accident. Eight to twelve are left alone, since those are said about the
     morning as often as the evening. */
  if((!mark || mark === 'oclock') && hour >= 1 && hour <= 7) hour += 12;

  const title = text.slice(0, m.index).trim()
    .replace(/[,;]+$/, '')
    .replace(/\s*\b(at|around|about)$/i, '').trim();
  // "at 4pm" on its own names a time and nothing to do at it
  if(title.length < 2) return {title: text, start: null};
  return {title, start: pad(hour) + ':' + pad(mins)};
}

function MicBtn({onText, label = 'Dictate'}){
  const [on, setOn] = useState(false);
  const [trouble, setTrouble] = useState('');
  useSpeechOut({
    on,
    onPhrase: said => onText(said),
    onFail: () => setOn(false),
    onTrouble: msg => setTrouble(msg),
  });
  if(!hears()) return null;
  return (
    <>
      <button type="button" className={'voicebtn mic' + (on ? ' on' : '')}
        onClick={() => { setTrouble(''); setOn(v => !v); if(!on) buzz('light'); }}
        aria-label={on ? 'Stop dictating' : label}
        title={on ? 'Stop dictating' : label}>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="5.6" y="1.6" width="4.8" height="8" rx="2.4" fill="currentColor" />
          <path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.2v2.2" stroke="currentColor"
            strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      </button>
      {trouble && <span className="micbad" role="alert">{trouble}</span>}
    </>
  );
}

/* ---- history on a box you write in ----

   A controlled React field has no native undo: the browser's own stack is
   thrown away on every keystroke, so Ctrl+Z inside one of these does nothing.
   This puts it back, and goes a step further by keeping the versions
   themselves, the way a document does. A version is recorded after a pause in
   typing rather than per character, so stepping back goes a sentence at a
   time instead of a letter. */
const HIST_MAX = 50;
function useTextHistory(value, onChange){
  const [hist, setHist] = useState(() => [{v:String(value || ''), at:Date.now()}]);
  const [at, setAt] = useState(0);
  // stepping through history changes the value too; that is not a new version
  const moving = useRef(false);

  useEffect(() => {
    if(moving.current){ moving.current = false; return; }
    const t = setTimeout(() => {
      const v = String(value || '');
      if(hist[at] && hist[at].v === v) return;
      const cut = hist.slice(0, at + 1).concat([{v, at:Date.now()}]);
      const kept = cut.length > HIST_MAX ? cut.slice(cut.length - HIST_MAX) : cut;
      setHist(kept);
      setAt(kept.length - 1);
    }, 700);
    return () => clearTimeout(t);
  }, [value, at, hist]);

  const goTo = i => {
    if(i < 0 || i >= hist.length || i === at) return;
    moving.current = true;
    setAt(i);
    onChange(hist[i].v);
  };
  return {
    hist, at,
    canUndo: at > 0,
    canRedo: at < hist.length - 1,
    undo: () => goTo(at - 1),
    redo: () => goTo(at + 1),
    goTo,
  };
}

// "just now", "4 min ago", "2:15 PM" once it is no longer today's news
function agoWords(ms){
  const s = Math.round((Date.now() - ms)/1000);
  if(s < 45) return 'just now';
  if(s < 3600) return Math.round(s/60) + ' min ago';
  if(s < 86400) return Math.round(s/3600) + (Math.round(s/3600) === 1 ? ' hour ago' : ' hours ago');
  return new Date(ms).toLocaleDateString();
}

function HistoryBar({h, label = 'this'}){
  const [open, setOpen] = useState(false);
  const wrap = useRef(null);
  useEffect(() => {
    if(!open) return;
    const away = e => { if(wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    const esc = e => { if(e.key === 'Escape') setOpen(false); };
    document.addEventListener('pointerdown', away);
    document.addEventListener('keydown', esc);
    return () => {
      document.removeEventListener('pointerdown', away);
      document.removeEventListener('keydown', esc);
    };
  }, [open]);

  return (
    <span className="histbar" ref={wrap}>
      <button type="button" className="histbtn" disabled={!h.canUndo} onClick={h.undo}
        aria-label="Undo" title="Undo">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M6.5 5.5L3 9l3.5 3.5M3 9h8.2a4.3 4.3 0 0 1 0 8.6H7"
            stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </button>
      <button type="button" className="histbtn" disabled={!h.canRedo} onClick={h.redo}
        aria-label="Redo" title="Redo">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M13.5 5.5L17 9l-3.5 3.5M17 9H8.8a4.3 4.3 0 0 0 0 8.6H13"
            stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </button>
      <button type="button" className={'histbtn wide' + (open ? ' on' : '')}
        disabled={h.hist.length < 2} aria-expanded={open}
        onClick={() => setOpen(v => !v)}>History</button>
      {open && (
        <div className="histmenu" role="dialog" aria-label={'Earlier versions of ' + label}>
          <div className="histhead">Earlier versions</div>
          <div className="histlist">
            {h.hist.map((v, i) => i).reverse().map(i => {
              const v = h.hist[i];
              const first = v.v.trim().split('\n')[0];
              return (
                <button type="button" key={i} className={'histrow' + (i === h.at ? ' on' : '')}
                  onClick={() => { h.goTo(i); setOpen(false); }}>
                  <span className="histwhen">{i === h.at ? 'Showing now' : agoWords(v.at)}</span>
                  <span className="histtext">{first ? first.slice(0, 70) : 'Empty'}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </span>
  );
}

/* A box with its own history. Ctrl+Z and Ctrl+Shift+Z work inside it, which
   they would not otherwise, and the versions sit behind a button beside the
   label. */
function WritingBox({kind, value, onChange, label, children, ...rest}){
  const h = useTextHistory(value, onChange);
  const keys = e => {
    const meta = e.metaKey || e.ctrlKey;
    if(!meta || e.key.toLowerCase() !== 'z') return;
    e.preventDefault();
    if(e.shiftKey) h.redo(); else h.undo();
  };
  return (
    <>
      <span className="spread writinghead">
        <span className="writinglabel">{children}</span>
        <HistoryBar h={h} label={label} />
      </span>
      <span className="writingbody" onKeyDown={keys}>
        <Suggesting textarea kind={kind} value={value} onChange={onChange} {...rest} />
      </span>
    </>
  );
}

function Suggesting({kind, value, onChange, textarea, ...rest}){
  const ref = useRef(null);
  const [caret, setCaret] = useState(undefined);
  // what is in the box right now, for dictation to append to
  const now = useRef(value);
  useEffect(() => { now.current = value; }, [value]);
  const hint = suggestFor(kind, value, caret, !!textarea);
  const take = () => {
    if(!hint) return false;
    onChange(String(value || '') + hint);
    requestAnimationFrame(() => {
      const el = ref.current;
      if(el){ el.focus(); const n = (String(value || '') + hint).length; el.setSelectionRange(n, n); }
    });
    return true;
  };
  const keys = e => {
    if(!hint) return;
    const atEnd = e.target.selectionStart === String(value || '').length;
    if((e.key === 'Tab' || (e.key === 'ArrowRight' && atEnd)) && take()) e.preventDefault();
  };
  const sync = e => setCaret(e.target.selectionStart);
  const T = textarea ? 'textarea' : 'input';
  return (
    <span className={'sugwrap' + (textarea ? ' ta' : '')}>
      <span className="sugghost" aria-hidden="true">
        <span className="sugreal">{value}</span>
        <span className="sugadd">{hint}</span>
      </span>
      <T ref={ref} {...rest} value={value}
        onChange={e => { onChange(e.target.value); setCaret(e.target.selectionStart); }}
        onKeyDown={keys} onKeyUp={sync} onClick={sync} onSelect={sync}
        onBlur={() => setCaret(-1)} onFocus={sync} />
      {hint && <span className="sugtip" aria-hidden="true">Tab</span>}
      <span className="sugvoice">
        <MicBtn onText={said => {
          const had = String(now.current || '');
          const joined = had + (had.trim() ? (/[.!?]$/.test(had.trim()) ? ' ' : ' ') : '') + said;
          now.current = joined;
          onChange(joined);
        }} />
        <SpeakBtn text={value} label="Read this back" />
      </span>
    </span>
  );
}

/* ---- the simple view ----

   The sheet shows one line per activity and nothing else unless you ask for
   it. Which extras appear is a choice, kept in settings, so the view can be
   as bare or as full as the person reading it needs. */
const SHEET_FIELDS = [
  ['dates',    'Dates'],
  ['role',     'Role and organisation'],
  ['hours',    'Hours'],
  ['money',    'Money earned'],
  ['awards',   'Awards'],
  ['next',     'What is next'],
  ['desc',     'Description'],
  ['anecdote', 'Latest anecdote'],
];
const DEFAULT_SHEET = {dates:true, role:true, hours:true, money:false,
  awards:true, next:true, desc:false, anecdote:false};
const sheetShows = (st, k) => {
  const f = (st && st.sheetFields) || DEFAULT_SHEET;
  return f[k] !== undefined ? !!f[k] : !!DEFAULT_SHEET[k];
};

/* A small editable list: rows you add to and take away from, used for hours,
   money, awards, anecdotes and steps. Each kind differs only in its columns,
   so they share this. */
function LogList({rows, onChange, columns, addLabel, empty, foot}){
  const [draft, setDraft] = useState(() => Object.fromEntries(columns.map(c => [c.k, ''])));
  const set = (k, v) => setDraft(d => ({...d, [k]: v}));
  const addRow = () => {
    const required = columns.filter(c => c.required !== false);
    if(required.some(c => !String(draft[c.k] || '').trim())) return;
    onChange([...rows, {id: uid(), ...draft}]);
    setDraft(Object.fromEntries(columns.map(c => [c.k, ''])));
  };
  return (
    <div className="loglist">
      {rows.length === 0
        ? <p className="logempty">{empty}</p>
        : <ul>
            {rows.map(r => (
              <li key={r.id}>
                <span className="logcells">
                  {columns.map(c => (
                    <span key={c.k} className={'logcell ' + (c.cls || '')}>
                      {c.show ? c.show(r[c.k]) : r[c.k]}
                    </span>
                  ))}
                </span>
                <XBtn onClick={() => onChange(rows.filter(x => x.id !== r.id))} label="Remove"
                  confirm={String(r[columns[0].k] || '') + ' ' + String(r[columns[1] ? columns[1].k : ''] || '')} />
              </li>
            ))}
          </ul>}
      {foot}
      <div className="logadd">
        {columns.map(c => (
          c.suggest ? (
            <Suggesting key={c.k} kind={c.suggest} className="finput" value={draft[c.k]}
              aria-label={c.label} placeholder={c.label}
              onChange={v => set(c.k, v)}
              onKeyDown={e => e.key === 'Enter' && addRow()} />
          ) : (
          <input key={c.k} className="finput" type={c.type || 'text'}
            inputMode={c.type === 'number' ? 'decimal' : undefined}
            step={c.step} min={c.min} value={draft[c.k]}
            aria-label={c.label} placeholder={c.label}
            onChange={e => set(c.k, e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addRow()} />
          )
        ))}
        <button className="btn sm" onClick={addRow}>{addLabel}</button>
      </div>
    </div>
  );
}

/* ---- awards on one activity ----

/* Naming the two spikes. The preset cannot file anything until these exist, so

/* The hours on one activity: the total, a quick way to add some, and a weekly
   figure that adds itself. Every hour is a row you can see and take away
   again, including the automatic ones, so the total is never a number PlanIt
   made up on your behalf. */
function HoursBox({ec, onSave}){
  const e = ec;
  const rows = listOf(e, 'hoursLog');
  const auto = e.autoHours || null;
  const add = (hours, what) => onSave(e.id, {hoursLog: [...rows,
    {id: uid(), date: iso(new Date()), hours: String(hours), what: what || ''}]});

  /* Catching up on the weeks that have gone by since the switch was turned on.
     One row per catch-up, dated today and labelled, capped at a term's worth so
     an account left alone for a year cannot come back to a fictional total. */
  useEffect(() => {
    if(!auto || !auto.perWeek || e.finished) return;
    const from = new Date((auto.since || iso(new Date())) + 'T12:00:00');
    const today = new Date(iso(new Date()) + 'T12:00:00');
    const days = Math.round((today - from) / 864e5);
    const weeks = Math.min(16, Math.floor(days / 7));
    if(weeks < 1) return;
    const gained = Math.round(weeks * (+auto.perWeek) * 10) / 10;
    const until = iso(new Date(from.getTime() + weeks * 6048e5));
    onSave(e.id, {
      autoHours: {...auto, since: until},
      hoursLog: [...rows, {id: uid(), date: until, hours: String(gained),
        what: weeks === 1 ? 'Weekly, added automatically' : weeks + ' weeks, added automatically'}],
    });
  }, [auto && auto.since, auto && auto.perWeek, e.finished]);

  const [per, setPer] = useState(() => (auto && auto.perWeek) || e.hoursPerWeek || '');
  const startAuto = () => {
    if(!(+per > 0)) return;
    onSave(e.id, {autoHours: {perWeek: String(+per), since: iso(new Date())}});
  };

  return (
    <div className="hoursbox">
      <div className="hourstotal">
        <span>Hours spent</span>
        <b className="mono">{sumHours(e)}</b>
      </div>
      <div className="quickhours">
        <span className="eyebrow">Add to today</span>
        <div className="row" style={{gap:6, flexWrap:'wrap'}}>
          {[0.5, 1, 2, 4].map(h => (
            <button key={h} className="btn sm" onClick={() => add(h)}>+{h}</button>
          ))}
        </div>
      </div>
      <div className="autohours">
        {auto && auto.perWeek ? (
          <>
            <span>Adding <b>{auto.perWeek}</b> {+auto.perWeek === 1 ? 'hour' : 'hours'} every week
              by itself{e.finished ? ', paused because this is finished' : ''}.</span>
            <button className="btn sm" onClick={() => onSave(e.id, {autoHours: null})}>Stop</button>
          </>
        ) : (
          <>
            <span>Add the same hours every week without logging them:</span>
            <input className="finput" type="number" min="0" step="0.5" value={per}
              aria-label="Hours every week" placeholder="3"
              onChange={ev => setPer(ev.target.value)} style={{maxWidth:88}} />
            <button className="btn sm" disabled={!(+per > 0)} onClick={startAuto}>Start</button>
          </>
        )}
      </div>
      <LogList rows={rows} onChange={r => onSave(e.id, {hoursLog: r})}
        columns={[
          {k:'date', label:'Date', type:'date', cls:'mono'},
          {k:'hours', label:'Hours', type:'number', step:'0.25', min:'0', cls:'mono num'},
          {k:'what', label:'What you did', required:false},
        ]}
        addLabel="Log it"
        empty="Nothing logged yet. Put the hours in as you do them and the total looks after itself." />
    </div>
  );
}

/* Everything you keep about one activity, in one place: what happened, the
   hours, the money, the awards, and what you mean to do next. */
/* ---- what an activity is actually made of ----

   Six traits, each rated one to five, drawn as a hexagon. The shape is the
   point: a thin spike down one side says the activity is one thing done
   deeply, a round blob says it is broad, and a small shape says it has not
   gone far yet. None of that is a score and none of it is sent anywhere; it
   is a way of looking at an entry you wrote months ago and seeing what it
   was. The question marks say what each word means here, because
   "cohesion" means nothing on its own. */
const SKILL_TRAITS = [
  ['commitment', 'Commitment',
   'How long you stayed and how much of your week it took. Four years of the same club rates higher than one busy term.'],
  ['impact', 'Impact',
   'What changed because you were there. Money raised, people reached, a thing that exists now and did not before.'],
  ['leadership', 'Leadership',
   'How much you ran rather than attended. Holding a title counts for less than actually deciding things.'],
  ['cohesion', 'Cohesion',
   'How well this sits with the rest of your sheet. An activity that joins up with your others rates higher than one on its own.'],
  ['originality', 'Originality',
   'How unusual it is among people applying for the same thing. Founding something rates higher than joining it.'],
  ['interest', 'Interest',
   'How much you actually care. The one trait nobody else can judge, and the one that keeps you going.'],
];

// the six points of a hexagon, starting at the top and going clockwise
function hexPoint(i, r, cx = 50, cy = 50){
  const a = (Math.PI / 3) * i - Math.PI / 2;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
const hexPath = r => SKILL_TRAITS.map((_, i) => hexPoint(i, r).map(n => n.toFixed(1)).join(',')).join(' ');

function SkillHexagon({ec, onSave, readOnly}){
  const vals = (ec && ec.skills) || {};
  const get = k => Math.max(0, Math.min(5, Number(vals[k]) || 0));
  const [open, setOpen] = useState(null);       // which question mark is open
  const any = SKILL_TRAITS.some(([k]) => get(k) > 0);

  const shape = SKILL_TRAITS
    .map(([k], i) => hexPoint(i, 6 + get(k) / 5 * 34).map(n => n.toFixed(1)).join(','))
    .join(' ');

  const set = (k, v) => {
    if(readOnly || !onSave) return;
    onSave(ec.id, {skills: {...vals, [k]: get(k) === v ? v - 1 : v}});
  };

  return (
    <div className="hexwrap">
      <div className="hexart">
        <svg viewBox="0 0 100 100" role="img"
          aria-label={any
            ? SKILL_TRAITS.map(([k, l]) => `${l} ${get(k)} of 5`).join(', ')
            : 'Nothing rated yet'}>
          {[40, 30, 20, 10].map(r => (
            <polygon key={r} points={hexPath(r)} className="hexring" />
          ))}
          {SKILL_TRAITS.map((t, i) => {
            const [x, y] = hexPoint(i, 40);
            return <line key={t[0]} x1="50" y1="50" x2={x.toFixed(1)} y2={y.toFixed(1)} className="hexspoke" />;
          })}
          {any && <polygon points={shape} className="hexshape" />}
          {any && SKILL_TRAITS.map(([k], i) => {
            const [x, y] = hexPoint(i, 6 + get(k) / 5 * 34);
            return <circle key={k} cx={x.toFixed(1)} cy={y.toFixed(1)} r="2.1" className="hexdot" />;
          })}
        </svg>
      </div>

      <div className="hexrows">
        {SKILL_TRAITS.map(([k, label, what]) => (
          <div key={k} className="hexrow">
            <span className="hexlabel">
              {label}
              <button type="button" className="hexwhat" aria-label={'What ' + label + ' means'}
                aria-expanded={open === k}
                onClick={() => setOpen(open === k ? null : k)}>?</button>
            </span>
            <PrioBalls value={get(k)} size="sm" label={label}
              onChange={readOnly ? null : v => set(k, v)} />
            {open === k && <p className="hexnote">{what}</p>}
          </div>
        ))}
      </div>
    </div>
  );
}

function ActivityDetail({ec, onSave, onClose, onEdit, settings, setSettings, stage}){
  const [tab, setTab] = useState('plan');
  const e = ec;
  const put = (k, v) => onSave(e.id, {[k]: v});
  const going = !e.finished;
  const next = nextUp(e);
  const preset = presetOn(settings);

  const months = Array.from({length: 12}, (_, i) => {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + i);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  });

  const goals = listOf(e, 'monthGoals');
  const steps = listOf(e, 'steps');

  return (
    <Modal title={e.title || 'Activity'} onClose={onClose}
      footer={<>
        <button className="btn" onClick={onEdit}>Edit the basics</button>
        <button className="btn primary" onClick={onClose}>Done</button>
      </>}>
      <div className="shapepick">
        <span className="eyebrow">Shape</span>
        <div className="row" style={{gap:6}}>
          {[[true,'Preset'],[false,'Custom']].map(([v, l]) => (
            <button key={l} className={'chip' + (preset === v ? ' on' : '')}
              onClick={() => setSettings({...settings, bragPreset: v})}>{l}</button>
          ))}
        </div>
      </div>

      {/* The hexagon belongs to the entry, not to one of the two shapes, so
          the preset table gets it too rather than losing it along with the
          tabs. Folded away, because the table above it is the main event. */}
      {preset ? (
        <>
          <PresetTable ec={e} onSave={onSave} settings={settings} setSettings={setSettings} stage={stage} />
          <details className="shapefold">
            <summary>
              <span>What is this activity made of?</span>
              <small>Six traits, one to five each, drawn as a shape</small>
            </summary>
            <div className="shapefold-in">
              <SkillHexagon ec={e} onSave={onSave} />
            </div>
          </details>
        </>
      ) : (
      <>
      <div className="tape detailtape" role="tablist">
        {[['plan', going ? 'Plan' : 'Looking back'], ['shape','Shape'], ['hours','Hours'], ['money','Money'],
          ['awards','Awards'], ['story','Anecdotes']].map(([k, l]) => (
          <button key={k} role="tab" aria-selected={tab === k}
            className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      {tab === 'plan' && (
        <>
          {going ? (
            <>
              {next && (
                <div className="upnext">
                  <span className="eyebrow">Up next</span>
                  <b>{next.text}</b>
                  {next.kind === 'later' && <small>set for {monthLabel(next.month)}</small>}
                </div>
              )}
              <Field label="What would this look like if it went really well?">
                <Suggesting textarea kind="ideal" value={e.ideal || ''}
                  placeholder="Run the drive myself and hand over something that keeps going without me."
                  onChange={v => put('ideal', v)} />
              </Field>
              <Field label="What are you aiming for overall?">
                <Suggesting textarea kind="goal" value={e.goals || ''}
                  placeholder="Lead a section by senior year. Get the hours up over 150."
                  onChange={v => put('goals', v)} />
              </Field>

              <div className="field">
                <span className="spread">Steps to get there
                  <span className="counter">{steps.filter(x => x.done).length} of {steps.length} done</span></span>
                <ul className="steplist">
                  {steps.map(st => (
                    <li key={st.id}>
                      <Check on={!!st.done} onClick={() => put('steps',
                        steps.map(x => x.id === st.id ? {...x, done: !x.done} : x))} />
                      <span className={st.done ? 'done' : ''}>{st.text}</span>
                      <XBtn onClick={() => put('steps', steps.filter(x => x.id !== st.id))} label="Remove"
                        confirm={st.text} />
                    </li>
                  ))}
                </ul>
                <LogList rows={[]} onChange={r => r.length && put('steps', [...steps, r[0]])}
                  columns={[{k:'text', label:'One thing you need to do', suggest:'step'}]}
                  addLabel="Add step" empty="" />
              </div>

              <div className="field">
                <span>Goals by month</span>
                <ul className="steplist">
                  {goals.sort((a, b) => a.month.localeCompare(b.month)).map(g => (
                    <li key={g.id}>
                      <Check on={!!g.done} onClick={() => put('monthGoals',
                        goals.map(x => x.id === g.id ? {...x, done: !x.done} : x))} />
                      <span className={g.done ? 'done' : ''}>
                        <b className="goalmonth">{monthLabel(g.month)}</b> {g.text}
                      </span>
                      <XBtn onClick={() => put('monthGoals', goals.filter(x => x.id !== g.id))} label="Remove"
                        confirm={g.text} />
                    </li>
                  ))}
                </ul>
                <GoalAdd months={months} onAdd={g => put('monthGoals', [...goals, g])} />
              </div>
            </>
          ) : (
            <p className="logempty">
              This one is finished, so there is nothing left to plan. The hours, money, awards and
              anecdotes are all still here, and they are what goes on your résumé.
            </p>
          )}
        </>
      )}

      {tab === 'shape' && (
        <>
          <p className="hexintro">
            Rate each one from one to five. The shape that comes out is a picture of what
            this activity is, not a score anybody grades you on. Tap a question mark to see
            what a word means here.
          </p>
          <SkillHexagon ec={e} onSave={onSave} />
        </>
      )}

      {tab === 'hours' && <HoursBox ec={e} onSave={onSave} />}

      {tab === 'money' && (
        <LogList rows={listOf(e, 'money')} onChange={r => put('money', r)}
          columns={[
            {k:'date', label:'Date', type:'date', cls:'mono'},
            {k:'amount', label:'Amount', type:'number', step:'0.01', cls:'mono num',
             show: v => money(+v || 0)},
            {k:'what', label:'What for', required:false},
          ]}
          addLabel="Add"
          empty="Nothing yet. Paid work, prize money, a stipend: whatever this activity brought in."
          foot={sumMoney(e) !== 0 && (
            <div className="logtotal">
              <span>Total</span>
              <b className="mono">{money(sumMoney(e))}</b>
            </div>
          )} />
      )}

      {tab === 'awards' && (
        <AwardList rows={listOf(e, 'awards')} onChange={r => put('awards', r)}
          stage={stage} settings={settings} />
      )}

      {tab === 'story' && (
        <LogList rows={listOf(e, 'anecdotes')} onChange={r => put('anecdotes', r)}
          columns={[
            {k:'date', label:'Date', type:'date', cls:'mono'},
            {k:'text', label:'What happened', suggest:'anecdote'},
          ]}
          addLabel="Save it"
          empty="Write things down while you still remember them. These are what essays and interviews are made of, and nobody can reconstruct them two years later." />
      )}
      </>
      )}
    </Modal>
  );
}

function GoalAdd({months, onAdd}){
  const [month, setMonth] = useState(months[0]);
  const [text, setText] = useState('');
  const go = () => {
    if(!text.trim()) return;
    onAdd({id: uid(), month, text: text.trim(), done: false});
    setText('');
  };
  return (
    <div className="logadd">
      <select className="finput" value={month} onChange={e => setMonth(e.target.value)} aria-label="Month">
        {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
      </select>
      <Suggesting kind="goal" className="finput" value={text} placeholder="What you want done by then"
        onChange={v => setText(v)} onKeyDown={e => e.key === 'Enter' && go()} />
      <button className="btn sm" onClick={go}>Add goal</button>
    </div>
  );
}

/* The sheet itself: everything you have done, most important first, in as much
   or as little detail as you want to see. */
function Bragsheet({ecs, update, settings, setSettings, onOpen, onEdit, onExport}){
  const [picking, setPicking] = useState(false);
  const list = useMemo(() => [...ecs].sort((a, b) =>
    (b.priority || 0) - (a.priority || 0) || a.title.localeCompare(b.title)), [ecs]);

  // Across the whole sheet: the most important activities that have something
  // waiting. Not advice, just the things already written down and not yet done.
  const recommended = useMemo(() => list
    .filter(e => !e.finished)
    .map(e => ({e, next: nextUp(e)}))
    .filter(x => x.next)
    .slice(0, 3), [list]);

  const needPlan = list.filter(e => !e.finished && !nextUp(e)).length;
  const show = k => sheetShows(settings, k);
  const setField = (k, v) => setSettings({...settings,
    sheetFields: {...((settings.sheetFields) || DEFAULT_SHEET), [k]: v}});

  const setPrio = (e, v) => update(e.id, {priority: Math.max(0, Math.min(5, v))});

  if(!ecs.length) return (
    <Empty title="Nothing on your sheet yet"
      hint="Add an activity, an honor or a certification and it shows up here, most important first." />
  );

  return (
    <div className="sheetwrap">
      {recommended.length > 0 && (
        <section className="recnext">
          <div className="spread" style={{marginBottom:10}}>
            <span className="eyebrow">Recommended next</span>
            <span className="counter">from what you have already written down</span>
          </div>
          <ul>
            {recommended.map(({e, next}) => (
              <li key={e.id}>
                <button className="recrow" onClick={() => onOpen(e)}>
                  <span className="recact">{e.title}</span>
                  <span className="recwhat">{next.text}</span>
                  <span className="recwhen">
                    {next.kind === 'step' ? 'next step'
                      : next.kind === 'goal' ? 'this month'
                      : monthLabel(next.month)}
                  </span>
                </button>
              </li>
            ))}
          </ul>
          {needPlan > 0 && (
            <p className="recnote">
              {needPlan} {needPlan === 1 ? 'activity has' : 'activities have'} nothing planned.
              Open one and write down a single next step.
            </p>
          )}
        </section>
      )}

      <div className="spread sheethead">
        <span className="eyebrow">{list.length} {list.length === 1 ? 'entry' : 'entries'}, most important first</span>
        <button className="btn sm" onClick={() => setPicking(v => !v)} aria-expanded={picking}>
          {picking ? 'Done choosing' : 'Choose what shows'}
        </button>
      </div>

      {picking && (
        <div className="card fieldpick">
          <p>Tick what you want on each line. Everything is still kept either way.</p>
          <div className="pickgrid">
            {SHEET_FIELDS.map(([k, label]) => (
              <label key={k} className="pickone">
                <input type="checkbox" checked={show(k)} onChange={ev => setField(k, ev.target.checked)} />
                <span>{label}</span>
              </label>
            ))}
          </div>
        </div>
      )}

      <ul className="sheet">
        {list.map(e => {
          const next = nextUp(e);
          const hrs = hoursText(e);
          const cash = sumMoney(e);
          const wins = listOf(e, 'awards');
          const story = listOf(e, 'anecdotes').slice(-1)[0];
          return (
            <li key={e.id} className={'sheetrow' + (e.finished ? ' done' : '')}>
              <span className="sheetprio">
                <PrioBalls value={e.priority || 0} onChange={v => setPrio(e, v)} />
              </span>
              <button className="sheetmain" onClick={() => onOpen(e)}>
                <span className="sheettop">
                  <b>{e.title}</b>
                  {show('role') && e.org && <span className="sheetrole">{e.org}</span>}
                </span>
                <span className="sheetmeta">
                  {show('dates') && dateRange(e) && <span className="metatag">{dateRange(e)}</span>}
                  {show('hours') && hrs && <span className="metatag">{hrs}</span>}
                  {show('money') && cash !== 0 && <span className="metatag">{money(cash)} earned</span>}
                  {show('awards') && wins.length > 0 &&
                    <span className="metatag strong">{wins.length} {wins.length === 1 ? 'award' : 'awards'}</span>}
                  {e.finished && <span className="metatag">Finished</span>}
                </span>
                {show('desc') && e.desc && <span className="sheetdesc">{e.desc}</span>}
                {show('anecdote') && story && <span className="sheetdesc quiet">“{story.text}”</span>}
                {show('next') && next && !e.finished && (
                  <span className="sheetnext">
                    <i aria-hidden="true" />{next.text}
                  </span>
                )}
              </button>
              <span className="sheetgo">
                <button className="btn sm" onClick={() => onEdit(e)}>Edit</button>
              </span>
            </li>
          );
        })}
      </ul>

      <div className="sheetfoot">
        <button className="btn primary" onClick={onExport}>Export as a résumé <IconArrow /></button>
      </div>
    </div>
  );
}

   and what you mean to do in it. */

    <div className={'tcard' + (open ? ' open' : '')}>

              columns={[

/* The Teachers tab: this year's classes, and every year before it. */
function Teachers({settings, setSettings, setTab}){
  const cals = calendarsOf(settings);
  const year = schoolYearLabel();
  const notes = teacherNotesOf(settings);
  const [open, setOpen] = useState(cals.length === 1 ? cals[0].id : null);
  const [past, setPast] = useState(false);

  // Written against the class and the year, created the moment you type.
  const write = (calId, calName, patch) => {
    const found = teacherNote(settings, calId, year);
    const next = found
      ? notes.map(n => n.id === found.id ? {...n, ...patch} : n)
      : [...notes, {id:'t' + uid(), cal:calId, className:calName, year,
                    teacher:'', anecdotes:[], goals:[], ...patch}];
    setSettings({...settings, teacherNotes: next});
  };

  const old = notes.filter(n => n.year !== year)
    .sort((a, b) => String(b.year).localeCompare(String(a.year)));

  if(cals.length === 0) return (
    <>
      <Empty title="No classes set up yet"
        hint="Your classes come from Settings, under Classes and calendars. Add them there and they show up here, each with room for what happened in it." />
      <div style={{marginTop:14}}>
        <button className="btn primary" onClick={() => setTab('settings', 'calendars')}>
          Add your classes
        </button>
      </div>
      {old.length > 0 && <PastYears rows={old} open={past} onToggle={() => setPast(p => !p)} />}
    </>
  );

  return (
    <div style={{maxWidth:760}}>
      <div className="spread dayhead">
        <div>
          <div className="eyebrow">Your teachers</div>
          <p className="tlead">
            One card per class. Write things down while the term is on, and when you ask for a
            letter in the autumn you have something to give them.
          </p>
        </div>
        <span className="metatag">{year}</span>
      </div>

      {cals.map(c => (
        <TeacherCard key={c.id} cal={c} note={teacherNote(settings, c.id, year)}
          open={open === c.id} onToggle={() => setOpen(o => o === c.id ? null : c.id)}
          onChange={patch => write(c.id, c.name, patch)} />
      ))}

      <p className="cvfine" style={{marginTop:14}}>
        Classes are set in Settings, under Classes and calendars. Clearing them for a new school
        year leaves everything here untouched: it is filed by year, so last year's teachers stay
        where they are.
      </p>

      {old.length > 0 && <PastYears rows={old} open={past} onToggle={() => setPast(p => !p)} />}
    </div>
  );
}
