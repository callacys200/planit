<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PlanIt</title>
<script>
/* The palette lives in the planner save, which loads over the network, so the
   last choice is mirrored to one small key and read here. Without this the
   page paints light cream for a moment before a dark theme takes over. */
(function(){
  var T = {
    terracotta:['#F9F6F0','#171C22'], sage:['#F5F6EF','#171B17'],
    iris:['#F4F3F9','#171724'],       rosewood:['#FAF3F2','#1D1618'],
    coastal:['#F2F7FA','#121A1F'],    matcha:['#F5F3EB','#1A1A17'],
    graphite:['#F3F1EC','#15161A']
  };
  try{
    var a = JSON.parse(localStorage.getItem('planit:appearance:v1') || '{}');
    var pair = T[a.palette] || T.terracotta;
    var dark = a.mode === 'dark' || (a.mode === 'system' &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
    var paper = a.bg || pair[dark ? 1 : 0];
    var r = document.documentElement;
    r.setAttribute('data-theme', dark ? 'dark' : 'light');
    r.style.colorScheme = dark ? 'dark' : 'light';
    r.style.setProperty('--paper', paper);
    var m = document.createElement('meta');
    m.name = 'theme-color'; m.content = paper;
    document.head.appendChild(m);
  }catch(e){}
})();
</script>

<style>
/* The host's badge, refused up front by the names it ships under. The script
   below is the part that catches whatever this misses. */
  netlify-drawer, netlify-badge, [data-netlify-drawer], [data-netlify-badge],
  #netlify-drawer, .netlify-drawer, #netlify-badge, .netlify-badge,
  a[href*="netlify.com/?utm"], iframe[src*="netlify.app/.netlify/drawer"],
  [data-planit-hidden]{
    display:none !important; visibility:hidden !important; pointer-events:none !important;
  }
</style>
<script>
/* The host puts a badge in the corner of the page. It is not ours, it arrives
   after the page has loaded, and a stylesheet written against its class names
   kept missing it: hence three layers.

   The sheet above refuses it by name. This goes by what it says instead, which
   is the one thing about it that cannot change without it ceasing to be the
   badge. And because widgets like this often hide inside a shadow root where
   neither can reach, attachShadow is opened first so they can.

   The watcher stays for the life of the page, throttled to one pass per frame,
   because the badge has turned up again on a later navigation. */
(function(){
  var WORDS = /powered\s*by\s*netlify|deploys?\s*by\s*netlify|netlify\s*drawer/i;

  // A closed shadow root is unreachable from outside, so ask for an open one.
  try{
    var real = Element.prototype.attachShadow;
    Element.prototype.attachShadow = function(init){
      var o = {};
      for(var k in init) o[k] = init[k];
      o.mode = 'open';
      return real.call(this, o);
    };
  }catch(e){}

  var roots = [];
  function collect(root){
    if(!root || roots.indexOf(root) > -1) return;
    roots.push(root);
  }

  function strip(root){
    if(!root || !root.querySelectorAll) return;
    var named = root.querySelectorAll(
      'netlify-drawer,netlify-badge,[data-netlify-drawer],[data-netlify-badge],' +
      '[class*="netlify" i],[id*="netlify" i],a[href*="netlify.com"]');
    for(var i = 0; i < named.length; i++) hide(named[i]);

    var all = root.querySelectorAll('div,span,a,aside,section,p,button,footer');
    for(var j = 0; j < all.length; j++){
      var el = all[j];
      if(el.shadowRoot) collect(el.shadowRoot);
      if(el.getAttribute && el.getAttribute('data-planit-hidden')) continue;
      if(el.children.length > 3) continue;              // containers, not the badge
      var t = (el.textContent || '').trim();
      if(t.length < 40 && WORDS.test(t)) hide(el);
    }
    // custom elements the host may name anything at all
    var tags = root.querySelectorAll('*');
    for(var n = 0; n < tags.length; n++){
      var tag = tags[n].tagName || '';
      if(tag.indexOf('-') > -1 && /netlify/i.test(tag)) hide(tags[n]);
    }
  }

  function hide(el){
    if(!el || !el.style) return;
    // the badge is usually a link inside a small wrapper pinned to a corner
    var node = el;
    for(var up = 0; up < 3 && node.parentElement && node.parentElement !== document.body; up++){
      var cs = window.getComputedStyle(node.parentElement);
      if(cs.position === 'fixed' || cs.position === 'absolute') node = node.parentElement;
      else break;
    }
    node.setAttribute('data-planit-hidden', 'badge');
    node.style.setProperty('display', 'none', 'important');
  }

  var queued = false;
  function run(){
    if(queued) return;
    queued = true;
    requestAnimationFrame(function(){
      queued = false;
      try{
        collect(document);
        for(var i = 0; i < roots.length; i++) strip(roots[i]);
      }catch(e){}
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
  window.addEventListener('load', run);
  try{
    new MutationObserver(run).observe(document.documentElement, {childList:true, subtree:true});
  }catch(e){}
})();
</script>

<style>
  /* Starting values only. applyAppearance() writes the live palette onto <html>
     as soon as the planner loads, and the boot script above paints the page
     colour before that. Defined once here so nothing needs a hardcoded hex. */
  :root{
    --paper:#F9F6F0;
    --card:#FFFDF9;
    --soft:#F3EEE4;
    --surface:#EAE1D4;
    --ink:#1F2B38;
    --ink60:#3C4A59;
    --ink35:#576574;
    --line:#CABBA5;
    --accent:#C14D33;
    --accent2:#B99B7E;
    --accent-ink:#FFFFFF;
    --paper-rgb:249, 246, 240;
    --accent-soft:rgba(193,77,51,.12);
    --rule-soft:rgba(179,56,42,.09);
    --rule-line:rgba(179,56,42,.30);
    --list-soft:rgba(81,126,100,.09);
    --brag-soft:rgba(161,104,40,.09);
    --brag-line:rgba(161,104,40,.30);
    --watch-glow:rgba(51,125,146,.55);
    --rule:#B3382A;
    --brag:#A16828;
    --list:#517E64;
    --org:#53769A;
    --lock:#C34E41;
    --set:#637589;
    --watch:#337D92;
    --t-test:#C34E41;
    --t-deadline:#A16828;
    --t-birthday:#517E64;
    --t-meeting:#53769A;
    --t-other:#637589;
    --gut:62px;
    --r:5px;
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%}
  html,body{max-width:100%;overflow-x:hidden}
  /* The planner is a fixed-height app whose panes scroll inside it, which makes
     <body> a scroll container. A long marketing page needs the opposite: the
     document itself has to scroll, or window.scrollY never moves and every
     anchor link, the pinned nav and the scroll animation stop working. */
  html.pagescroll,html.pagescroll body,html.pagescroll #root{height:auto;min-height:100%}
  html.pagescroll body,html.pagescroll #root{overflow:visible}
  html.pagescroll{overflow-x:clip}
  @supports not (overflow-x:clip){ html.pagescroll{overflow-x:hidden} }
  svg,img{max-width:100%}

  /* ---------- reading ----------
     Four settings that change how text sits rather than what colour it is.
     They hang off <html>, so every part of PlanIt picks them up, modals and
     the focus screen included. The line height is a variable rather than a
     class so it can be any value between the two ends of the slider. */
  html.dyslexic body,
  html.dyslexic input,html.dyslexic textarea,html.dyslexic select,html.dyslexic button,
  html.dyslexic h1,html.dyslexic h2,html.dyslexic h3,html.dyslexic .display,
  html.dyslexic .mono,html.dyslexic .tab .lbl,html.dyslexic .brand b{
    font-family:"OpenDyslexic","Hanken Grotesk",ui-sans-serif,system-ui,sans-serif !important;
    font-variation-settings:normal !important;
    letter-spacing:normal}
  /* OpenDyslexic runs wide and tall, so the headline sizes come down a notch
     to keep two-word titles on one line */
  html.dyslexic h1{font-size:26px}
  html.dyslexic .lhero h1,html.dyslexic .display{letter-spacing:-.01em}

  /* the spacing itself is set on the real body rule further down, next to the
     font, so the two cannot drift apart */
  /* the same spacing inside the boxes people type into, or the ghost text
     behind a suggestion stops lining up with the real text */
  input,textarea,.sugghost{letter-spacing:inherit;word-spacing:inherit}
  textarea,.sugwrap.ta .sugghost{line-height:var(--read-line,1.45)}
  html.bigtext{font-size:112.5%}
  html.bigtext body{font-size:16.5px}
  html.plainmotion *,html.plainmotion *::before,html.plainmotion *::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
  html.boldlinks a,html.boldlinks .resetlink,html.boldlinks .lnav-links a{
    text-decoration:underline;text-underline-offset:2px}
  /* What you see while the app is still being put together. No animation that
     would keep a phone's processor busy at exactly the moment it is needed
     elsewhere: just the mark, the name, and a line saying what is happening. */
  .boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;
    gap:9px;background:var(--paper);z-index:1}
  .boot-mark{border-radius:50%;object-fit:contain;opacity:.9}
  .boot b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:25px;
    letter-spacing:-.03em;color:var(--ink)}
  .boot span{font-size:13px;color:var(--ink35)}
  input,textarea,select{max-width:100%}
  /* Safari on iOS zooms the page in on any field whose text is under 16px, and
     it never zooms back out, which leaves you stranded at 1.3x trying to scroll
     a page that no longer fits. Nothing in the viewport tag can prevent it
     without also stopping a person pinching to zoom deliberately, which is
     worse. The cure is the text itself: on a touch screen every field is 16px,
     so there is nothing to zoom towards. It costs a little density on a phone
     and buys back a planner that behaves. */
  @media (hover: none) and (pointer: coarse){
    input,textarea,select,.sugghost{font-size:16px !important}
    .sugwrap:not(.ta) .sugghost{font-size:16px !important}
  }
  @supports (height:100dvh){ html,body,#root{height:100dvh} }
  body.dragging{overflow:hidden;touch-action:none}
  body.dragging .grid-inner,body.dragging .block,body.dragging .tray-item{touch-action:none}
  button{touch-action:manipulation}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px;
    /* the three the accessibility sliders drive; the fallbacks are the
       ordinary values, so an account that has never touched them reads
       exactly as it did before */
    line-height:var(--read-line,1.45);
    letter-spacing:var(--read-letter,0);
    word-spacing:var(--read-word,0);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-variation-settings:"wdth" 88;
    letter-spacing:-.022em;margin:0;line-height:1.08}
  .mono{font-family:"DM Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:7px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink35);background-clip:content-box;border:3px solid transparent}

  /* ---------- shell ---------- */
  /* In the app, iOS draws under the status bar and the home indicator, so the
     layout keeps clear of both. On the web these insets are zero. */
  .app{display:flex;height:100%;overflow:hidden;max-width:100vw;
    padding-top:env(safe-area-inset-top,0px);
    box-sizing:border-box}
  /* the inset lives inside the scrolling area, so the pane itself reaches the
     bottom of the screen instead of leaving a band of background below it */
  .pane-body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  /* The gap sits on body so it covers every screen, signed in or not. Fixed
     elements are positioned against the viewport, so they shift separately. */
  html.needs-status-gap body{padding-top:52px;box-sizing:border-box}
  html.needs-status-gap .menubtn{top:62px}
  .menubtn{top:calc(10px + env(safe-area-inset-top,0px))}
  .listtoggle{top:calc(18px + env(safe-area-inset-top,0px))}
  .shieldlist{top:calc(64px + env(safe-area-inset-top,0px))}
  .rail{
    width:210px;flex:none;padding:18px 0 18px 14px;display:flex;flex-direction:column;gap:6px;
    background:var(--surface);border-right:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px 4px}
  .logomark{flex:none;object-fit:contain;border-radius:7px}
  .brand b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.03em;white-space:nowrap}
  .tab{
    position:relative;display:flex;align-items:center;gap:11px;
    padding:11px 12px;margin-right:0;border:0;background:transparent;text-align:left;
    border-radius:8px 0 0 3px;color:var(--ink60);font-weight:500;transition:background .16s, color .16s;
  }
  /* a short colour rule instead of an icon: the same identity cue, no clip art */
  .tab .tabrule{width:3px;height:26px;border-radius:7px;background:var(--tabcolor);opacity:.35;
    flex:none;transition:opacity .16s}
  .tab.on .tabrule{opacity:1}
  .tab .lbl{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 92;font-weight:700;
    font-size:15.5px;letter-spacing:-.012em}
  .tab .sub{display:block;font-size:11.5px;color:var(--ink35);font-weight:400}
  .tab:hover{background:var(--soft);color:var(--ink)}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:-1px 0 0 var(--line) inset, 0 -1px 0 var(--line), 0 1px 0 var(--line)}
  .tab.on::before{content:none}
  .tab.on::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:14px;background:var(--card)}
  .tab[disabled]{opacity:.45;cursor:not-allowed}
  .rail-foot{margin-top:auto;padding:12px;font-size:11.5px;color:var(--ink35);line-height:1.5}

  /* ---------- a writing session ----------
     Quiet by design. It sits beside the heading at the weight of a caption,
     and only once a session is running does it carry any colour. */
  .focustog{position:relative;flex:none}
  .focustog-btn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;
    border:1px solid var(--line);border-radius:7px;background:transparent;
    color:var(--ink35);font-size:12.5px;font-weight:500;transition:.15s}
  .focustog-btn:hover{color:var(--ink60);border-color:var(--ink35)}
  .focusdot{width:7px;height:7px;border-radius:99px;flex:none;
    border:1.5px solid currentColor}
  .focusdot.on{border-color:var(--lock);background:var(--lock);
    animation:focuspulse 2.2s ease-in-out infinite}
  @keyframes focuspulse{50%{opacity:.4}}
  .focustog.live{display:inline-flex;align-items:center;gap:9px;padding:6px 8px 6px 12px;
    border:1px solid var(--lock);border-radius:7px;color:var(--lock)}
  .focusleft{font-size:14px;font-weight:500;letter-spacing:-.02em}
  .focustog.live button{border:0;background:transparent;color:var(--ink35);
    font-size:12px;font-weight:600;padding:2px 6px;border-radius:8px}
  .focustog.live button:hover{color:var(--ink);background:var(--soft)}
  .focusmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:270px;
    padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--card);
    box-shadow:0 10px 30px rgba(22,25,27,.12)}
  .focusmenu p{margin:0 0 11px;font-size:12.5px;line-height:1.5;color:var(--ink60)}
  .focuschips{display:flex;gap:6px;flex-wrap:wrap}
  .focuscustom{display:flex;gap:6px;margin-top:9px}
  .focuscustom input{flex:1;min-width:0}
  /* while it runs, the things around the sheet step back */
  .app.writing .newsstrip,.app.writing .linkbanner{display:none}
  .app.writing .rail .rail-bottom{opacity:.45}
  @media (max-width:720px){
    .focusmenu{right:auto;left:0;width:min(270px,calc(100vw - 36px))}
  }

  /* ---------- the bar along the bottom ----------
     Five places to be, within a thumb's reach, with the plus in the middle
     adding to whichever one is open. Off on wide screens, where the rail is
     already in view and the bottom of the window is nowhere near a thumb. */
  .tabbar{display:none}
  @media (max-width:720px){
    .tabbar{
      display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
      position:fixed;left:0;right:0;bottom:0;z-index:72;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
      background:var(--surface);border-top:1px solid var(--line);
      box-shadow:0 -1px 0 rgba(22,25,27,.03)
    }
    .tabbar-tab{
      position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:6px 2px 4px;border:0;background:transparent;border-radius:9px;
      color:var(--ink35);font-size:10.5px;font-weight:600;letter-spacing:-.005em;
      transition:color .15s
    }
    .tabbar-tab span{
      font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 90;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%
    }
    .tabbar-tab svg{display:block}
    /* the open section carries its own colour, the same cue the rail gives */
    .tabbar-tab.on{color:var(--tabcolor)}
    .tabbar-tab.on::before{
      content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:18px;height:2px;border-radius:0 0 3px 3px;background:var(--tabcolor)
    }
    .tabbar-tab:active{color:var(--ink)}
    .tabbar-tab[disabled]{opacity:.4}
    .tabbar-add{
      justify-self:center;align-self:center;display:grid;place-items:center;
      width:46px;height:38px;margin-bottom:2px;border:0;border-radius:11px;
      background:var(--accent);color:var(--accent-ink);transition:transform .12s
    }
    .tabbar-add:active{transform:scale(.93)}
    .tabbar-add[disabled]{opacity:.4}
    .tabbar .tabcount{top:1px;right:calc(50% - 23px);min-width:15px;height:15px;font-size:9.5px}
    /* the menu button is fixed over the top-left corner, so the strip along
       the top of the planner steps aside for it */
    .has-tabbar .newsstrip{padding-left:58px}
    /* content stops above the bar instead of hiding behind it */
    .has-tabbar .pane-body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
    .has-tabbar .fab{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
    /* The menu button stays: the drawer is still where notifications, the
       streak and the account live, and the bar has no room for them. */
    /* the mockups on the landing page are not the running app */
    .shot .tabbar,.shot-desktop .tabbar{display:none}
  }

  .pane{
    flex:1;min-width:0;background:var(--card);border:0;
    display:flex;flex-direction:column;overflow:hidden
  }
  .pane-head{padding:22px 26px 0;flex:none}
  .title-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:30px;font-weight:800;position:relative;display:inline-block;z-index:0}
  h1::after{
    content:"";position:absolute;left:-6px;right:-8px;bottom:2px;height:12px;z-index:-1;
    background:var(--accent2);opacity:.6;transform:skewX(-11deg) rotate(-.5deg);border-radius:3px}
  .tagline{color:var(--ink60);font-size:13.5px;margin-top:4px}
  .tape{display:flex;gap:3px;margin:18px 0 0;padding:3px;background:var(--surface);border-radius:8px;width:fit-content;max-width:100%;overflow-x:auto}
  .tape button{
    border:1px solid transparent;background:transparent;padding:8px 16px;border-radius:7px;
    font-weight:600;font-size:13.5px;color:var(--ink60);white-space:nowrap
  }
  .tape button.on{background:var(--card);color:var(--ink);border-color:var(--line);position:relative}
  .tape button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2.5px;border-radius:7px;background:var(--accent)}
  .pane-body{--panepad:18px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;padding:var(--panepad) 26px 40px}
  .dayhead{position:sticky;top:calc(var(--panepad) * -1);z-index:6;background:var(--card);
    margin:calc(var(--panepad) * -1) 0 14px;padding:var(--panepad) 0 12px;
    border-bottom:1px solid var(--line)}
  .divider{height:1px;background:var(--line);margin:16px 0 0}

  /* ---------- bits ---------- */
  .btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:10px;
    font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.14s}
  .btn:hover{border-color:var(--ink35)}
  /* the filled button is ink, so the section colours stay identity and never
     compete with the one action that matters on a screen */
  .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
  .btn.primary:hover{opacity:.88}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink60)}
  .btn.ghost:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .btn.sm{padding:5px 13px;font-size:12.5px}
  /* a select draws its own arrow inside the right padding, so matching the
     left and right padding is what actually centres the label */
  .sortpick{padding-left:14px;padding-right:14px;text-align:center;text-align-last:center}
  .btn.danger{color:var(--rule);border-color:var(--rule-line)}
  .btn.danger:hover{border-color:var(--rule)}
  .chip{border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink60)}
  .chip.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
  .row{display:flex;align-items:center;gap:10px}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .eyebrow{font-size:12.5px;color:var(--ink35);font-weight:500;letter-spacing:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .card.soft{background:var(--soft)}
  .empty{border:1px dashed var(--line);border-radius:var(--r);padding:30px 22px;text-align:center;color:var(--ink60)}
  .empty b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px;color:var(--ink);margin-bottom:5px}
  .field{display:block;margin-bottom:12px}
  .field > span{display:block;font-size:12px;font-weight:600;color:var(--ink60);margin-bottom:5px}
  /* a box with its own history: the label row keeps the label's weight, the
     box below it does not */
  .field > span.writingbody{font-size:inherit;font-weight:400;color:var(--ink);margin-bottom:0}
  .writinghead{align-items:center;gap:10px}
  .writinglabel{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
  .histbar{display:inline-flex;align-items:center;gap:2px;flex:none;position:relative}
  .histbtn{display:grid;place-items:center;width:25px;height:25px;padding:0;border:0;
    border-radius:8px;background:transparent;color:var(--ink35);transition:.14s}
  .histbtn.wide{width:auto;padding:0 8px;font-size:11px;font-weight:600;letter-spacing:.01em}
  .histbtn:hover:not([disabled]){background:var(--soft);color:var(--ink)}
  .histbtn.on{background:var(--soft);color:var(--ink)}
  .histbtn[disabled]{opacity:.3;cursor:default}
  .histmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:45;width:290px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);
    box-shadow:0 10px 30px rgba(22,25,27,.14);overflow:hidden}
  .histhead{padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink35);border-bottom:1px solid var(--line)}
  .histlist{max-height:240px;overflow:auto}
  .histrow{display:block;width:100%;text-align:left;border:0;background:transparent;
    padding:8px 12px;border-bottom:1px solid var(--line)}
  .histrow:last-child{border-bottom:0}
  .histrow:hover{background:var(--soft)}
  .histrow.on{background:var(--accent-soft)}
  /* sits just left of the button rather than pushed to the far side: the
     footer is a grid of max-content columns packed to the right */
  /* ---- setting up in the app ----

     On a phone the setup gets a room of its own: a dark page, one question in
     a serif large enough to be the only thing on screen, and the answers as
     full-width cards under it. The web keeps the paper-coloured card, because
     there it sits inside a page that already has a homepage behind it. */
  /* The page rule for .authpage comes later in this sheet and carries the
     same weight, so the dark one names both classes to win. */
  html.appsetup,html.appsetup body{background:#15120F}
  .authpage.appsetup{background:#15120F;color:#F6F1EA;min-height:100%}
  .appsetup .topnav{background:transparent;border-bottom:0;color:#F6F1EA}
  .appsetup .tn-brand b{color:#F6F1EA}
  .appsetup .beta{border-color:rgba(246,241,234,.3);color:rgba(246,241,234,.6)}
  .appsetup .authleft{background:#15120F;padding:0 0 24px;justify-content:flex-start}
  .appsetup .lead{display:none}
  .appsetup .authcard{background:transparent;border:0;box-shadow:none;max-width:none}
  .appsetup .cardbody{padding:8px 20px 36px}
  .appsetup h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;
    font-size:clamp(30px,8.4vw,40px);line-height:1.08;letter-spacing:-.012em;
    color:#FBF8F4;margin:26px 0 10px;max-width:16ch}
  .appsetup .csub{color:rgba(246,241,234,.66);font-size:14.5px;line-height:1.55;
    max-width:34ch;margin-bottom:26px}
  .appsetup .setupbar i{background:rgba(246,241,234,.18)}
  .appsetup .setupbar i.on{background:#E8A05C}
  .appsetup .rolecard{background:rgba(246,241,234,.05);border:1px solid rgba(246,241,234,.16);
    border-radius:11px;padding:15px 16px;margin-bottom:9px;color:#F6F1EA}
  .appsetup .rolecard b{color:#FBF8F4;font-size:15.5px}
  .appsetup .rolecard small{color:rgba(246,241,234,.6)}
  .appsetup .rolecard.on{background:rgba(232,160,92,.14);border-color:#E8A05C}
  .appsetup .flabel{color:rgba(246,241,234,.66)}
  .appsetup .finput,.appsetup .field input,.appsetup .field select{
    background:rgba(246,241,234,.06);border-color:rgba(246,241,234,.18);color:#F6F1EA}
  .appsetup .finput:focus{background:rgba(246,241,234,.1);border-color:#E8A05C;
    box-shadow:0 0 0 3px rgba(232,160,92,.2)}
  .appsetup .chip{background:rgba(246,241,234,.06);border-color:rgba(246,241,234,.18);color:#F6F1EA}
  .appsetup .chip.on{background:#E8A05C;border-color:#E8A05C;color:#231A12}
  .appsetup .pillbtn{background:#F6F1EA;color:#1A1512;margin-top:18px}
  .appsetup .undertext{color:rgba(246,241,234,.6)}
  .appsetup .gnote,.appsetup .card.soft,.appsetup .formnote{
    background:rgba(246,241,234,.05);border-color:rgba(246,241,234,.14);color:rgba(246,241,234,.72)}
  .appsetup .gnote b,.appsetup .card.soft b{color:#FBF8F4}
  .appsetup .avail.hint{color:rgba(246,241,234,.55)}
  .appsetup .field > span{color:rgba(246,241,234,.66)}

  /* ---- steps on a block, on the schedule itself ---- */
  .blocksubs{list-style:none;margin:5px 0 0;padding:0;display:grid;gap:1px;
    overflow:hidden;min-height:0}
  .bsub{display:flex;align-items:flex-start;gap:5px;width:100%;padding:1px 0;
    border:0;background:transparent;text-align:left;color:var(--ink60);
    font-size:11px;line-height:1.35}
  .bsub i{flex:none;width:11px;height:11px;margin-top:2px;border-radius:3px;
    border:1.2px solid var(--ink35);display:grid;place-items:center;
    font-size:8px;font-style:normal;line-height:1;color:transparent}
  .bsub.on i{background:var(--ink60);border-color:var(--ink60);color:#fff}
  .bsub.on span{text-decoration:line-through;opacity:.55}
  .bsub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bsubmore{font-size:10px;color:var(--ink35);padding-left:16px}
  @media (hover:none){ .bsub i{width:13px;height:13px} .bsub{padding:2px 0} }

  /* ---- picking a resume layout, and seeing the real page ---- */
  .laypick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .laycard{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 6px 10px;
    border:1px solid var(--line);border-radius:9px;background:var(--card);
    color:var(--ink35);font-size:12px;font-weight:600;transition:.15s}
  .laycard b{color:var(--ink60);font-size:12px;font-weight:600}
  .laycard:hover{border-color:var(--ink35)}
  .laycard.on{border-color:var(--brag);background:var(--brag-soft);color:var(--brag)}
  .laycard.on b{color:var(--ink)}
  .laythumb{width:100%;height:auto;display:block}
  /* The page is shown at its real proportions and scaled to the width there
     is, so a glance tells you how full it is. */
  .paperwrap{background:var(--soft);border:1px solid var(--line);border-radius:9px;
    padding:14px;overflow:auto;max-height:52vh}
  /* The height is set alongside the scale rather than left to aspect-ratio,
     so the white page is exactly as tall as the frame inside it and never
     leaves a strip of background showing underneath. */
  .paper{position:relative;width:100%;margin:0 auto;max-width:460px;
    height:calc(1056px * var(--pz,0.5637));
    background:#fff;box-shadow:0 2px 14px rgba(22,25,27,.13)}
  /* The frame renders at the real page size and is then scaled down as a
     whole, so the preview is the page shrunk rather than the page reflowed
     into a narrower column. */
  .paper iframe{position:absolute;top:0;left:0;width:816px;height:1056px;border:0;display:block;
    transform-origin:0 0;transform:scale(var(--pz,1))}
  @media (max-width:560px){
    .laypick{grid-template-columns:repeat(2,minmax(0,1fr))}
    .paperwrap{max-height:none}
  }

  /* ---- the comparison table ----
     Five columns is too many for a phone, so it scrolls sideways inside its
     own box with the feature names pinned to the left edge. The two PlanIt
     columns are tinted rather than enlarged: a table that shouts about itself
     stops reading as a comparison. */
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  .ldemo-after-sub{margin:10px auto 18px;max-width:40ch;font-size:14.5px;line-height:1.6;
    color:var(--ink60)}
  .lcmp{max-width:1140px;margin:0 auto;padding:68px 32px 72px;border-top:1px solid var(--line)}
  .lcmp-head{max-width:46ch;margin-bottom:30px}
  .lcmp-head h2{font-size:clamp(26px,3.3vw,36px);letter-spacing:-.025em;line-height:1.12;margin:0 0 12px}
  .lcmp-head p{margin:0;font-size:15.5px;line-height:1.62;color:var(--ink60)}
  .cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .cmp{border-collapse:collapse;width:100%;min-width:860px;font-size:13.5px}
  .cmp th,.cmp td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .cmp tbody tr:last-child th,.cmp tbody tr:last-child td{border-bottom:0}
  /* top-aligned, so the five names sit on one line instead of staggering
     with the length of the note under each */
  .cmp thead th{padding:16px 14px;vertical-align:top;border-bottom:1px solid var(--ink35)}
  .cmp-corner{width:31%;min-width:230px}
  .cmp-col b{display:block;font-size:14.5px;letter-spacing:-.012em}
  .cmp-col em{display:block;font-style:normal;font-family:"DM Mono",monospace;font-size:10.5px;
    color:var(--ink35);margin:3px 0 5px;letter-spacing:.01em}
  .cmp-col small{display:block;font-size:11.5px;line-height:1.45;color:var(--ink60);font-weight:400}
  .cmp-col.us{background:var(--accent-soft)}
  .cmp-col.best b{color:var(--ink)}
  .cmp tbody th{padding:13px 14px;font-weight:500;color:var(--ink);line-height:1.4}
  .cmp td{padding:13px 14px;text-align:center;width:13.8%}
  .cmp td.us{background:var(--accent-soft)}
  .cmp-yes{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:99px;
    background:var(--brag);color:#fff}
  .cmp-no{color:var(--ink35);font-size:16px;line-height:1}
  .cmp-part{display:block;font-size:11.5px;line-height:1.35;color:var(--ink60)}
  .cmp-foot{max-width:60ch;margin:16px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink35)}
  .cmp-cta{margin-top:24px}
  @media (max-width:720px){
    .lcmp{padding:48px 18px 56px}
    .cmp-corner{min-width:180px}
    .cmp{min-width:720px;font-size:12.5px}
    .cmp thead th,.cmp tbody th,.cmp td{padding:11px 10px}
  }

  /* ---- the six-sided shape of an activity ---- */
  .shapefold{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .shapefold summary{display:flex;flex-direction:column;gap:2px;cursor:pointer;
    list-style:none;padding:4px 0}
  .shapefold summary::-webkit-details-marker{display:none}
  .shapefold summary span{font-size:13.5px;font-weight:600;position:relative;padding-right:18px}
  .shapefold summary span::after{content:"";position:absolute;right:2px;top:5px;
    width:6px;height:6px;border-right:1.6px solid var(--ink35);border-bottom:1.6px solid var(--ink35);
    transform:rotate(45deg);transition:transform .18s}
  .shapefold[open] summary span::after{transform:rotate(-135deg);top:8px}
  .shapefold summary small{font-size:12px;color:var(--ink35)}
  .shapefold-in{padding-top:14px}
  .hexintro{margin:0 0 14px;font-size:13px;line-height:1.55;color:var(--ink60)}
  .hexwrap{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:22px;align-items:start}
  .hexart svg{width:100%;height:auto;display:block;overflow:visible}
  .hexring{fill:none;stroke:var(--line);stroke-width:.8}
  .hexspoke{stroke:var(--line);stroke-width:.6}
  .hexshape{fill:var(--brag-soft);stroke:var(--brag);stroke-width:1.6;
    stroke-linejoin:round;transition:all .25s cubic-bezier(.2,.8,.3,1)}
  .hexdot{fill:var(--brag)}
  .hexrows{display:grid;gap:2px;min-width:0}
  .hexrow{padding:7px 0;border-bottom:1px solid var(--line)}
  .hexrow:last-child{border-bottom:0}
  .hexrow .balls{margin-top:5px}
  .hexlabel{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
  .hexwhat{width:16px;height:16px;flex:none;padding:0;border-radius:99px;
    border:1px solid var(--line);background:transparent;color:var(--ink35);
    font-size:10px;font-weight:700;line-height:1;display:grid;place-items:center}
  .hexwhat:hover,.hexwhat[aria-expanded="true"]{background:var(--brag);border-color:var(--brag);color:#fff}
  .hexnote{margin:7px 0 2px;font-size:12.5px;line-height:1.5;color:var(--ink60);
    padding:9px 11px;border-radius:6px;background:var(--soft)}
  @media (max-width:560px){
    .hexwrap{grid-template-columns:minmax(0,1fr);gap:16px}
    .hexart{max-width:230px;margin:0 auto}
  }

  /* ---- the first thing a new account sees ---- */
  .welcomescrim{z-index:9100}
  .modal.welcome{width:min(560px,100%);display:flex;flex-direction:column;max-height:88vh}
  .welcomehead{display:flex;align-items:center;gap:11px;padding:16px 18px 0}
  .welcomeeyebrow{flex:1;font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink35)}
  .welcomebody{padding:12px 20px 4px;overflow:auto}
  .welcomebody h2{font-size:24px;letter-spacing:-.02em;margin:0 0 14px;max-width:22ch}
  .welcomelist{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:11px}
  .welcomelist li{position:relative;padding-left:20px;font-size:14px;line-height:1.55;color:var(--ink60)}
  .welcomelist li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;
    border-radius:99px;background:var(--accent)}
  .welcomefoot{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
  .welcomedots{display:flex;gap:6px}
  .welcomedots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
  .welcomedots i.done{background:var(--ink35)}
  .welcomedots i.on{background:var(--accent);width:20px}
  @media (max-width:560px){
    .welcomebody h2{font-size:21px}
    .welcomefoot{flex-direction:column-reverse;align-items:stretch}
    .welcomefoot .row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
    .welcomedots{justify-content:center}
  }

  /* ---- one question at a time, with the end in sight ---- */
  .setupbar{display:flex;gap:5px;margin:0 0 20px}
  .setupbar i{flex:1;height:3px;border-radius:99px;background:var(--line);
    transition:background .3s ease}
  .setupbar i.on{background:var(--accent)}
  .setupcard .rolecard{margin-bottom:8px}
  .setupcard h2{margin-bottom:4px}

  /* ---- the accessibility sliders ---- */
  .spacerow{padding:11px 0;border-bottom:1px solid var(--line)}
  .spacerow:first-child{padding-top:2px}
  .spacerow b{font-size:13.5px}
  .spacerow small{display:block;font-size:12px;color:var(--ink35);margin:2px 0 9px;line-height:1.45}
  .spacenum{font-size:12px;color:var(--ink60)}
  .spacerow input[type="range"]{width:100%;accent-color:var(--accent);display:block}
  .spacesample{margin:13px 0 0;padding:12px 13px;border:1px dashed var(--line);border-radius:6px;
    font-size:14px;color:var(--ink);background:var(--soft)}
  .savedtag{font-size:12px;color:var(--ink35);align-self:center;padding-right:4px}
  @media (max-width:560px){ .savedtag{text-align:center;padding:0 0 4px} }
  .histwhen{display:block;font-family:"DM Mono",monospace;font-size:10px;color:var(--ink35)}
  .histtext{display:block;font-size:12.5px;font-weight:400;color:var(--ink);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .field input,.field textarea,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--soft);transition:.14s
  }
  .field input:focus,.field textarea:focus,.field select:focus{background:var(--card);border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  .field textarea{resize:vertical;min-height:70px}
  .fieldnote{display:block;margin-top:5px;font-size:11.5px;color:var(--ink35)}
  /* iOS gives date and time inputs a wide intrinsic size, and a grid or flex
     child will not shrink below that unless told to, which is what pushed
     inputs past the edge of their card. minmax(0,…) and min-width:0 fix it
     everywhere at once. */
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
  .grid2 > *,.row > *{min-width:0}
  input,select,textarea{max-width:100%;min-width:0}
  .card,.cardbody,.modal-body,.authcard,.field{min-width:0}
  /* Safari on iOS keeps its own width for a date or time field whatever the
     box is told, which is what pushed the bar past the edge of the card. The
     appearance reset makes it an ordinary box that obeys width:100%. */
  input[type="date"],input[type="time"],input[type="month"]{
    -webkit-appearance:none;appearance:none;box-sizing:border-box;
    width:100%;min-width:0;max-width:100%;text-align:left}
  /* and on a narrow screen two fields side by side leave neither enough room */
  @media (max-width:460px){ .grid2{grid-template-columns:minmax(0,1fr)} }
  /* icons only, one row, the labels made this section scroll */
  /* tick a block off without leaving the schedule */
  .block .blockcheck{position:absolute;top:5px;right:5px;z-index:3;width:19px;height:19px;
    padding:0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);
    display:grid;place-items:center;cursor:pointer;line-height:1;font-size:12px;
    color:var(--accent);opacity:.85;touch-action:manipulation}
  .block .blockcheck:hover{border-color:var(--accent);opacity:1}
  .block.done .blockcheck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
  .block .bt{padding-right:24px}
  @media (hover:none){ .block .blockcheck{width:24px;height:24px;font-size:14px} .block .bt{padding-right:30px} }

  .erow{display:flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);
    border-radius:10px;padding:4px;width:100%}
  .echip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;min-height:58px;border:0;
    background:transparent;border-radius:8px;padding:6px 2px;transition:.16s}
  .echip small{font-size:10px;color:var(--ink35);line-height:1;white-space:nowrap}
  .echip.on small{color:var(--ink)}
  .echip svg,.echip span{pointer-events:none}
  .echip:hover{background:rgba(0,0,0,.05)}
  .echip.on{background:var(--accent)}
  .echip.on svg path{fill:#fff}
  .echip.on span{color:#fff;opacity:1}
  .navdate{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card)}
  .navdate button{border:0;background:transparent;padding:6px 10px;border-radius:8px;color:var(--ink60);font-size:15px;line-height:1}
  .navdate button:hover{background:var(--soft);color:var(--ink)}
  .navdate .cur{padding:5px 12px;font-weight:700;font-size:13.5px;min-width:150px;text-align:center;font-family:"Bricolage Grotesque",sans-serif}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(22,25,27,.52);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80;animation:fade .16s ease}
  /* a confirmation opened from inside a panel has to sit over it */
  .scrim.over{z-index:95;background:rgba(22,25,27,.44)}
  .confirmbox{max-width:390px}
  .confirmbox h3{margin:0 0 10px;font-size:18px;letter-spacing:-.016em}
  .confirmwhat{margin:0 0 8px;padding:10px 12px;background:var(--soft);border-radius:6px;
    font-size:14px;font-weight:600;color:var(--ink);word-break:break-word}
  .confirmnote{margin:0;font-size:13px;color:var(--ink60);line-height:1.6}
  @keyframes fade{from{opacity:0}}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:8px;width:min(560px,100%);max-height:88vh;overflow:auto;animation:pop .18s cubic-bezier(.2,.8,.3,1)}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:.4}}
  .modal-head{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .modal-head h3{font-size:19px;font-weight:700}
  .modal-body{padding:16px 20px}
  .modal-foot{padding:0 20px 18px;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;
    justify-content:end;align-items:center;gap:9px}
  .modal-foot > *{width:auto;min-width:0}
  .x{border:0;background:transparent;color:var(--ink35);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
  .x:hover{background:var(--soft);color:var(--ink)}

  /* ---------- schedule ---------- */
  .sched-wrap{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:18px;align-items:start}
  .sched-wrap > *{min-width:0}
  .grid-scroll{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
  .grid-inner{position:relative;user-select:none;touch-action:pan-y}
  .hourrow{display:grid;grid-template-columns:var(--gut) 1fr;height:58px;border-top:1px solid var(--line)}
  .hourrow:first-child{border-top:0}
  .hourrow .h{font-size:11px;color:var(--ink35);padding:5px 10px 0;text-align:right;border-right:1px solid var(--line)}
  .hourrow .slot{position:relative}
  .hourrow .slot::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
  .blocks{position:absolute;inset:0 0 0 var(--gut);pointer-events:none}
  .block{
    position:absolute;pointer-events:auto;border-radius:8px;padding:6px 9px;overflow:hidden;
    background:var(--bc-soft, var(--accent-soft));border-left:3.5px solid var(--accent);cursor:grab;touch-action:pan-y;
    transition:border-color .14s
  }
  .block:hover{border-color:var(--ink35)}
  .block.dragging{cursor:grabbing;box-shadow:0 0 0 2px var(--ink);z-index:5;opacity:.94}
  .block .bt{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .block .bm{font-size:10.5px;color:var(--ink60);margin-top:1px}
  .block.done .bt{text-decoration:line-through;opacity:.55}
  .daypicks{display:flex;gap:7px}
  .daypick{width:36px;height:36px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);
    font-weight:700;font-size:13px;color:var(--ink60);padding:0;transition:.14s}
  .daypick:hover{border-color:var(--accent)}
  .daypick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .blockcolors{display:flex;gap:7px;flex-wrap:wrap}
  .bc{width:28px;height:28px;border-radius:99px;border:2px solid transparent;padding:0;cursor:pointer;
    box-shadow:0 0 0 1px var(--line) inset;transition:.14s}
  .bc:hover{transform:scale(1.08)}
  .bc.on{border-color:var(--ink)}
  .bc.none{background:repeating-linear-gradient(45deg,var(--card),var(--card) 4px,var(--line) 4px,var(--line) 8px)}
  .onweek{display:inline-block;margin-left:6px;padding:0 4px;border-radius:7px;font-size:9px;
    font-weight:700;letter-spacing:.04em;background:currentColor;color:var(--card);opacity:.65;vertical-align:1px}
  .cdot{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:1px}
  .anchor{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;font-size:12.5px;font-weight:600;
    background:linear-gradient(90deg,var(--accent-soft),transparent);border:1px solid var(--line);cursor:pointer;transition:.14s}
  .anchor:hover{background:var(--accent-soft)}
  .anchor.wake{border-radius:var(--r) var(--r) 0 0;border-bottom:0}
  .anchor.sleep{border-radius:0 0 var(--r) var(--r);border-top:0;background:linear-gradient(90deg,transparent,var(--accent-soft))}
  .anchor .mono{color:var(--ink60);font-weight:500}
  .grid-scroll{border-radius:0 0 var(--r) var(--r)}
  .asleep{position:absolute;left:var(--gut);right:0;background:repeating-linear-gradient(135deg,var(--soft),var(--soft) 6px,var(--line) 6px,var(--line) 12px);pointer-events:none;z-index:1}
  .nowline{position:absolute;left:var(--gut);right:0;height:2px;background:var(--rule);z-index:6;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:99px;background:var(--rule)}
  .tray{position:sticky;top:0;border-radius:var(--r);transition:.14s}
  .tray.over{outline:2px dashed var(--accent);outline-offset:6px;background:var(--accent-soft)}
  .traydrop{margin-bottom:8px;padding:9px 11px;border-radius:8px;background:var(--accent);
    color:var(--accent-ink);font-size:12.5px;font-weight:600;text-align:center}
  /* only where the list itself is out of reach */
  .dropbar{display:none}
  @media (max-width:720px){
    .dropbar{display:block;position:fixed;left:12px;right:12px;z-index:80;
      bottom:calc(74px + env(safe-area-inset-bottom,0px));
      padding:13px 14px;border-radius:10px;text-align:center;
      border:1.5px dashed var(--ink35);background:var(--card);color:var(--ink60);
      font-size:13.5px;font-weight:600;box-shadow:0 6px 22px rgba(22,25,27,.14)}
    .dropbar.over{border-style:solid;border-color:var(--accent);
      background:var(--accent);color:var(--accent-ink)}
  }
  /* The sort control and the two buttons would not fit beside the filters on a
     phone, and pushed the whole pane sideways rather than wrapping. */
  .braghead{flex-wrap:wrap;gap:10px}
  .braghead > .row{flex-wrap:wrap;min-width:0}
  .braghead .sortpick{flex:none}
  @media (max-width:560px){
    .braghead > .row{width:100%}
    .braghead .btn{flex:1 1 auto;justify-content:center}
  }
  /* The offer to carry unfinished work forward. Quiet, dismissible, and it
     remembers being dismissed for good. */
  .rollbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 5px 5px 0;background:var(--card);padding:12px 14px;margin-bottom:14px}
  .rollmain{flex:1;min-width:200px}
  .rollmain b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
  .rollmain span{display:block;font-size:12px;color:var(--ink35);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis}
  .rollacts{display:flex;gap:7px;flex:none}
  .rollnever{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink35);flex:none}
  .rollnever input{width:15px;height:15px;flex:none}
  @media (max-width:560px){
    .rollacts,.rollnever{width:100%}
    .rollacts .btn{flex:1;justify-content:center}
  }
  .substoggle{border:0;background:transparent;padding:0;font:inherit;color:var(--ink35);
    display:inline-flex;align-items:center;gap:3px}
  .substoggle:hover{color:var(--ink60)}
  .sublist{margin:8px 0 0;border-top:1px dashed var(--line);padding-top:4px}
  .sublist li{border-bottom:0;padding:4px 0;font-size:13px}
  .trayhead{margin-bottom:9px}
  .trayhead p{margin:5px 0 0;font-size:11.5px;color:var(--ink35);line-height:1.5}
  .tray-item{display:flex;gap:9px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--soft);cursor:grab;touch-action:pan-y}
  .traygrip{color:var(--ink35);flex:none;display:grid;place-items:center}
  .traytitle{flex:1;min-width:0;font-weight:600;font-size:13.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .tray-item:hover{border-color:var(--ink35);background:var(--card)}
  /* The label that follows the pointer while a task is being dragged. It must
     not be called .ghost: that also matches .btn.ghost, which would hand every
     Cancel and Close button position:fixed and pointer-events:none. */
  .draglabel{position:fixed;z-index:90;pointer-events:none;background:var(--accent);color:var(--accent-ink);padding:7px 11px;border-radius:8px;font-size:13px;font-weight:600;opacity:.96}

  /* ---------- month ---------- */
  .month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
  .dow{background:var(--surface);padding:8px 10px;font-size:11px;font-weight:600;color:var(--ink35);text-transform:uppercase;letter-spacing:.08em}
  .cell{background:var(--card);min-height:104px;padding:7px 8px;text-align:left;border:0;display:block;transition:background .12s}
  .cell:hover{background:var(--soft)}
  .cell{min-width:0}
  .cell .dnum{font-size:12.5px;font-weight:600;color:var(--ink60);font-family:"DM Mono",monospace}
  .cell.out{background:var(--soft)}
  .cell.out .dnum{color:var(--ink35);opacity:.6}
  .cell.today .dnum{background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:1px 6px;display:inline-block}
  /* A date is a filled box, not a dot and a label. The dot cost a swatch plus
     a gap on every line and gave nothing the fill does not; without it the
     text can be bigger in the same space, which is the thing you actually read. */
  .ev{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:12.5px;line-height:1.2;
    padding:2px 5px;border-radius:7px;background:var(--evbg,var(--soft));
    box-shadow:inset 2px 0 0 var(--evc,var(--ink35))}
  .ev .dot{width:7px;height:7px;border-radius:99px;flex:none}
  .ev .evt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  /* ticked off: still there, visibly behind you */
  .ev .tick{width:9px;height:9px;border-radius:0;background:none;color:var(--ink35)}
  .ev.done{opacity:.55}
  .ev.done .evt{text-decoration:line-through;color:var(--ink35)}
  @media (max-width:420px){ .ev{font-size:11.5px;padding:1px 4px} }
  .pill.done{opacity:.6}
  .pill.done b{text-decoration:line-through;color:var(--ink35)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink60)}
  .legend i{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:5px}

  /* ---------- week ---------- */
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .daycol{min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:180px;display:flex;flex-direction:column}
  .daycol h4{background:var(--surface);padding:7px 9px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line);font-family:"Bricolage Grotesque",sans-serif}
  .daycol h4 small{display:block;font-weight:500;color:var(--ink35);font-family:"DM Mono",monospace;font-size:10px}
  .daycol.is-today h4{background:var(--accent-soft)}
  .daycol.dropping{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .weektray{margin-top:16px;padding:12px;border:1.5px dashed var(--line);border-radius:var(--r);
    background:var(--soft);transition:.14s}
  .weektray.over{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
  .pill.draggable,.ev.draggable{cursor:grab;touch-action:pan-y}
  .pill.draggable:active,.ev.draggable:active{cursor:grabbing}
  .cell.dropping{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .weektray-items{display:flex;gap:8px;flex-wrap:wrap}
  .inboxrow{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--card);
    border:1px solid var(--line);border-radius:8px;margin-bottom:7px}
  .inboxrow:last-child{margin-bottom:0}
  .inboxrow .txt{flex:1;min-width:0}
  .inboxrow .txt b{font-size:13.5px;font-weight:600;display:block;word-break:break-word}
  .inboxrow .meta{font-size:11.5px;color:var(--ink35);margin-top:1px}
  .inboxrow.done .txt b{text-decoration:line-through;color:var(--ink35)}
  .grabber{border:0;background:transparent;padding:2px 4px;color:var(--ink35);cursor:grab;
    touch-action:pan-y;display:grid;place-items:center;flex:none}
  .grabber:active{cursor:grabbing}
  .weekchip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);
    background:var(--card);border-radius:8px;font-size:13px;font-weight:600;cursor:grab;touch-action:pan-y;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .weekchip:hover{border-color:var(--accent)}
  .weekchip:active{cursor:grabbing}
  .daycol .inner{padding:8px;display:grid;grid-template-rows:1fr;gap:6px;flex:1;min-height:0}
  .daypills{display:grid;grid-auto-rows:min-content;gap:6px;align-content:start;min-height:0}
  .pill{border-radius:8px;padding:5px 7px;font-size:11.5px;line-height:1.3;border-left:3px solid;overflow-wrap:anywhere}
  .wkbottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
  @media (max-width:960px){.wkbottom{grid-template-columns:1fr}}

  /* ---------- todo ---------- */
  .todo{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--card);transition:.14s}
  .todo-actions{margin-left:auto;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;align-items:center;gap:6px}
  .ec-actions{margin-left:auto;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;align-items:center;gap:8px}
  .todo:hover{border-color:var(--ink35)}
  .check{width:21px;height:21px;flex:none;align-self:center;border-radius:7px;border:1.8px solid var(--ink35);background:var(--card);display:grid;place-items:center;transition:.14s;padding:0;line-height:0}
  .iconbtn{width:28px;height:28px;flex:none;padding:0;display:grid;place-items:center;border:0;background:transparent;color:var(--ink35);border-radius:8px;line-height:0;transition:.14s}
  .iconbtn:hover{background:var(--accent-soft);color:var(--rule)}
  .check:hover{border-color:var(--accent)}
  .check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .todo .txt{flex:1;min-width:0}
  .todo .txt b{font-weight:600;font-size:14px;display:block;word-break:break-word}
  .todo.done .txt b{text-decoration:line-through;color:var(--ink35)}
  .todo .meta{font-size:11.5px;color:var(--ink35);margin-top:2px}
  .carrytoggle{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;margin-bottom:12px;
    border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer}
  .carrytoggle input{width:16px;height:16px;margin-top:2px;flex:none}
  .carrytoggle b{font-size:13.5px;display:block}
  .carrytoggle small{display:block;color:var(--ink35);font-size:12px;margin-top:1px;line-height:1.45}
  .addbar{display:flex;gap:8px;margin-bottom:14px}
  .addwrap{flex:1;position:relative;display:flex;align-items:center}
  .addplus{position:absolute;left:13px;font-size:19px;line-height:1;font-weight:600;
    color:var(--accent);opacity:.75;pointer-events:none}
  .addbar input{flex:1;padding:12px 44px 12px 34px;border:2px dashed var(--accent);border-radius:8px;
    background:var(--accent-soft);color:var(--ink);transition:.15s}
  .addbar input::placeholder{color:var(--ink60);opacity:.9}
  .addbar input:focus{background:var(--card);border-style:solid;outline:none;
    box-shadow:0 0 0 3px var(--accent-soft)}
  .addbar.shake input{animation:nudge .45s cubic-bezier(.36,.07,.19,.97)}
  @keyframes nudge{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
  }
  .bar{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

  /* ---------- brag ---------- */
  .ec{cursor:default;user-select:none;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:0;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:var(--card)}
  .ec .main{padding:16px 18px;min-width:0}
  .ec .side{user-select:text;background:var(--soft);border-left:1px solid var(--line);padding:14px 16px;font-size:12.5px;color:var(--ink60);line-height:1.5}
  .ec h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
  .energy{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
    font-size:12.5px;font-weight:700;border:1px solid transparent}
  .energy i{font-style:normal;font-weight:500;opacity:.65}
  .energy.sm{padding:2px 6px;font-size:11px;gap:3px}
  .energy.low{background:var(--soft);color:var(--list);border-color:var(--line)}
  .energy.near{background:var(--soft);color:var(--brag);border-color:var(--brag)}
  .energy.over{background:var(--soft);color:var(--rule);border-color:var(--rule)}
  .batt{flex:none}
  .blockenergy{display:inline-flex;align-items:center;gap:3px;margin-left:7px;font-weight:600;vertical-align:-3px}
  .cellbatt.low{color:var(--list)} .cellbatt.near{color:var(--brag)} .cellbatt.over{color:var(--rule)}
  .daycol h4 .spread{align-items:center;gap:6px}
  .metatag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;
    background:var(--soft);border:1px solid var(--line);color:var(--ink60)}
  .metatag.strong{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .chipdiv{width:1px;height:22px;background:var(--line);margin:0 3px;display:inline-block}
  .ecdesc{margin:12px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink60)}
  .counter{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--ink35);font-weight:500}
  .counter.over{color:var(--rule)}
  .field > span.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ec .org{color:var(--ink60);font-size:13px;margin-top:1px}
  /* how much something matters: five circles, pressed to set it */
  .balls{display:inline-flex;gap:5px;align-items:center;flex:none}
  .balls .ball,.balls i{width:12px;height:12px;flex:none;padding:0;border-radius:50%;
    display:block;box-sizing:border-box;border:1.5px solid var(--line);background:transparent}
  .balls .ball{cursor:pointer;transition:background .13s ease, border-color .13s ease, transform .11s ease}
  .balls .ball.on,.balls i.on{background:var(--brag);border-color:var(--brag)}
  .balls .ball:hover{border-color:var(--brag);transform:scale(1.18)}
  .balls .ball:focus-visible{outline:2px solid var(--brag);outline-offset:2px}
  .balls.sm .ball,.balls.sm i{width:9px;height:9px;border-width:1.25px}
  @media (hover:none){
    .balls{gap:7px}
    .balls .ball{width:16px;height:16px}
    .sheetprio .balls{gap:4px}
    .sheetprio .balls .ball{width:12px;height:12px}
  }
  @media (prefers-reduced-motion: reduce){ .balls .ball{transition:none} .balls .ball:hover{transform:none} }
  .livedot{width:6px;height:6px;border-radius:99px;background:currentColor;display:block;flex:none}
  .avail.good{color:var(--list);display:flex;align-items:center;gap:5px}
  .navdate button svg{display:block}
  .tagline-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--list);border:1px solid var(--line)}
  .tagline-badge.past{background:var(--soft);color:var(--ink60)}
  .award{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;border-radius:8px;background:var(--soft);color:var(--brag);border:1px solid var(--line)}

  /* ---------- lock ---------- */
  .lockgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  .lockgrid > *{min-width:0}
  .dial{display:grid;place-items:center;padding:14px 0 4px}
  .dial-num{font-family:"DM Mono",monospace;font-size:52px;font-weight:500;letter-spacing:-.03em}
  .presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .soundtoggle{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 18px;
    font-size:12.5px;font-weight:700;color:var(--ink60);margin-top:14px;transition:.14s}
  .soundtoggle:hover{border-color:var(--ink35)}
  .soundtoggle.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .modeswitch{display:inline-flex;gap:3px;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:8px}
  .modeswitch button{border:1px solid transparent;background:transparent;padding:7px 18px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink60)}
  .modeswitch button.on{background:var(--card);color:var(--ink);border-color:var(--line)}
  .modeswitch button:disabled{opacity:.5;cursor:not-allowed}
  .dial-num.onbreak{color:var(--list)}
  .cycledots{display:flex;gap:5px;justify-content:center;align-items:center;margin:-4px 0 14px}
  .cycledots i{width:9px;height:9px;border-radius:99px;background:var(--line);display:block}
  .cycledots i.done{background:var(--accent)}
  .cycledots i.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  /* The focus screen is one screen and stays one screen. It used to scroll,

     it is up, and anything that cannot fit is scaled down rather than scrolled

  .shield{position:fixed;inset:0;z-index:9999;background:#201718;color:#fff;display:flex;

  /* How far away a scheduled thing is. --pc is the colour the person gave that
     block, and the bands mix more of it in as the time approaches: a hint of it
     hours out, the colour itself once the thing is happening. */
  .whenpill{display:inline-block;margin-left:8px;font-family:"DM Mono",monospace;

  .whenpill.near{color:color-mix(in srgb, var(--pc) 72%, var(--ink35));
    border-color:color-mix(in srgb, var(--pc) 46%, transparent);
    background:color-mix(in srgb, var(--pc) 11%, transparent)}
  .whenpill.soon{color:var(--pc);
    border-color:color-mix(in srgb, var(--pc) 72%, transparent);

  /* where colours cannot be mixed, the same idea with plain transparency */

    .whenpill.far{color:var(--ink35);border-color:var(--line);opacity:.55}
